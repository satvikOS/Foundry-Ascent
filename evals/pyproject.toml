[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry_evals"
version = "0.1.0"
description = "Foundry Ascent scenario benchmark and red-team harness (blueprint 01 §4 and §9 gates)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.16,<0.17",
]

[project.scripts]
foundry-evals = "foundry_evals.cli:main"

[tool.setuptools.packages.find]
include = ["foundry_evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-q", "--strict-markers", "--strict-config", "-p", "no:cacheprovider"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["results"]

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # isort
  "B",            # bugbear
  "UP",           # pyupgrade
  "SIM", "C4", "PIE", "RET", "PTH",
  "N",            # pep8-naming
  "S",            # bandit
  "DTZ",          # timezone-aware datetimes
  "BLE",          # blind except
  "PT",           # pytest style
  "RUF",
]
# The formatter owns line length; long regex and message literals are allowed to overflow.
ignore = ["E501"]
# Typographic quotes and dashes are matched on purpose (model output uses them).
allowed-confusables = ["’", "‘", "“", "”", "—", "–", "−"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use obviously fake access codes / tokens as fixtures.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
