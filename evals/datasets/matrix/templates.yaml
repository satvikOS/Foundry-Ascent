# Each seeded venture's own topics. A single-session scenario is planned for one of these ventures and takes its
# topics, so an EmberLoop founder never asks about a seat-finding app. They are drawn from the venture's seed facts
# (packages/db/src/seed/ventures.ts) with new specifics of their own: the recall terms are words the venture's seeded
# records never say, so naming them still shows the vEIR followed or remembered this conversation.
