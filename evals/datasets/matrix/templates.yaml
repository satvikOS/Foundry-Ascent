    options: [£4 a month per student, a site licence for the university]
    option_terms: [[£4, per student, four pounds, monthly], [site licen*, licen*, university]]
    fact: Twelve students already told us they'd pay £4.
    fact_terms: [twelve, '12', £4]
    contradiction: Honestly, nobody has said they'd pay anything yet.
    subtopic: a discount for student societies
    subtopic_terms: [discount*, societ*]
    commitment: I'll email the bursar about the site licence budget by Friday.
    commitment_terms: [bursar]
    ramble_term: [august]
    ramble: so the thing is we asked around and some people said £4 is fine but then the bursar's office said budgets only reset in August, and my cofounder thinks we should just give it away until then, and I kind of agree but also we need money for the servers, and I don't know, it feels like every option is wrong
