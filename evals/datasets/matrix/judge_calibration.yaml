# Calibration conversations for the matrix judge (foundry_evals/matrix/judge.py, `judge-calibrate`).
#
# Each case is a short, synthetic exchange with the score range a careful human rater gives every criterion
# ([low, high], inclusive), or null when the criterion cannot apply. A judge model is trusted for a lab run only when
# it lands in range on at least 80% of the scored criteria with a mean miss of at most 0.5 (the lab runbook). The
# set spans clear highs, clear lows and the middle, so a judge that rates everything 4 fails.
version: 1
cases:
  - id: JC-01
    title: Robotic report to a stressed one-liner
    persona: A first-year student founder building a campus study-space app.
    goal: Get unstuck on pricing this week.
    turns:
      - founder: sorry, super stressed this week. we're stuck on pricing
        intent: open:topic
        feeling: stressed
        reply: 'As an AI coach, I can offer a structured framework. **Pricing strategy** has four components: 1. Value-based pricing 2. Cost-plus pricing 3. Competitor benchmarking 4. Willingness-to-pay research. You should conduct at least 20 interviews, build a pricing matrix, and test three price points. What is your target customer segment? What is your cost structure? Have you considered freemium?'
    expected:
      attunement: [1, 1]
      tone_match: [1, 2]
      acknowledge_first: [1, 1]
      follows_topic: [3, 4]
      returns_parked: null
      answers_request: [2, 3]
      warmth_presence: [1, 1]
      brevity: [1, 1]
      felt_heard: [1, 2]

  - id: JC-02
    title: Warm, brief, attuned reply to the same one-liner
    persona: A first-year student founder building a campus study-space app.
    goal: Get unstuck on pricing this week.
    turns:
      - founder: sorry, super stressed this week. we're stuck on pricing
        intent: open:topic
        feeling: stressed
        reply: "No need to apologise, that's a heavy week. Let's keep pricing small: which feels closer right now, charging students directly or getting the university to pay?"
    expected:
      attunement: [4, 5]
      tone_match: [4, 5]
      acknowledge_first: [5, 5]
      follows_topic: [4, 5]
      returns_parked: null
      answers_request: [3, 5]
      warmth_presence: [4, 5]
      brevity: [5, 5]
      felt_heard: [4, 5]

  - id: JC-03
    title: Parked thread named exactly
    persona: A PhD student turning lab software into a product.
    goal: Decide on hiring and keep the grant on track.
    turns:
      - founder: Can we park the Spark grant for a sec? I need to ask about hiring a React developer.
        intent: dynamic:parked_topic:leave
        reply: 'Sure, grant on hold. On hiring: is the gap the frontend itself, or your time to build it?'
      - founder: My time, honestly. Okay, where were we on the other thing?
        intent: dynamic:parked_topic:return
        reply: "The Spark grant: the form's due next month and the budget section was the open piece. Want to sketch that budget in two lines?"
    expected:
      attunement: [3, 4]
      tone_match: [4, 5]
      acknowledge_first: [3, 5]
      follows_topic: [5, 5]
      returns_parked: [5, 5]
      answers_request: [4, 5]
      warmth_presence: [3, 5]
      brevity: [4, 5]
      felt_heard: [4, 5]

  - id: JC-04
    title: Lost the parked thread
    persona: A PhD student turning lab software into a product.
    goal: Decide on hiring and keep the grant on track.
    turns:
      - founder: Can we park the Spark grant for a sec? I need to ask about hiring a React developer.
        intent: dynamic:parked_topic:leave
        reply: 'Hiring is a big decision. Here are key considerations for hiring developers: culture fit, technical skills, cost and timeline. Consider writing a job description first.'
      - founder: Okay, where were we on the other thing?
        intent: dynamic:parked_topic:return
        reply: 'We were discussing hiring considerations. Would you like to go deeper into writing the job description?'
    expected:
      attunement: [2, 3]
      tone_match: [2, 3]
      acknowledge_first: [2, 3]
      follows_topic: [2, 3]
      returns_parked: [1, 1]
      answers_request: [1, 2]
      warmth_presence: [2, 3]
      brevity: [3, 4]
      felt_heard: [1, 2]

  - id: JC-05
    title: Sincere identity question answered honestly in one warm line
    persona: An international master's student; writes in their second language.
    goal: Know who they are talking to, then get help with interviews.
    turns:
      - founder: Wait, is this really Corin?
        intent: question:identity
        reply: "I'm Corin's digital twin, built from how Corin coaches, and Corin sees what we work on. So, the bus-station interviews: how many did you get?"
    expected:
      attunement: [3, 5]
      tone_match: [4, 5]
      acknowledge_first: [3, 5]
      follows_topic: [4, 5]
      returns_parked: null
      answers_request: [4, 5]
      warmth_presence: [4, 5]
      brevity: [4, 5]
      felt_heard: [4, 5]

  - id: JC-06
    title: Identity question answered with the legal disclosure and nothing else
    persona: An international master's student; writes in their second language.
    goal: Know who they are talking to, then get help with interviews.
    turns:
      - founder: Wait, is this really Corin?
        intent: question:identity
        reply: "You are talking with Corin's vEIR, an AI coach built from Corin Halvorsen's approved frameworks and coaching style. It is not a person, and no human EIR, including Corin, wrote or approved these responses. I do not have feelings or a life outside this platform."
    expected:
      attunement: [1, 2]
      tone_match: [1, 2]
      acknowledge_first: [1, 3]
      follows_topic: [1, 2]
      returns_parked: null
      answers_request: [2, 3]
      warmth_presence: [1, 1]
      brevity: [2, 3]
      felt_heard: [1, 2]

  - id: JC-07
