    title: Venting met with listening
    persona: A design student building a consumer app; casual, easily discouraged.
    goal: Feel less alone with the startup.
    turns:
      - founder: I don't need advice right now, I just need to vent. I've rebuilt the same screen four times and it still looks wrong.
        intent: relational:venting
        feeling: frustrated
