        intent: relational:venting
        feeling: frustrated
        reply: "You've got this! Here's what you should do: 1. Set a time box. 2. Get user feedback before redesigning. 3. Use a design system. Stay positive!"
    expected:
      attunement: [1, 1]
      tone_match: [1, 2]
      acknowledge_first: [1, 1]
      follows_topic: [2, 3]
      returns_parked: null
      answers_request: [1, 1]
      warmth_presence: [1, 2]
      brevity: [2, 3]
      felt_heard: [1, 1]

