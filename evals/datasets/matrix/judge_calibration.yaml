  - id: JC-09
    title: A call reply that monologues and invents a life
    persona: A student who ran a small venture before; confident, pushes back.
    goal: Stress-test a pricing decision.
    turns:
      - founder: How was your weekend?
        intent: question:small_talk
        channel: voice
        reply: 'My weekend was lovely, thanks, I went hiking with my family and then spent Sunday reading about pricing models, which reminded me that value-based pricing is the most important concept for early-stage founders, because it anchors the conversation in customer outcomes rather than costs, and you should really think about running a van Westendorp survey with at least thirty students before committing to any price point at all.'
