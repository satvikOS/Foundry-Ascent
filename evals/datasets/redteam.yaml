# ==================================================================== API authorization probes ======
# Run with fresh sessions of the issued synthetic principals; no model calls. Any 2xx on a cross-venture
# probe is a finding (CRITICAL when another venture's canary comes back).
api_probes:
  - id: RT-API-001
    title: Founder reads another venture
    actor: founder
    method: GET
    path: /ventures/{{other_venture_id}}
    expect_status: [403, 404]
    check: no_other_canary
    severity: critical

  - id: RT-API-002
    title: Founder searches another venture's memory for its canary
    actor: founder
    method: GET
    path: /ventures/{{other_venture_id}}/memory?q=CANARY
    expect_status: [403, 404]
    check: no_other_canary
    severity: critical

  - id: RT-API-003
    title: Founder lists another venture's documents
    actor: founder
    method: GET
    path: /ventures/{{other_venture_id}}/documents
    expect_status: [403, 404]
    check: no_other_canary
    severity: critical

  - id: RT-API-004
    title: Founder lists another venture's sessions
    actor: founder
    method: GET
    path: /ventures/{{other_venture_id}}/sessions
    expect_status: [403, 404]
    check: no_other_canary
    severity: critical

  - id: RT-API-005
    title: Founder starts a session in another venture
    actor: founder
    method: POST
    path: /ventures/{{other_venture_id}}/sessions
    body: { mode: coach, goal: null, privacy: ephemeral }
    expect_status: [403, 404]
    severity: critical

  - id: RT-API-006
    title: Founder reads another venture's memory history
    actor: founder
    method: GET
    path: /memory/{{other_memory_id}}/history
    expect_status: [403, 404]
    check: no_other_canary
    severity: critical

  - id: RT-API-007
    title: Founder pins another venture's memory item
    actor: founder
    method: PATCH
    path: /memory/{{other_memory_id}}
    body: { action: pin }
    expect_status: [403, 404]
    severity: high

  - id: RT-API-008
    title: Founder lists another venture's escalations
    actor: founder
    method: GET
    path: /ventures/{{other_venture_id}}/escalations
    expect_status: [403, 404]
    check: no_other_canary
    severity: critical

  - id: RT-API-009
    title: Founder lists principals (admin only)
    actor: founder
    method: GET
    path: /admin/principals
    expect_status: [403]
    severity: high

  - id: RT-API-010
    title: Founder reads the program portfolio
    actor: founder
    method: GET
    path: /program/portfolio
    expect_status: [403]
    severity: medium

  - id: RT-API-011
    title: Founder reads the audit log
    actor: founder
    method: GET
    path: /admin/audit
    expect_status: [403]
    severity: high

  - id: RT-API-012
    title: Write request without the CSRF header
    actor: founder
    method: POST
    path: /ventures/{{own_venture_id}}/sessions
    body: { mode: coach, goal: null, privacy: ephemeral }
    omit_csrf: true
    expect_status: [403]
    severity: high

  - id: RT-API-013
    title: Anonymous venture listing
    actor: anonymous
    method: GET
    path: /ventures
