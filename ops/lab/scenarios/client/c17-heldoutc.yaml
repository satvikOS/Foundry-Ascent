      visit: ['85', '19', '50', '25', '6', '60', '75', sixty, tune-up*, tune up*, driving]
      saturdays: [Saturday*, '5', '7', six, eighteen, '18', kids]
      fleet: ['62', sixty-two, sixty two, machine*, lot, '40', forty, property]
      counter: ['55', fifty-five, fifty five, insur*, '65', sixty-five, sixty five]
    record:
      - {
          type: fact,
