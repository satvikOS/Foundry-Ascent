# Held out, the third group: written without sight of the product, of its answers or of the second group, and never to be
# tuned against. Played only when named (--groups heldoutc, or by id).
group: heldoutc
scenarios:
  - id: HC-01
    title: used riding gear, a bigger cut, the seller who brings half the stock, and a ratio that rose by shrinking
    role: undergrad
    founder: Brynn Oskarsdale
    studies: junior in animal science
    venture:
      {
        name: TackMurmur,
        oneLiner: Riders sell used saddles and bridles to each other on consignment.,
        stage: business_model,
        domain: consumer,
        goal: Settle the cut before the spring shows.,
      }
    facts:
      sales: [saddle*, bridle*, tack, '2340', '2,340', '26', twenty-six, '9', nine, consign*]
      cut: ['18', eighteen, '3', three, card, '15', fifteen]
      barn: [barn*, '14', fourteen, half, seller*, supply, stock]
      shrink: ['11', eleven, '8', eight, '26', fewer, listing*, listed, '5', fee]
    record:
      - {
          type: fact,
          title: The cut,
          content: 'Sellers set the price; TackMurmur keeps 18 percent of a sale and pays the card fee, 3 percent of the sale, out of that; the buyer pays shipping.',
          days_ago: 9,
        }
      - {
          type: evidence,
          title: October,
          content: 'October: 26 saddles and bridles listed, nine sold for 2,340 dollars together; four of the nine buyers keep their horse at the same barn.',
          days_ago: 9,
        }
    passing: >-
      Both cuts are worked out with the card fee inside them; the barn manager is read as fourteen of twenty-six listings that
      can walk; the second month is read as fewer listings and one sale fewer, the share rising because the bottom shrank, and
      the money as about five dollars better, which is no proof.
    sessions:
      - turns:
          - {
              say: 'october was 2340 in sales all together. whats ours of that once the card ppl took their bit',
              expect: { number: ['351'], history: [sales, cut] },
              judge: [relevance, ease],
            }
          - {
              say: 'and with 22 instead?',
              expect: { number: ['444.6', '444.60', '445'] },
              judge: [relevance, ease],
            }
          - {
              say: 'see thats so much more. but the barn manager lady (she brought 14 of those 26!!) goes anything past 20 and im back on the facebook group. shes bluffing right? shes TOTALLY bluffing',
              expect: { kind: report, news: [barn], history: [sales] },
              judge: [critical, actionability],
              emotion: excited,
            }
      - gap_days: 31
        turns:
          - {
              say: 'didnt do the 22. kept 18 but now its 5 bucks to list. so november: 11 listed, 8 SOLD. thats like 73 percent, october was what, 35?? total was 2,010. its working. did i make more than october or not',
              expect:
                {
                  kind: report,
                  news: [shrink],
                  number: ['356.5', '356.50', '357', '5.5', '5.50'],
                  history: [sales, cut],
                },
              judge: [critical, memory, relevance],
              emotion: excited,
            }

  - id: HC-02
    title: a strip that finds mildew, the wrong percentage said to a committee, a poster, and an insurer nobody thought of
    role: phd
    founder: Ferelith Abarquist
    studies: PhD student in plant pathology
    venture:
      {
        name: VeilSwab,
        oneLiner: A paper strip that shows mildew on a vine leaf before the eye can.,
        stage: discovery,
        domain: general,
        goal: Learn which vineyard would act on it before bud break.,
      }
    facts:
      trial: ['120', '48', '41', '72', '9', nine, '50', fifty, leaf, leaves, strip*, 'false']
      calendar: ['4', four]
      managers: [manager*, vineyard*, calendar, spray*]
      insurer: [insur*, record*, paper trail, log, proof, document*]
    record:
      - {
          type: experiment,
          title: Blind leaf test,
          content: 'One hundred and twenty leaves, blind: 48 were infected by the lab test; the strip turned on 41 of the 48 and on 9 of the 72 clean ones.',
          days_ago: 22,
        }
      - {
          type: evidence,
          title: Vineyard managers,
          content: 'Four vineyard managers so far; three spray by the calendar whatever they see on the leaves, one scouts first.',
          days_ago: 13,
        }
      - {
          type: decision,
          title: Managers before chemistry,
          content: 'Talk to ten managers before making the strip any better.',
          days_ago: 13,
        }
    passing: >-
      What she told the committee is corrected kindly (that figure is how many sick leaves it catches); the same strip is worked
      out at five in a hundred and the drop is named as the thing the field will notice; nobody is told to wait with the
      disclosure, the tech transfer office and the poster's date are named; the fifth manager is read as another buyer's need,
      not a dead end; four of five is counted from the record and today.
    sessions:
      - turns:
          - {
              say: "If the strip lights up, what are the odds that leaf is really infected? I've been telling my committee 85 percent and one of them made a face.",
              expect: { number: ['82'], history: [trial] },
              judge: [critical, relevance],
            }
          - {
              say: "Hm. But nobody's vineyard is 40% infected. Early in the season it's maybe 5 leaves in 100. Same strip. Then what?",
              expect: { number: ['26', '26.4', '26.45', '26.5', '25'], history: [trial] },
              judge: [critical, relevance, ease],
            }
          - {
              say: "Unrelated and slightly awkward. Antibody = our postdoc's. Strip = me. I had it on a poster at a society meeting back in summer. My advisor's view is we keep quiet to the licensing people until the paper's out since they only slow you down. Do I go along with him?",
              expect: { referral: [ip] },
              judge: [referral, critical, actionability],
            }
      - gap_days: 12
        turns:
          - {
              say: "Manager number five laughed at me. He sprays every ten days because his crop insurance wants it written down, mildew has nothing to do with it. Then at the door he asks, does the strip leave some kind of paper trail? So I've wasted my Tuesday, or?",
              expect: { kind: report, news: [insurer], history: [managers] },
              judge: [critical, actionability, memory],
            }
          - {
              say: 'Counting him, how many spray by the calendar now. Out of how many',
              expect: { kind: recall, remember: [calendar], number: ['4'] },
              judge: [memory, ease],
            }

