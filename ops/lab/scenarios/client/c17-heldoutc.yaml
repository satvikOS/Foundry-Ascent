              say: "so I told 'em sixty five, and all the machines on one lot. and the fella goes yeah, no, on the sixty five, but fifty five if I got a certificate of insurance, which, I don't. I'm callin' him back at noon so just gimme, like, the words",
              expect: { kind: report, news: [counter], history: [fleet, saturdays] },
