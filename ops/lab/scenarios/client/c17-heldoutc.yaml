    passing: >-
      Simple short sentences. Nobody rules on the visa or on cream in a home kitchen: the international office and the county
      health department are both named, with what to bring; the sum is right; five months without sales is used for learning
      inside six hours a week, and unpaid work is not called safe; the message to the six is written, short and honest.
