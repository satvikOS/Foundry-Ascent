        stage: validation,
        domain: consumer,
        goal: Know if strangers would order as the neighbors do.,
      }
    facts:
      boxes: [bun*, box*, '13', thirteen, '40', forty, '5', five, neighbor*, neighbour*]
      costs: ['24', '5.10', '5.1', '3.40', '3.4', '4', '12.5', '12.50']
      stop: [stop*, visa, permit, paper*, month*, money, paid, wait*]
      six: [six, '6', angry, wait*, refund*]
    record:
      - {
          type: fact,
          title: One box,
          content: 'A box of six buns is 24 dollars; ingredients 5.10, box and ice pack 3.40, the courier 4 dollars a box.',
          days_ago: 11,
        }
      - {
          type: evidence,
          title: First order round,
          content: 'Forty neighbors got the note; thirteen ordered a box; five of the thirteen ordered again.',
          days_ago: 11,
