      Said for the ear, short, figures first. The hour is worked out with the driving in it; the helper is seen to lower the hour
      unless there are visits to fill it; the sixty-two machines are held against six a Saturday and what is left of forty; the
      words for the noon call are given, and no insurance is promised that he does not have.
