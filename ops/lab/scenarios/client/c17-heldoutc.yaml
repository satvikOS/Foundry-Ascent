          - {
              say: "okay so get this. property outfit, they got uh sixty two machines, want 'em all done before the snow flies, so like six weeks, and they'll go forty a machine. sixty two! I about hugged the guy",
              expect: { kind: report, news: [fleet], history: [visit, saturdays] },
              judge: [critical, relevance, actionability],
              emotion: excited,
