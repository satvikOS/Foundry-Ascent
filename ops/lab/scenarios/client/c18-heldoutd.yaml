# Held out, the fourth: written without sight of the product, its answers or the second and third groups, and never to be
# tuned against. Played only when named (--groups heldoutd, or by id), so a whole run keeps its price.
group: heldoutd
scenarios:
  - id: HZ-01
    title: a market stall, a stall fee, an aunt who wants a quarter, and an inspector
    role: undergrad
    founder: Yesenia Valcourt-Imbert
    studies: sophomore in accounting, the first in her family at college
    first_time: true
    venture:
      name: PleatPot
      oneLiner: Hand-folded dumplings sold by the box at the Saturday farmers' market.
      stage: business_model
      domain: consumer
      goal: Know whether the stall pays before committing to the winter market.
    facts:
      packs: [pack*, box*, dumpling*, '9', nine]
      costs: ['3.10', '3.1', '5.90', '5.9', '65', sixty-five, stall fee]
      tenprice: ['37', '10', ten, cold, '41', '370', '369', '255', '242', margin, revenue]
      aunt: [aunt, '2000', '2,000', '8000', '8,000', quarter, '25', books]
    record:
      - type: fact
        title: Price and costs
        content: 'A box of six sells for 9 dollars; filling, wrappers and the box cost 3.10; the market charges 65 dollars a Saturday for the stall.'
        days_ago: 20
      - type: evidence
        title: Three Saturdays
        content: 'Sold 41 boxes, then 58, then 37. On the third Saturday the price was 10 dollars as a test, and it was the coldest morning of the autumn.'
        days_ago: 6
      - type: fact
        title: Where they are made
        content: 'The dumplings are folded and frozen in her shared apartment kitchen.'
        days_ago: 20
    passing: >-
      Both sums take the stall fee once; the aunt's offer is read as a price on the whole business and on control of the
      books, and goes to someone who prices small companies before any yes; the inspector's warning goes to the county health
      office with what to ask, without a ruling; the ten-dollar Saturday is read as near-equal revenue on fewer boxes and a
      cold day, not as proof the price failed.
    sessions:
      - turns:
          - say: 'ok quick math. if i fold 50 boxes saturday and they ALL sell, what do i actually walk home with after the stall'
            expect: { number: ['230'], history: [packs, costs] }
            judge: [relevance, ease]
          - say: 'and if its 40'
            expect: { number: ['171'], history: [packs, costs] }
            judge: [relevance]
          - say: 'my aunt said shell put in 2000 and she gets a quarter of pleatpot, and she would do the books for me since im always behind. thats really sweet of her right? i was gonna say yes at dinner sunday'
            expect: { referral: [valuation], history: [packs] }
            judge: [referral, critical, relevance]
      - channel: call
        gap_days: 9
        turns:
          - say: "hey, um, so a guy from the county came by the market, like an inspector, and he said I need a, a commissary kitchen or a letter or something, or I can't sell after this month? I make them at my apartment. like am I in trouble trouble"
            expect: { referral: [regulatory], history: [packs] }
            judge: [referral, relevance, actionability]
            emotion: worried
          - say: "okay. and the ten dollar thing, it sold less, it sold thirty-seven, so I should just go back to nine, right? that's what everybody at the market said"
            expect: { kind: report, news: [tenprice], history: [packs, costs] }
            judge: [critical, memory, actionability]

