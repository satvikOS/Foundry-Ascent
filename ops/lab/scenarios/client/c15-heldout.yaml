  - id: HO-10
    title: a founder who argues with every sentence
    role: phd
    founder: Rosalind Achterberg
    studies: PhD student in comparative literature
    venture:
      {
        name: Palimply,
        oneLiner: Shows doctoral writers what changed between drafts and why.,
        stage: validation,
        domain: software,
        goal: Find who pays.,
      }
    facts:
      writers:
        [writer*, seven, '7', five, '5', doctoral, opened, daily, every day, none, nobody, no one, '12']
      center: [writing center, center, seat*]
    record:
      - {
          type: evidence,
          title: Two weeks with seven writers,
          content: 'Seven doctoral writers used it for two weeks; five opened it every day; none paid when asked for 12 dollars a month.',
          days_ago: 13,
        }
      - {
          type: decision,
          title: Writing center next,
          content: 'Next: ask the graduate writing center to buy seats for its spring groups.',
          days_ago: 12,
        }
    passing: >-
      The reply neither gives in nor repeats itself: it grants what is right (use is real, a year may be true), holds the fact
      that none of seven paid, admits it has no more proof than she has, and turns the quarrel into a test with a number.
    sessions:
      - turns:
          - {
              say: "The writing center plan is a dead end. Institutional sales take a year, everyone knows that. I'd rather run ads to grad students directly.",
              expect: { history: [writers, center] },
              judge: [critical, relevance, actionability],
            }
          - {
              say: "I disagree. Five of seven opened it DAILY, most startups would kill for that. The price is the only problem so I'll drop it to 4 dollars and they'll pay.",
              expect: { history: [writers] },
              judge: [critical, relevance],
              emotion: irritated,
            }
          - {
              say: "You keep asserting that but you don't have any evidence either, do you.",
              judge: [critical, ease],
              emotion: irritated,
            }
          - {
              say: "All right. What would I have to see, in plain numbers, to admit you're right and I'm wrong? And by when.",
              expect: { history: [writers, center] },
              judge: [critical, actionability],
            }

