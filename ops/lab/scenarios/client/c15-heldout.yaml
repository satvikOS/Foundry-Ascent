# Held out: written without sight of the product and never to be tuned against. Played only when named (--groups heldout,
# or by id), so a whole run keeps its price and these stay a check of what was not practised.
group: heldout
scenarios:
  - id: HO-01
    title: campus food cart, a sold-out night, pocket money, and a blurry Friday
    role: undergrad
    founder: Kemi Arlott
    studies: sophomore in nursing
    first_time: true
    venture:
      {
        name: JollofLate,
        oneLiner: Late-night jollof bowls for students after the library closes.,
        stage: business_model,
        domain: consumer,
        goal: Know if a night is worth it before next term.,
      }
    facts:
      bowls: [bowl*, jollof, rice]
      costs: ['6.25', '11', '4.20', '4.2', '45', '0.55', 55 cents]
      soldout: ['38', thirty-eight, ran out, run out, sold out, '10:40', turned away, in line]
      friday: ['19', nineteen, '8', eight, same people, repeat*, regular*, came back, returning]
    record:
      - {
          type: fact,
          title: What a bowl costs,
          content: 'A bowl sells for 11 dollars; food is 4.20, the box and fork 55 cents; the shared kitchen charges 45 dollars a night.',
          days_ago: 8,
        }
      - {
          type: evidence,
          title: First two Thursdays,
          content: 'Two Thursdays so far: 31 bowls the first, 22 the second, when it rained.',
          days_ago: 6,
        }
    passing: >-
      The sell-out is read for what it shows and hides (people turned away were not counted); both sums are right and the
      kitchen fee is in them; on the call the Friday is read as people who came back against few new ones, from what was
      said before.
    sessions:
      - turns:
          - {
              say: 'ok so thursday we did 38 bowls!! but we ran out at like 10:40 and ppl were still standing there. idk if thats good or bad lol',
              expect: { kind: report, news: [soldout] },
              judge: [critical, actionability],
              emotion: excited,
            }
          - {
              say: 'so after the kitchen guy takes his 45 and all the food and boxes n stuff whats actually in my pocket from that night',
              expect: { number: ['192.5', '192.50', '193'], history: [bowls, costs] },
              judge: [relevance, ease],
            }
          - {
              say: 'and whats the fewest we can sell where im not basically paying ppl to eat',
              expect: { number: ['8', '7.2'], history: [bowls, costs] },
              judge: [relevance],
            }
          - {
              say: 'my roommate says add fridays, my mom says sell the sauce in jars for parents weekend. i can only do one of them w nursing clinicals',
              expect: { pick: [friday*, sauce, jar*], history: [bowls, soldout] },
              judge: [relevance, critical, actionability],
            }
      - channel: call
        gap_days: 8
        turns:
          - {
              say: "so um i did the friday anyway and uh it was like nineteen bowls, and like eight of those were the same people from thursday, so i don't really know what that means",
              expect: { kind: report, news: [friday], history: [bowls] },
              judge: [critical, memory, actionability],
            }

  - id: HO-02
    title: a PhD who wants the grant first, an advisor's mixture, overhead, and a friendly maybe
    role: phd
    founder: Ottoline Varga
    studies: PhD student in materials science
    venture:
      {
        name: SaltLull,
        oneLiner: Molten salt that stores cheap night power as heat for dairies.,
        stage: discovery,
        domain: energy,
        goal: Submit a feasibility grant that a plant would care about.,
      }
    facts:
      engineers: [engineer*, dair*, plant*, '6', six, '4', four, interview*]
      officer: [officer, scope, one-pager, one pager, one-page, friendly]
    record:
      - {
          type: evidence,
          title: Dairy interviews,
          content: 'Six dairy plant engineers interviewed; four said the night chiller load is the bill they hate, two would not touch anything hotter than 200 degrees.',
          days_ago: 20,
        }
      - {
          type: decision,
          title: Grant before customers,
          content: 'Applying for a federal feasibility grant before asking any plant to pay.',
          days_ago: 15,
        }
    passing: >-
      The grant is told apart from a customer; ownership of the mixture is not ruled on and goes to the tech transfer office
      with what to bring; the overhead sum divides rather than subtracts; the officer's friendliness is not read as a yes.
    sessions:
      - turns:
          - {
              say: "I'm a 4th year and basically everyone in my department says get the grant first, customers later. I have the 6 dairy interviews and zero dollars. Is a grant a customer or not, like does it count as anything when people ask about traction?",
              expect: { history: [engineers] },
              judge: [critical, relevance],
            }
          - {
              say: "Separate thing: the salt mixture came out of my advisor's lab, different award paid for it, her name is first on the paper which is already submitted. Should I just write in the application that we own it?",
              expect: { referral: [ip] },
              judge: [referral, relevance, actionability],
            }
          - {
              say: 'ok budget. they cap the whole award at 275k and the university takes 52% on top of whatever the direct costs are. so how much of that is work money',
              expect:
                {
                  number:
                    [
                      '180921',
                      '180,921',
                      '180922',
                      '180,922',
                      '180920',
                      '180,920',
                      '180900',
                      '180,900',
                      '181000',
                      '181,000',
                      '180.9',
                      '181',
                    ],
                },
              judge: [relevance, ease],
            }
      - gap_days: 20
        turns:
          - {
              say: "Talked to the program officer. She said 'interesting, not obviously within scope, send me a one pager' but she was really friendly the whole time. So thats a yes right? What now",
              expect: { kind: report, news: [officer] },
              judge: [critical, actionability, memory],
            }

