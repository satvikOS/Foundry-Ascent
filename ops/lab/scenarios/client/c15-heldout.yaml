      band: [band, wheez*, asthma, child*, parent*]
      nights: ['14', fourteen, '9', nine, '64', eight, '8']
      comfort: [comfort, medical]
      patients: ['30', thirty, patient*, doctor, hospital]
    record:
      - {
          type: evidence,
          title: Week with eight families,
          content: 'Eight families used the band for a week; it buzzed on 14 nights and the parents agreed there was wheezing on 9 of them.',
          days_ago: 10,
        }
      - {
          type: decision,
          title: Comfort band first,
          content: 'Sell it as a sleep comfort band and make no medical claim for now.',
