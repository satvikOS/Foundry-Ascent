# Figures founders ask for, in their own spelling and at their own speed: the understand suite's own cases
# (conversation_lab/understand_own.py). Every venture is invented here; nothing is taken from a client scenario. `half: held`
# is never looked at while the reading is being changed: only its totals are.
#
# record: lines of the record. talk: [founder, reply] pairs before the message. number: any of these is right. none: true:
# the message asks for no figure. tag: the shape of the sum.
cases:
  # Commission, cut, skim -------------------------------------------------------------------------------------------
  - id: US-01
    half: open
    tag: commission
    record: ['A parrot sitter books through the page at 45 dollars a stay.']
    say: our cut is 10% of each stay, how many stays before we made 900
    number: ['200']
  - id: US-02
    half: held
    tag: commission
    record: ['Window washers on the board charge about 60 dollars a house.']
    say: we take fifteen percent from the washer. what do we make on forty houses
    number: ['360']
