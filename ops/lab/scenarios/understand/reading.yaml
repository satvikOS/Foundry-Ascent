# What a message shows, who must decide it, what else it asks and which option to take: the understand suite's own cases
# (conversation_lab/understand_own.py), invented here. `half: held` is never looked at while the reading is being changed.
#
# no_result: nothing happened, so there is no verdict. settles: what would settle it is a number with both sides. shows: one of
# these words is in what it shows. referral: who decides (any of). no_referral: nobody does. second: a word of the second
# thing asked. pick / not_pick: the option. first: a word of the first point (the most urgent of several things told).
