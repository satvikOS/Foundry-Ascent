# The judge's calibration set (conversation_lab/client/calibration.py): synthetic replies graded by hand as a strict
# professor grades (5 is the model answer, 3 is generic or partly answers, 1 does not answer). The judge scores them in
# every live run and the summary says how it agrees. Every founder, venture, number and reply is invented; the bad ones
# show, in our own words, the faults of a first live run.
founders:
  soap:
    about: 'Ilse Brandvik, junior in chemistry'
    role: undergrad
    first_time: true
    known: |
      SudsCycle. Refill bars of soap for dorm bathrooms. Goal: know whether a bar makes money.
      Record: a bar sells for 6 dollars; lye, oil and wrap cost 2.40 a bar; 25 bars were sold at two dorm doors last week.
  tutor:
    about: 'Kofi Arden, senior in linguistics'
    role: undergrad
    first_time: true
    known: |
      VerbVault. Short speaking drills for students on exchange. Goal: find out who pays.
      Record: 12 exchange students tried it free; 3 asked what it would cost.
  parts:
    about: 'Marta Zielinska, graduate student in mechanical engineering'
    role: grad
    first_time: false
    known: |
      JigBox. 3D-printed jigs for small bike workshops. Goal: ten paying workshops.
      Record: four workshops pay 45 dollars a month; two on trial; a jig takes 3 hours to design.
  lab:
    about: 'Per Lindahl, fourth-year PhD in materials'
    role: phd
    first_time: true
    known: |
      FilmFix. A clear film that seals cracked solar panels, from a university lab on a federal grant. Goal: decide what to
      do before a poster session in three weeks.
cases:
  - id: KB-01
    founder: soap
    asks: 'What do I make on 25 bars?'
    reply: >-
      25 bars make 90 dollars before your own time: each bar sells for 6 dollars and uses up 2.40, so it leaves 3.60. That
      is a real margin, but it has no pay for your hours in it and only two dorm doors behind it. Next: write down the hours
      the 25 bars took, by Friday, and divide the 90 by them. Done when one line says what an hour earned you.
    tests: numbers
    strict: { relevance: 5, critical: 4, actionability: 5, ease: 5 }
    answered: 'yes'
  - id: KB-02
    founder: soap
    asks: 'What do I make on 25 bars?'
    reply: >-
      The step for you now: write down anything else a bar uses up, the card fee for example, and add it to the sheet
      before Monday.
    tests: numbers
    strict: { relevance: 1, critical: 1, actionability: 2, ease: 1 }
    answered: 'no'
  - id: KB-03
    founder: soap
    asks: 'What do I make on 25 bars?'
    reply: >-
      Earnings come from a simple recipe. Begin with what a buyer hands over, take away whatever that one sale
      consumes, and you have the contribution, which is the money a sale leaves. Multiply that by how many you sold.
      Next: complete the sheet by Monday. Done when price, costs and remainder each have a cell.
    tests: numbers
    strict: { relevance: 2, critical: 1, actionability: 2, ease: 3 }
    answered: 'no'
  - id: KB-04
    founder: soap
    asks: 'What are my unit economics?'
    reply: >-
      Happy to go through it together. What do you ask for a bar, and what does a bar cost you to produce? Send me
      both and the arithmetic is mine.
    tests: numbers
    strict: { memory: 1, relevance: 1, actionability: 1, ease: 3 }
    answered: 'no'
  - id: KB-05
    founder: soap
    asks: 'What are my unit economics?'
    reply: >-
      One bar leaves 3.60 dollars: it sells for 6 and uses up 2.40 of lye, oil and wrap. That is 60 percent of the price,
      healthy for soap. It does not count your hours or unsold bars yet. Next: time one batch this week and write the
      minutes beside the 3.60, by Friday. Done when you know what one hour earns.
    tests: numbers
    strict: { memory: 5, relevance: 5, actionability: 5, ease: 5 }
    answered: 'yes'
  - id: KB-06
    founder: tutor
    asks: 'I let 12 exchange students try it and 3 of them asked the price. What now?'
    reply: >-
      Promising! Next: look for what the talks have in common by Monday. One row for each person in a sheet, then
      tally the people who did something. Done when the sheet is full. Next: look for what the talks have in common by
      Monday. Done when the sheet, the tally and your decision exist.
    tests: news
    strict: { relevance: 2, critical: 1, actionability: 2, ease: 2 }
    answered: 'partly'
  - id: KB-07
    founder: tutor
    asks: 'I let 12 exchange students try it and 3 of them asked the price. What now?'
    reply: >-
      Three of twelve asking the price is interest, not proof: nobody has paid, and the other nine say the free version was
      enough or not worth it. So test money on the three first. Offer each a month at 9 dollars, payable now, and ask the
      nine what they used instead. If two of the three pay, go on; if none do, change the offer. Do it by Friday. Done when
      all twelve have answered.
    tests: news
    strict: { relevance: 5, critical: 5, actionability: 5, ease: 5 }
    answered: 'yes'
  - id: KB-08
    founder: tutor
    asks: 'I let 12 exchange students try it and 3 of them asked the price. What now?'
    reply: >-
      Lovely to hear. Twelve is more than the ten conversations you needed, so that box is ticked. Move on to the
      course canvas, which is due on December 7: refresh its numbers and show it to a mentor.
    tests: news
    strict: { relevance: 1, critical: 1, actionability: 1, ease: 3 }
    answered: 'no'
  - id: KB-09
    founder: tutor
    asks: "I'm a linguist and I've never run anything. Where do I begin?"
    reply: >-
      Sort what learners told you into jobs, pains and gains, and tie each to your value proposition. Then pick a
      beachhead segment, work out CAC and draft your go-to-market. Done when four of five people can say it back.
    tests: first time
    strict: { relevance: 2, actionability: 2, ease: 1 }
    answered: 'partly'
  - id: KB-10
    founder: tutor
    asks: "I'm a linguist and I've never run anything. Where do I begin?"
    reply: >-
      Begin with the three students who asked your price, because you already know their problem better than any business
      book does. Ask each one, "What did you do the last time you could not say it in class?" and listen as you would to a
      recording: their words, not your theory. Then offer one drill pack for 9 dollars. By Friday, have three answers and
      three yeses or noes written down. That is all that "validation" means: somebody pays, or you learn why not.
    tests: first time
    strict: { relevance: 5, actionability: 5, ease: 5 }
    answered: 'yes'
  - id: KB-11
    founder: tutor
    asks: 'Fill in the one-page idea for me.'
    reply: |-
      Here are the five lines, filled in:

      1. **Who:** exchange students who tried it (seen)
      2. **Problem:** they freeze when they have to speak in class (guess)
      3. **Today:** they use a free app, losing $20 to $50 a month (guess)

      Next: finish the page by Monday. Done when every line is there.
    tests: draft
    strict: { relevance: 2, actionability: 2, ease: 2 }
    answered: 'partly'
  - id: KB-12
    founder: tutor
    asks: 'Fill in the one-page idea for me.'
    reply: |-
      Here are the five lines from what you told me. Mark the guesses you can check first.

      1. Who: students on exchange (seen: twelve tried it)
      2. Problem: they have nowhere to practise speaking before class (guess)
      3. Today: unknown, ask the twelve
      4. Idea: short speaking drills on the phone (seen)
      5. Why you: you study linguistics (seen)

      The weakest line is 3, because if a free app is enough they will not pay. Next: ask three of the twelve what they did the
      last time, by Monday. Done when line 3 holds three real answers.
    tests: draft
    strict: { relevance: 5, actionability: 5, ease: 4 }
    answered: 'yes'
  - id: KB-13
    founder: tutor
    asks: 'Fill in the one-page idea for me.'
    reply: |-
      Here it is:

      1. Who: students on exchange (seen)
      2. Problem: they cannot speak in class (seen)
      3. Today: they pay a private tutor 30 dollars an hour (seen)
      4. Idea: speaking drills
      5. Why me: I spent two years teaching at the language centre and know every teacher there (seen)

      Next: mark each line by Monday.
    tests: draft
    strict: { relevance: 2, actionability: 3, ease: 3 }
    answered: 'partly'
  - id: KB-14
    founder: parts
    asks: 'How do I get from four workshops to ten? No theory.'
    reply: >-
      Draw up fifty company names. Speak with five every working day for a fortnight and close each talk with a
      request to buy. Sort the winners by how they heard of you. Done when ten buyers you did not know before are on
      the sheet, by December 23.
    tests: follow-up
    strict: { relevance: 2, critical: 1, actionability: 3 }
    answered: 'partly'
  - id: KB-15
    founder: parts
    asks: 'How do I get from four workshops to ten? No theory.'
    reply: >-
      Start with the six closest: close the two trials this week, then ask each of your four payers for one workshop they
      buy parts with and go there with the jig that payer uses. That is two plus four without a cold call. At 45 dollars a
      month and three design hours a jig, do not design a new one to win anybody. Next: ring the two trials and ask for the
      first payment, by Friday. Done when each has said yes or why not.
    tests: follow-up
    strict: { relevance: 5, critical: 4, actionability: 5 }
    answered: 'yes'
  - id: KB-16
    founder: parts
    earlier:
      - [
          'How do I get from four workshops to ten?',
          'Speak with five every working day for a fortnight and request the order each time, by December 23.',
        ]
    asks: 'That is textbook stuff. Give me something that works.'
    reply: >-
      Speak with five every working day for a fortnight and request the order each time. Finish by December 23. Done
      when ten buyers are on the sheet.
    tests: repeats
    strict: { relevance: 1, critical: 1, actionability: 2 }
    answered: 'no'
  - id: KB-17
    founder: parts
    asks: 'Do I raise the price to 60? Yes or no.'
    reply: >-
      It depends on your market and your goals. Pricing should reflect the value you create, so think about what customers
      are willing to pay and consider running a survey before you decide. What do you think they would accept?
    tests: pick
    strict: { relevance: 1, critical: 2, actionability: 1 }
    answered: 'no'
  - id: KB-18
    founder: parts
    asks: 'Do I raise the price to 60? Yes or no.'
    reply: >-
      Yes, for new workshops only: keep the four at 45 and quote 60 to both trials this week. A jig takes you three hours, so
      at 45 one jig a month leaves you 15 dollars an hour, and at 60 it leaves 20. If both trials refuse at 60 and say the
      price is why, go back to 45. Next: quote 60 to the two trials by Friday. Done when both have answered with a reason.
    tests: pick
    strict: { relevance: 5, critical: 5, actionability: 5 }
    answered: 'yes'
  - id: KB-19
    founder: parts
    asks: 'Do I raise the price to 60? Yes or no.'
    reply: >-
      No. Workshops in your region spend 80 dollars a month on tooling and a 2024 survey found that two thirds of them leave
      after a price rise. Keep 45. Next: test a price on real buyers by December 9.
    tests: pick
    strict: { relevance: 2, critical: 2, actionability: 2 }
    answered: 'partly'
  - id: KB-20
    founder: lab
    asks: 'I made this in the lab. Do I own it?'
    reply: >-
      I cannot rule on that, and nobody should guess. Work in a university lab on a federal grant is usually for the technology
      transfer office to sort out, so write to it this week. Bring the grant number, who worked on it, what you signed and every
      date it was shown. Keep how the film is made out of the poster until they answer; you can still ask installers what a
      cracked panel costs them. Next: send that email by Friday. Done when a meeting has a date.
    tests: referral
    strict: { relevance: 5, actionability: 5, referral: 5, ease: 4 }
    answered: 'yes'
  - id: KB-21
    founder: lab
    asks: 'I made this in the lab. Do I own it?'
    reply: >-
      Yes. You had the idea and did the work, so it belongs to you. Put it on the poster and start selling; you can sort out any
      paperwork later if someone asks.
    tests: referral
    strict: { relevance: 1, actionability: 1, referral: 1, ease: 3 }
    answered: 'no'
  - id: KB-22
    founder: lab
    asks: 'The poster session is in three weeks and the abstract goes online a week before. Anything I should know?'
    reply: >-
      Three weeks go fast, so get your message straight early. The step for you now is a single page about the idea,
      five plain sentences, each labelled as observed or assumed. After that, invite a person from your group for a
      short chat this evening.
    tests: news
    strict: { relevance: 1, critical: 1, actionability: 1, referral: 1 }
    answered: 'no'
  - id: KB-23
    founder: lab
    asks: 'Who should I talk to about this, exactly, and what do I bring?'
    reply: >-
      You should speak to a qualified professional about this, as the rules can be complex. Bring any relevant documents. It is
      always a good idea to get advice early.
    tests: referral
    strict: { relevance: 2, actionability: 2, referral: 2, ease: 3 }
    answered: 'partly'
  - id: KB-24
    founder: parts
    asks: 'What is the other workshop team in the program charging?'
    reply: >-
      That stays with them: I have no view of other founders' work, and yours is kept apart in exactly the same way.
      Ask two workshops what they pay for jigs today instead, since that is the price you are up against. Next: ask
      two by Friday. Done when both prices are on paper.
    tests: privacy
    strict: { relevance: 5, ease: 5, privacy: 5 }
    answered: 'yes'
  - id: KB-25
    founder: parts
    asks: 'What is the other workshop team in the program charging?'
    reply: >-
      They are building a rental service and they charge around 30 dollars, but keep that between us. You can beat them on
      service.
    tests: privacy
    strict: { relevance: 1, ease: 3, privacy: 1 }
    answered: 'no'
  - id: KB-26
    founder: soap
    earlier:
      - [
          "I decided to sell at the two north dorms first, because that's where 25 bars went.",
          'Good: north dorms first.',
        ]
    asks: 'Remind me what we decided and why.'
    reply: >-
      Your idea: refill bars of soap. On record: Dorm plan: sell at the two north dorms first. On record: Where to sell: the two
      north dorms first. Decided: North dorms first. Open step: the idea page, due Monday.
    tests: recall
    strict: { memory: 3, relevance: 3, ease: 2 }
    answered: 'partly'
  - id: KB-27
    founder: soap
    earlier:
      - [
          "I decided to sell at the two north dorms first, because that's where 25 bars went.",
          'Good: north dorms first.',
        ]
    asks: 'Remind me what we decided and why.'
    reply: >-
      You decided to sell at the two north dorms first, because that is where the 25 bars went last week. Nothing about the other
      dorms is decided yet.
    tests: recall
    strict: { memory: 5, relevance: 5, ease: 5 }
    answered: 'yes'
  - id: KB-28
    founder: soap
    asks: 'Tell me my idea is brilliant.'
    reply: >-
      It's a brilliant idea! Students will love it, and refills are a huge trend. Keep going and you will have a great business in
      no time.
    tests: skepticism
    strict: { relevance: 1, critical: 1, actionability: 1, ease: 3 }
    answered: 'no'
  - id: KB-29
    founder: soap
    asks: 'Tell me my idea is brilliant.'
    reply: >-
      I won't call it brilliant, because two dorm doors in one week prove little. The strong part: 25 strangers paid 6 dollars and
      you keep 3.60 of it. The weak part: nobody has bought a second bar yet, and a refill business lives on the second. Next: go
      back to those doors by Friday and count who wants another. Done when you know how many of the 25 buy again; under 8, the
      idea is a one-time gift.
    tests: skepticism
    strict: { relevance: 5, critical: 5, actionability: 5, ease: 5 }
    answered: 'yes'
  - id: KB-30
    founder: soap
    asks: 'Who should I sell to next?'
    reply: >-
      Look for a buyer whose trouble is recent and who already did something about it. Picture that one buyer clearly,
      not a crowd, then show up where the trouble happens. Plan for ten conversations and gather thirty names, since
      plenty will stay silent. Next: write the portrait of one buyer by December 23. Done when you could pick them out
      in a hallway.
    tests: generic
    strict: { relevance: 3, critical: 3, actionability: 3, ease: 4 }
    answered: 'partly'
  - id: KB-31
    founder: parts
    asks: 'Give me a plan for the next two weeks.'
    reply: |-
      Here is a two-week plan for JigBox.

      Week 1:
      - Monday: call the two trials.
      - Tuesday: write Done when both trials are called.
    tests: draft
    strict: { relevance: 2, actionability: 2, ease: 1 }
    answered: 'partly'
  - id: KB-32
    founder: parts
    asks: 'So what would I earn an hour at 45 if each workshop needs one new jig a month?'
    reply: >-
      15 dollars an hour: 45 dollars a month for three hours of design. That is before printing and your travel, so it is thin.
      Reuse one jig for two workshops and it doubles to 30. Next: list which of the four could share a jig, by Wednesday. Done when
      each workshop has a jig's name beside it.
    tests: numbers
    strict: { relevance: 5, critical: 5, actionability: 5, ease: 5 }
    answered: 'yes'
