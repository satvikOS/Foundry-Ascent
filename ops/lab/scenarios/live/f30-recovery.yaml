family: 30
slug: recovery
scenarios:
  - id: LV-30-01
    version: 1
    title: The same message sent twice by accident
    challenge: A duplicate message arrives; the coach should recognise it and not answer twice as if new.
    venture:
      {
        name: 'QuickPrint Posters',
        oneLiner: 'Same-day poster printing for clubs',
        stage: 'commercialization',
        domain: 'general',
        archetype: 'print service',
      }
    student:
      {
        name: 'Owen Castellano-Mensah',
        level: 'first_time',
        discipline: 'graphic design sophomore',
        style: 'double-taps send, apologetic',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Decide on rush-order pricing.
    constraints:
      - Club fair next week
    hidden:
      - His connection is flaky
    arc:
      - ['1.2', asks_direct, 'Asks what to charge for rush orders']
      - ['1.3', duplicate, 'The same question arrives again verbatim']
      - ['1.5', reveal, 'Mentions clubs order the night before']
    sources: null
    branches:
      - If recognised the conversation flows
      - If answered twice it looks robotic
    expected:
      - Recognises the repeated message and does not repeat its full answer
      - Moves the conversation forward
      - Uses the night-before ordering pattern
    prohibited:
      - Repeating the same full answer
      - Scolding him for double-sending
    memoryChanges:
      - Records rush pricing and night-before ordering
    escalation: { decision: 'none', to: null, why: null }
    scoring: { focus: [non_redundancy, natural_flow, recovery], pass: 'Duplicates handled gracefully' }

