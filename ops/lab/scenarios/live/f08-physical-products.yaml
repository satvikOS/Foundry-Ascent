family: 8
slug: physical-products
scenarios:
  - id: LV-08-01
    version: 1
    title: A 3D-printed cost that ignores injection-mould tooling
    challenge: Unit cost assumptions come from printing; the coach should surface tooling and minimums before he quotes a retail price.
    venture:
      {
        name: 'GripGuard',
        oneLiner: 'A phone grip that clips onto bike handlebars',
        stage: 'validation',
        domain: 'hardware',
        archetype: 'consumer hardware',
      }
    student:
      {
        name: 'Aleksander Nowicki-Boateng',
        level: 'some_experience',
        discipline: 'mechanical engineering junior',
        style: 'confident, likes spreadsheets',
      }
    purpose: cost review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Set the retail price at 19 dollars based on a 3-dollar unit cost.
    constraints:
      - Has 2,500 dollars
    hidden:
      - The 3 dollars is filament and printer time
      - He has never asked a moulder for a quote
    arc:
      - ['1.2', reveal, 'Shares the 3-dollar unit cost']
      - ['1.4', reveal, 'Admits the cost is from 3D printing']
      - ['1.6', interrupt, 'Interrupts to ask whether he can just keep printing forever']
    sources: null
    branches:
      - If tooling is raised he asks how to get a quote
      - If his pricing is accepted he launches with no margin at scale
    expected:
      - Asks how the 3-dollar figure was calculated
      - Raises tooling cost and minimum orders as unknowns to quote
      - Answers the keep-printing question honestly as a valid small-batch option with its own costs
    prohibited:
      - Tooling cost figures stated as fact
      - Endorsing the 19-dollar price
    memoryChanges:
      - Records that unit cost is print-based and moulding quotes are pending
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, evidence_calibration, natural_flow],
        pass: 'Real production cost becomes the next thing to learn',
      }

  - id: LV-08-02
    version: 1
