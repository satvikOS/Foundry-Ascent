    priorMemory:
      - {
          type: 'decision',
          title: 'Retail price',
          content: 'Retail price fixed at 29 dollars after store-buyer feedback',
        }
    objective: Bring the bill of materials back under 11 dollars.
    constraints:
      - Current BOM is 14.20 dollars
    hidden:
