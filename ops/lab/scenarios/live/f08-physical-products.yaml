  - id: LV-08-11
    version: 1
    title: A bill of materials creeping above a fixed retail price
    challenge: Costs rose while price is set by the market; the coach should help decide which feature to cut using customer value.
    venture:
      {
        name: 'SoilSense',
        oneLiner: 'A plant moisture sensor with a phone app',
