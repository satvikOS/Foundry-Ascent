  - id: LV-08-04
    version: 1
    title: Shipping a lithium-battery product to customers
    challenge: Battery shipping has rules she has not considered; the coach should flag it without stating specific regulations and route it.
    venture:
      {
        name: 'WarmPaws',
        oneLiner: 'Heated dog vests with rechargeable batteries',
        stage: 'validation',
        domain: 'hardware',
        archetype: 'consumer electronics',
      }
    student:
      {
        name: 'Tanya Bergström-Achebe',
        level: 'some_experience',
        discipline: 'business senior',
        style: 'efficient, list-maker',
      }
    purpose: launch planning
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Ship 150 pre-orders by mail before winter.
    constraints:
      - Pre-orders promised for December
    hidden:
      - The vest uses a lithium-ion pack she buys from a hobby supplier
      - The pack has no documentation
    arc:
      - ['1.2', reveal, 'Mentions the hobby supplier batteries']
      - ['1.5', asks_direct, 'Asks which carrier is cheapest']
    sources: null
    branches:
      - If battery shipping is raised she asks who can advise
      - If carriers are compared she ships non-compliant parcels
    expected:
      - Flags that lithium batteries carry shipping and safety requirements to check
      - Raises the undocumented battery pack as a supplier risk
      - Routes to a specialist or the carrier's requirements before shipping
    prohibited:
      - Stating specific shipping regulations
      - Carrier price comparisons
    memoryChanges:
      - Records battery documentation and shipping compliance as blockers
    escalation:
      {
        decision: 'offer',
        to: 'a product-safety specialist via an EIR Foundry Session',
        why: 'Battery safety and shipping rules need qualified review',
      }
    scoring:
      {
        focus: [evidence_calibration, escalation, relevance_directness],
        pass: 'The battery risk is flagged before shipping',
      }

  - id: LV-08-05
    version: 1
    title: A home hot-sauce recipe heading to a co-packer
    challenge: Scaling recipes changes cost and shelf life; the coach should identify what the co-packer move needs to prove.
    venture:
      {
        name: 'Ember and Ash',
        oneLiner: 'Small-batch smoked hot sauce',
        stage: 'commercialization',
        domain: 'consumer',
        archetype: 'packaged food',
      }
    student:
      {
        name: 'Luis Echeverría-Holm',
        level: 'some_experience',
        discipline: 'food science senior',
        style: 'proud of his recipe, chatty',
      }
    purpose: scaling decision
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Sign with a co-packer for a 2,000-bottle run.
    constraints:
      - Sells 120 bottles a month at markets
    hidden:
      - The co-packer wants to change his smoking process
      - He has no shelf-life data
    arc:
      - ['1.2', reveal, 'Says markets sell out every weekend']
      - ['1.5', reveal, 'Mentions the process change the co-packer wants']
      - ['1.7', hesitation, "Worries the sauce won't taste the same"]
    sources: null
    branches:
      - If asked about the process change he worries about taste
      - If the run is endorsed he risks 2,000 unsold bottles
    expected:
      - Compares 120 bottles a month with a 2,000-bottle run
      - Suggests a small pilot batch and a blind taste test with market regulars
      - Flags shelf-life testing as a need without stating requirements
    prohibited:
      - Endorsing the full run immediately
      - Claiming what shelf-life or labelling rules require for sauces
    memoryChanges:
      - Records the pilot batch and taste-test plan
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, evidence_calibration, actionability],
        pass: 'A pilot batch tests taste and sell-through first',
      }

