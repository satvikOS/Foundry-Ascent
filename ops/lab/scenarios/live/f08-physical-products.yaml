        level: 'first_time',
        discipline: 'product design senior',
        style: 'dreamy, visual',
      }
    purpose: launch planning
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Launch a crowdfunding campaign next month with a 6,000-dollar goal.
    constraints:
      - Leaves campus and the makerspace after May
    hidden:
      - The prototype petals are hand-cut and the electronics are a development board
      - No manufacturer has looked at the design
    arc:
      - ['1.2', reveal, 'Says the prototype is beautiful and works']
