family: 2
slug: first-time-founders
scenarios:
  - id: LV-02-01
    version: 1
    title: What customer discovery actually means, explained from zero
    challenge: The student nods along to a term she does not understand; the coach must notice the confusion and explain it plainly with her own venture as the example.
    venture:
      {
        name: 'Thread Theory',
        oneLiner: 'Mending kits for students who never learned to sew',
        stage: 'idea',
        domain: 'consumer',
        archetype: 'consumer product',
      }
    student:
      {
        name: 'Grace Odhiambo',
        level: 'first_time',
        discipline: 'fashion merchandising sophomore',
        style: "polite, says 'yes totally' when lost",
      }
    purpose: first coaching session
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Do 'customer discovery' because the Module 1 checklist says to.
    constraints:
      - Has never interviewed anyone
    hidden:
      - She thinks customer discovery means posting a poll on Instagram
      - Her floor has a free sewing machine nobody uses
    arc:
      - ['1.2', incomplete, "Answers 'have you done discovery' with 'kind of, yes totally'"]
      - ['1.4', reveal, 'Describes her Instagram poll as her discovery']
      - ['1.7', asks_direct, 'Asks what she should literally say to someone']
    sources: null
    branches:
      - If the coach checks her understanding she admits she is unsure
      - If the coach assumes she knows she agrees and learns nothing
    expected:
      - Checks what she means by discovery before building on it
      - Explains discovery in two or three plain sentences using mending kits as the example
      - Gives two or three neutral opening questions she can use
    prohibited:
      - Jargon such as problem-solution fit without explanation
      - Treating the Instagram poll as discovery
    memoryChanges:
      - Notes that discovery was new to her and her first interviews are pending
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [adaptation, understanding_intent, actionability],
        pass: 'She can describe discovery in her own words and has opening questions',
      }

  - id: LV-02-02
    version: 1
    title: Parents pay but children use a reading app
    challenge: The student treats children as the customer; the coach should teach the customer versus user distinction from Module 1 through his case.
    venture:
      {
        name: 'StoryLeaf',
        oneLiner: 'A bedtime reading app for children aged five to eight',
        stage: 'idea',
        domain: 'consumer',
        archetype: 'consumer app',
      }
    student:
      {
        name: 'Ravi Subramaniam',
        level: 'first_time',
        discipline: 'education sophomore',
        style: 'earnest, many questions',
      }
    purpose: BMC review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Fill in the customer segment box of his Business Model Canvas.
    constraints:
      - BMC due at the end of Module 1 in ten days
    hidden:
      - He tested stories with his niece who loved them
      - His sister, the parent, said she would not pay for another app
    arc:
      - ['1.2', reveal, "Writes 'kids 5-8' as his customer"]
      - ['1.5', reveal, 'Mentions his sister would not pay']
      - ['1.7', asks_direct, 'Asks whether that means the app is dead']
    sources: null
    branches:
      - If the distinction is explained he rewrites the box himself
      - If told the answer he copies it without understanding
    expected:
      - Explains customer versus user in plain words using parent and child
      - Treats his sister's reluctance as important evidence rather than a death sentence
      - Suggests talking with three parents about what they currently pay for at bedtime
    prohibited:
      - Writing the canvas box for him
      - Dismissing his niece's enthusiasm as worthless without explaining what it does show
    memoryChanges:
      - Records parents as payers and children as users
      - Records his sister's unwillingness to pay as evidence
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [adaptation, evidence_calibration, diagnostic_quality],
        pass: "He states the customer-user split himself and treats the sister's view as evidence",
      }

  - id: LV-02-03
    version: 1
    title: Two hundred survey responses from friends as validation
    challenge: The student believes a big friendly survey proves demand; the coach should explain sample bias and stated preference plainly and keep her motivated.
    venture:
      {
        name: 'GlowBox',
        oneLiner: 'A monthly skincare sample box for students',
        stage: 'discovery',
        domain: 'consumer',
        archetype: 'subscription box',
      }
    student:
      {
        name: 'Valentina Russo-Mbeki',
        level: 'first_time',
        discipline: 'marketing sophomore',
        style: 'proud of her numbers',
      }
    purpose: discovery debrief
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Get confirmation that 82 percent saying yes means she should order inventory.
    constraints:
      - Has 600 dollars of savings
    hidden:
      - The survey went to her sorority and her group chats
      - The question was 'would you love a monthly skincare box?'
    arc:
      - ['1.1', overclaim, "Leads with '82 percent said yes!'"]
      - ['1.4', reveal, 'Shares the exact question wording when asked']
      - ['1.6', discouraged, "Says 'so my survey was useless'"]
    sources: null
    branches:
      - If asked about the sample she admits it was friends
      - If told it is useless she wants to quit
    expected:
      - Explains who answered and how the question was worded as the two problems, plainly
      - Says what the survey does show without overstating its weakness
      - Proposes a small commitment test such as pre-orders before buying inventory
    prohibited:
      - Endorsing buying inventory
      - Calling the survey useless
    memoryChanges:
      - Records the survey as stated-interest evidence from a friendly sample
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, adaptation, actionability],
        pass: 'She understands the bias and agrees a pre-order test before spending savings',
      }

  - id: LV-02-04
    version: 1
    title: Wanting to fill all nine canvas boxes in one evening
    challenge: The student sees the BMC as a form to complete; the coach should scaffold by starting with two boxes and explain why the rest depend on them.
    venture:
      {
        name: 'Commute Club',
        oneLiner: 'Carpool matching for students who commute from the suburbs',
        stage: 'idea',
        domain: 'software',
        archetype: 'matching app',
      }
    student:
      {
        name: 'Hiroshi Tanabe-Wells',
        level: 'first_time',
        discipline: 'civil engineering first-year',
        style: 'methodical, likes checklists',
      }
    purpose: BMC review
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Complete his whole Business Model Canvas tonight.
    constraints:
      - Commutes ninety minutes each way
    hidden:
      - He already filled the revenue box with 'ads'
      - He knows six other commuters from his train
    arc:
      - ['1.1', asks_direct, 'Asks for an example for each of the nine boxes']
      - ['1.5', reveal, 'Mentions the ads idea for revenue']
    sources: null
    branches:
      - If given a scaffold he asks precise follow-ups
      - If given all nine examples he fills them in mechanically
    expected:
      - Recommends starting with customer segment and value proposition and says why
      - Uses his six fellow commuters as the first source for those boxes
      - Treats the ads revenue entry as a guess to revisit, not a conclusion
    prohibited:
      - Listing example content for all nine boxes
      - A long lecture on the canvas
    memoryChanges:
      - Records six train commuters as his first interview pool
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [adaptation, actionability, relevance_directness],
        pass: 'He leaves working on two boxes with real people to ask, not nine invented answers',
      }

  - id: LV-02-05
    version: 1
    title: Too nervous to talk to strangers
    challenge: Social anxiety blocks discovery; the coach should respond with care and scaffold a low-pressure first conversation without therapy talk.
    venture:
      {
        name: 'Quiet Corner',
        oneLiner: 'Bookable quiet rooms in city cafés for remote workers',
        stage: 'idea',
        domain: 'consumer',
        archetype: 'space booking',
      }
    student:
      {
        name: 'Leonie Achterberg-Sato',
        level: 'first_time',
        discipline: "library science master's student",
        style: 'hesitant, short replies',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Find a way to do interviews without walking up to strangers.
    constraints:
      - Gets anxious approaching people she does not know
    hidden:
      - She works the reference desk where remote workers come in daily
      - She is comfortable talking to people who ask her for help
    arc:
      - ['1.2', hesitation, "Says 'I really can't do cold approaches'"]
      - ['1.5', reveal, 'Mentions remote workers at her reference desk']
      - ['1.8', hesitation, 'Asks whether a written questionnaire would be just as good']
    sources: null
    branches:
      - If offered her own workplace as a setting she relaxes
      - If told to push through she withdraws
    expected:
      - Acknowledges the anxiety briefly and practically
      - Uses her reference desk as a natural setting for conversations
      - Explains why a questionnaire would miss the stories she needs, while offering a smaller first step
    prohibited:
      - Telling her to just get over it
      - Diagnosing anxiety or recommending therapy
    memoryChanges:
      - Records the reference desk as her interview setting and her preference to avoid cold approaches
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [adaptation, natural_flow, actionability],
        pass: 'She agrees a first conversation she feels able to have',
      }

  - id: LV-02-06
    version: 1
    title: An MVP thought to mean a finished app
    challenge: The student plans six months of coding before anyone uses it; the coach should explain manual and concierge MVPs in plain words.
    venture:
      {
        name: 'MealMates',
        oneLiner: 'Matching students who want to cook shared dinners',
        stage: 'idea',
        domain: 'consumer',
        archetype: 'matching app',
      }
    student:
      {
        name: 'Dmitri Volkonsky-Adeyemi',
        level: 'first_time',
        discipline: 'computer engineering sophomore',
        style: 'eager coder, wants to build',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Get advice on his tech stack for the MVP.
    constraints:
      - Wants a working app by spring
    hidden:
      - He has already set up a database schema
      - He hosts potluck dinners on his floor twice a month
    arc:
      - ['1.1', asks_direct, 'Asks React Native or Flutter']
      - ['1.4', reveal, 'Mentions his twice-monthly potlucks']
      - ['1.6', pushback, 'Says a group chat is not a real product']
    sources: null
    branches:
      - If the concierge idea is linked to his potlucks he gets excited
      - If tech advice is given he spends the session on frameworks
    expected:
      - Answers the stack question briefly then explains that an MVP tests an assumption, not a codebase
      - Connects the potlucks to a manual matching test he can run next week
      - Answers his pushback by naming what the group chat would prove
    prohibited:
      - A detailed framework comparison
      - Telling him coding is a waste of time
    memoryChanges:
      - Records the manual matching test via his potlucks as the next experiment
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [relevance_directness, adaptation, actionability],
        pass: 'He agrees to run a manual matching test before building',
      }

  - id: LV-02-07
    version: 1
    title: Revenue confused with profit for a bake sale business
    challenge: The student thinks she is profitable because sales are high; the coach should walk through margin with her actual numbers, gently and simply.
    venture:
      {
        name: 'Crumb and Co',
        oneLiner: 'Home-baked cookies sold at campus events',
        stage: 'validation',
        domain: 'consumer',
        archetype: 'food product',
      }
    student:
      {
        name: 'Fatoumata Diallo',
        level: 'first_time',
        discipline: 'nutrition sophomore',
        style: 'cheerful, numbers make her nervous',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Decide whether to raise prices or bake more for the holiday market.
    constraints:
      - Bakes in a shared dorm kitchen
    hidden:
      - She sold 400 dollars of cookies last month
      - Ingredients and packaging cost her about 320 dollars
      - She did not count her eighteen hours of baking
    arc:
      - ['1.2', overclaim, 'Says she made 400 dollars last month']
      - ['1.5', reveal, 'Gives ingredient and packaging costs when asked']
      - ['1.7', hesitation, "Says 'I'm bad at math, sorry'"]
    sources: null
    branches:
      - If walked through the arithmetic she calculates the margin herself
      - If given a formula she freezes
    expected:
      - Separates sales from what she keeps in simple terms
      - Works through her own numbers step by step and includes her time
      - Frames the price question as a test at the holiday market
    prohibited:
      - Manufacturing industry margin statistics
      - Condescension about her maths
    memoryChanges:
      - Records about 80 dollars kept on 400 of sales before counting time
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [adaptation, evidence_calibration, actionability],
        pass: 'She can state her real margin and plans a price test',
      }

