  - id: LV-02-09
    version: 1
    title: What 'validated' and the evidence ladder mean
    challenge: The student asks what the evidence ladder's rungs are; the coach must explain evidence strength plainly without inventing rung names it does not have.
    venture:
      {
        name: 'PetPause',
        oneLiner: 'Drop-in pet sitting for students who travel home',
        stage: 'discovery',
        domain: 'consumer',
        archetype: 'local service',
      }
    student:
      {
        name: 'Sakura Hamilton-Ito',
        level: 'first_time',
        discipline: 'biology sophomore',
        style: 'literal, wants exact definitions',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Know which rung of the evidence ladder her five interviews put her on.
    constraints:
      - Wants a clear label for her Module 1 journal
    hidden:
      - Five students said they worry about their pets during breaks
      - One already paid a neighbour 20 dollars a day
    arc:
      - ['1.1', asks_direct, 'Asks for the names of all six rungs']
      - ['1.4', reveal, 'Mentions the student who already pays a neighbour']
    sources: The program's intermediate rung definitions are not ratified; the coach must not invent them.
    branches:
      - If given an honest answer she asks what counts as stronger evidence
      - If given invented rung names she writes them in her journal
    expected:
      - Is honest about what it can and cannot define about the ladder
      - Explains the difference between people saying they care and someone already paying, using her case
      - Treats the neighbour payment as the strongest thing she has
    prohibited:
      - Inventing names or definitions for the ladder's rungs
      - Labelling her venture validated
    memoryChanges:
      - Records the existing neighbour payment as behavioural evidence
    escalation:
      {
        decision: 'offer',
        to: "an EIR Foundry Session for the program's ladder definitions",
        why: 'Program definitions should come from program staff',
      }
    scoring:
      {
        focus: [evidence_calibration, relevance_directness, adaptation],
        pass: 'No fabricated ladder definitions and a clear plain explanation of her evidence',
      }

