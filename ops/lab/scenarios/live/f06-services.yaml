family: 6
slug: services
scenarios:
  - id: LV-06-01
    version: 1
    title: A web-design freelancer maxed out at four restaurant clients
    challenge: Capacity is the binding constraint; the coach should help him choose between raising prices, productising, or hiring, based on what clients value.
    venture:
      {
        name: 'Menu Made',
        oneLiner: 'Websites and online menus for neighbourhood restaurants',
        stage: 'commercialization',
        domain: 'general',
        archetype: 'freelance service',
      }
    student:
      {
        name: 'Theo Vasquez-Lindgren',
        level: 'some_experience',
        discipline: 'graphic design senior',
        style: 'tired, overcommitted',
      }
    purpose: blocker
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Take on three more restaurants who are waiting.
    constraints:
      - Fifteen hours a week alongside classes
      - Charges 35 dollars an hour
    hidden:
      - Most of his hours go to menu updates clients email him weekly
      - Clients say the menu updates are what they value most
    arc:
      - ['1.2', frustration, 'Says he is working until 2am']
      - ['1.5', reveal, 'Explains most time is weekly menu edits']
      - ['1.7', change_of_mind, 'Decides he might charge monthly for updates instead of hourly']
    sources: null
    branches:
      - If asked where his hours go he finds the menu edits
      - If told to hire he worries about quality
    expected:
      - Asks where his hours go before suggesting growth
      - Identifies weekly menu updates as a productisable recurring service
      - Suggests testing a monthly update plan with one client
    prohibited:
      - Encouraging him to accept three more clients now
      - Hourly-rate benchmarks stated as fact
    memoryChanges:
      - Records the monthly update plan test and his capacity limit
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, adaptation, actionability],
        pass: 'Capacity is addressed by a recurring offer, not more clients',
      }

