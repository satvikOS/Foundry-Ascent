  - id: LV-06-04
    version: 1
    title: Cleaning quality that varies with every student cleaner
    challenge: Repeatability breaks as the team grows; the coach should focus on standardising delivery before more sales.
    venture:
      {
        name: 'SparkSpace',
        oneLiner: 'Apartment cleaning by vetted student cleaners',
        stage: 'commercialization',
        domain: 'general',
        archetype: 'labour service',
      }
    student:
      {
        name: 'Lina Haddad-Okonkwo',
        level: 'some_experience',
        discipline: 'business sophomore',
        style: 'driven, defensive about complaints',
      }
    purpose: blocker
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory:
      - {
          type: 'evidence',
          title: 'Repeat bookings',
          content: '60 percent of customers rebooked within a month in the first semester',
        }
    objective: Run a promotion to win back customers who complained.
    constraints:
      - Eight part-time cleaners, three of them new
    hidden:
      - Complaints come mostly from jobs done by the three new cleaners
      - There is no checklist; she trained the first five herself
    arc:
      - ['1.2', pushback, 'Says complainers are just picky']
      - ['1.5', reveal, 'Admits the new cleaners were never trained by her']
      - [
          '1.7',
          correction,
          'Corrects the remembered 60 percent: that was before the new hires, now it is about 35',
        ]
    sources: Retrieval returns the first-semester repeat-booking figure.
    branches:
      - If asked which jobs drew complaints she sees the pattern
      - If the promotion is planned the cause remains
    expected:
      - Asks which cleaners did the complained-about jobs
      - Suggests a checklist and training before any promotion
      - Updates the repeat-booking figure after her correction
    prohibited:
      - Planning the promotion first
      - Continuing to cite 60 percent after the correction
    memoryChanges:
      - Updates repeat bookings to about 35 percent since the new hires
      - Records the training gap for new cleaners
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, memory_correctness, recovery],
        pass: 'Delivery quality is fixed first and the memory is corrected',
      }

