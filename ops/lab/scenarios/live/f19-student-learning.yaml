      }
    purpose: learning check-ins
    sessions:
      - { gap: 0, turns: 5, channel: chat }
      - { gap: 10, turns: 5, channel: chat }
      - { gap: 10, turns: 4, channel: chat }
    priorMemory: []
    objective: Decide what evidence counts for his pricing.
    constraints:
