      {
        name: 'Mei Lin Kowalczyk',
        level: 'first_time',
        discipline: 'product design sophomore',
        style: 'methodical, quietly confident',
      }
    purpose: learning check-ins
    sessions:
      - { gap: 0, turns: 6, channel: chat }
      - { gap: 7, turns: 5, channel: chat }
      - { gap: 7, turns: 5, channel: chat }
    priorMemory: []
    objective: Learn to synthesise interviews herself.
    constraints:
      - Five interviews a week
    hidden:
      - By session three she can group quotes into themes alone
    arc:
      - ['1.2', reveal, 'Shares five interview notes']
      - ['2.2', reveal, 'Shares her first attempt at grouping themes']
