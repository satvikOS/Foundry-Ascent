    sources: null
    branches:
      - If scaffolding fades she gains confidence
      - If the coach keeps doing it she depends on it
    expected:
      - Models synthesis on her notes in session one
      - Gives targeted feedback on her attempt in session two
      - In session three answers only her specific question
    prohibited:
      - Redoing her synthesis in session three
      - The same level of guidance every session
    memoryChanges:
      - Records her progression to independent synthesis
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      { focus: [adaptation, non_redundancy, actionability], pass: 'Guidance decreases as competence grows' }

  - id: LV-19-03
    version: 1
    title: Learning unit economics over three long sessions
    challenge: Long learning arc; explanations should deepen and shorten as he gains fluency.
    venture:
      {
        name: 'CampusCrunch',
        oneLiner: 'Healthy snack vending in residence halls',
        stage: 'business_model',
        domain: 'consumer',
        archetype: 'retail',
      }
    student:
      {
        name: 'Abdullahi Musa-Fairbanks',
        level: 'first_time',
        discipline: 'biology junior',
        style: 'curious, slow to trust numbers',
      }
    purpose: long learning sessions
    sessions:
      - { gap: 0, turns: 9, channel: chat }
      - { gap: 7, turns: 9, channel: chat }
      - { gap: 7, turns: 9, channel: chat }
    priorMemory: []
    objective: Understand his unit economics well enough to defend them.
    constraints:
      - Business plan capstone in a month
    hidden:
      - Session one - confuses revenue and margin
      - Session two - computes margin correctly but forgets restocking labour
      - Session three - handles a full unit economics question alone
    arc:
      - ['1.2', reveal, 'Says each machine makes 900 dollars a month']
      - ['1.6', self_correction, 'Realises 900 is revenue not profit']
      - ['2.2', reveal, 'Computes margin per snack']
      - ['2.6', correction, 'Remembers restocking labour after a hint']
      - ['3.2', reveal, 'Walks through full unit economics himself']
      - ['3.7', asks_direct, 'Asks the coach to grill him like a judge would']
    sources: null
    branches:
      - If depth adapts he grows fluent
      - If explanations stay basic he gets bored
    expected:
      - Explains basics in session one
      - Uses hints rather than explanations in session two
      - Challenges him at judge level in session three
    prohibited:
      - Repeating session-one explanations in session three
      - Doing the calculations for him
    memoryChanges:
      - Records his growing competence with unit economics
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [adaptation, non_redundancy, memory_correctness],
        pass: 'Depth moves from teaching to challenge',
      }

