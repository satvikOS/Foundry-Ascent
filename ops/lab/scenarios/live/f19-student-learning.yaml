    challenge: Over three sessions the coach should model, then co-do, then let her lead synthesis.
    venture:
      {
        name: 'Commute Comfort',
        oneLiner: 'Bike-commuter rain gear',
        stage: 'discovery',
        domain: 'consumer',
        archetype: 'apparel',
      }
