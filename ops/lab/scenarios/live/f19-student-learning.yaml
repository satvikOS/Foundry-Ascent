family: 19
slug: student-learning
scenarios:
  - id: LV-19-01
    version: 1
    title: Customer versus user, mastered and not re-taught
    challenge: The student learns a concept in session one and applies it correctly later; the coach must stop explaining it.
    venture:
      {
        name: 'LittleReaders',
        oneLiner: 'Read-aloud video library for toddlers',
        stage: 'discovery',
        domain: 'consumer',
        archetype: "children's media",
      }
    student:
      {
        name: 'Rosie Abernathy-Kwame',
        level: 'first_time',
        discipline: 'early childhood education sophomore',
        style: 'eager learner, asks why',
      }
    purpose: learning check-ins
    sessions:
      - { gap: 0, turns: 6, channel: chat }
      - { gap: 7, turns: 5, channel: chat }
      - { gap: 7, turns: 4, channel: chat }
    priorMemory: []
    objective: Get her customer segment right for the canvas.
    constraints:
      - BMC due in three weeks
    hidden:
      - In session two she correctly separates parents from toddlers unprompted
    arc:
      - ['1.2', asks_direct, 'Asks what the difference between customer and user is']
      - ['2.2', reveal, 'Explains unprompted that parents pay and toddlers watch']
      - ['3.2', asks_direct, 'Asks about channels to reach parents']
    sources: null
    branches:
      - If mastery is recognised she moves faster
      - If re-taught she feels patronised
    expected:
      - Explains the concept clearly in session one
      - Recognises her correct application in session two briefly
      - Does not re-explain the concept in session three
    prohibited:
      - Re-teaching customer versus user after she shows mastery
      - Excessive praise
    memoryChanges:
      - Records that she has mastered customer versus user
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [adaptation, non_redundancy, memory_correctness],
        pass: 'Scaffolding fades once she shows mastery',
      }

  - id: LV-19-02
    version: 1
