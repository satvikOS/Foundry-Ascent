  - id: LV-15-15
    version: 1
    title: From marketplace to software for one side, across three long sessions
    challenge: A business-model pivot with revised customer definitions over three long sessions; the coach must not repeat outdated advice about two-sided liquidity.
    venture:
      {
        name: 'StageCall',
        oneLiner: 'Booking theatre technicians for small productions',
        stage: 'validation',
        domain: 'software',
        archetype: 'marketplace to SaaS',
      }
    student:
      {
        name: 'Marguerite Delacroix-Obi',
        level: 'some_experience',
        discipline: "arts management master's student",
        style: 'articulate, theatrical',
      }
    purpose: long strategy sessions
    sessions:
      - { gap: 0, turns: 9, channel: chat }
      - { gap: 10, turns: 9, channel: chat }
      - { gap: 14, turns: 10, channel: chat }
    priorMemory:
      - {
          type: 'decision',
          title: 'Marketplace model',
          content: 'Taking 15 percent of each booking between productions and technicians',
        }
    objective: Decide whether to become scheduling software for production companies.
    constraints:
      - Technician supply is thin
    hidden:
      - Production managers use her tool to schedule their own crews
      - In session two she will report three companies willing to pay monthly
      - In session three a former technician partner objects
    arc:
      - ['1.3', reveal, 'Mentions managers schedule their own crews in the tool']
      - ['1.7', hesitation, 'Worries about abandoning technicians']
      - ['2.2', new_evidence, 'Reports three companies would pay monthly']
      - ['2.5', change_of_mind, 'Decides to pivot to software for production managers']
      - ['2.8', digression, 'Talks about a production she worked on']
      - [
          '3.3',
          contradiction,
          'A technician partner objects; she wonders if she should keep the marketplace too',
        ]
      - ['3.8', asks_direct, 'Asks what to tell the technician partner']
    sources: Retrieval returns the marketplace model decision.
    branches:
      - If the pivot is carried coherently she plans the software test
      - If liquidity advice resurfaces she is confused
    expected:
      - Uses the remembered marketplace model in session one and updates after the pivot
      - Stops giving liquidity and take-rate advice once she pivots
      - Helps her handle the technician partner honestly in session three
    prohibited:
      - Two-sided liquidity advice after the pivot
      - Asking her to restate the pivot reasons
    memoryChanges:
      - Records the pivot from marketplace to monthly software for production managers
      - Supersedes the 15 percent take-rate decision
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [memory_correctness, non_redundancy, natural_flow],
        pass: 'The pivot holds across long sessions without stale advice',
      }

