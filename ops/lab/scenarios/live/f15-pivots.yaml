family: 15
slug: pivots
scenarios:
  - id: LV-15-01
    version: 1
    title: From selling to students to selling to their employers, over three sessions
    challenge: A customer pivot unfolds across sessions; the coach must carry the reasoning forward and stop referring to the old customer as current.
    venture:
      {
        name: 'InternReady',
        oneLiner: 'Skills bootcamps for interns',
        stage: 'validation',
        domain: 'general',
        archetype: 'education service',
      }
    student:
      {
        name: 'Chidi Okafor-Lindberg',
        level: 'some_experience',
        discipline: 'MBA student',
        style: 'reflective, evidence-minded',
      }
    purpose: strategy check-ins
    sessions:
      - { gap: 0, turns: 9, channel: chat }
      - { gap: 14, turns: 9, channel: chat }
      - { gap: 21, turns: 9, channel: chat }
    priorMemory: []
    objective: Decide whether employers rather than students should pay for the bootcamp.
    constraints:
      - Students would not pay more than 50 dollars
    hidden:
      - Two employers asked to send their incoming interns
      - In session three he will report an employer paying 1,800 dollars for six interns
    arc:
      - ['1.3', reveal, 'Mentions students balk at 50 dollars']
      - ['1.6', reveal, 'Mentions two employers asked to send interns']
      - ['2.2', change_of_mind, 'Announces he will test employers as payers']
      - ['2.6', hesitation, 'Worries students will see it as a company tool']
      - ['3.2', new_evidence, 'Reports an employer paid 1,800 dollars for six interns']
      - ['3.6', return, 'Returns to the worry from last session about student perception']
    sources: null
    branches:
      - If the coach carries session reasoning he builds on it
      - If old customer framing returns he feels unheard
    expected:
      - Helps frame the employer test in session one or two from his own signals
      - Refers to employers as the customer after the pivot, not students
      - Picks up his student-perception worry when he returns to it in session three
    prohibited:
      - Recommending student pricing tactics after the pivot
      - Asking again why he pivoted
    memoryChanges:
      - Records the customer change from students to employers with its evidence
      - Records the first paid employer cohort
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [memory_correctness, non_redundancy, evidence_calibration],
        pass: 'The pivot is carried through all sessions coherently',
      }

  - id: LV-15-02
    version: 1
    title: Interviews reveal a bigger problem than the one she set out to solve
    challenge: Discovery uncovered a different problem; the coach should help her weigh switching with evidence, not excitement.
    venture:
      {
        name: 'Meal Mate',
        oneLiner: 'Meal planning for students with allergies',
        stage: 'discovery',
        domain: 'consumer',
        archetype: 'consumer app',
      }
    student:
      {
        name: 'Priya Venkataraman-Holt',
        level: 'first_time',
        discipline: 'dietetics junior',
        style: 'excitable, idea-rich',
      }
    purpose: discovery debrief
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory:
      - {
          type: 'hypothesis',
          title: 'Original problem',
          content: 'Students with allergies struggle to plan safe meals',
        }
    objective: Decide whether to switch to helping dining halls label allergens.
    constraints:
      - Module 1 capstone in five weeks
    hidden:
      - Students said planning is fine; eating out is the risk
      - A dining manager said labels are a constant compliance headache
    arc:
      - ['1.2', reveal, "Says planning isn't the problem"]
      - ['1.5', reveal, "Mentions the dining manager's headache"]
      - ['1.7', change_of_mind, 'Says she wants to switch to dining-hall labelling']
    sources: Retrieval returns the original problem hypothesis.
    branches:
      - If the new problem is tested she interviews dining staff
      - If switched on excitement she repeats the same mistake
    expected:
      - Acknowledges that the remembered hypothesis did not hold
      - Treats the dining manager's comment as one lead to test, not proof
      - Suggests a few dining-staff interviews before the switch
    prohibited:
      - Endorsing the switch on one comment
      - Allergen labelling regulations stated as fact
    memoryChanges:
      - Marks the planning hypothesis as weakened and dining labelling as a candidate
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, memory_correctness, actionability],
        pass: 'The pivot is tested before it is made',
      }

  - id: LV-15-03
    version: 1
    title: Dropping the hardware and keeping the software
    challenge: Customers value the app more than the device; the coach should help him test a software-only offer.
    venture:
      {
        name: 'PostureLab',
        oneLiner: 'A posture sensor clip with a coaching app',
        stage: 'validation',
        domain: 'hardware',
        archetype: 'connected hardware',
      }
    student:
      {
        name: 'Erik Lindahl-Mensah',
        level: 'some_experience',
        discipline: 'biomedical engineering senior',
        style: 'attached to the device, careful',
      }
    purpose: strategy check
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Decide whether to keep developing the clip.
    constraints:
      - Hardware costs 28 dollars per unit
    hidden:
      - Most users forget to wear the clip after week two
      - Users keep using the app's stretching reminders
    arc:
      - ['1.2', reveal, 'Says the clip is unreliable to wear']
      - ['1.5', reveal, 'Mentions users keep using reminders']
      - ['1.7', hesitation, 'Says dropping the clip feels like giving up on the engineering']
    sources: null
    branches:
      - If the app-only test is framed he agrees
      - If the device is defended costs remain
    expected:
      - Notices that usage favours the app
      - Suggests an app-only test with new users
      - Acknowledges his attachment to the engineering work briefly
    prohibited:
      - Telling him the hardware was a waste
      - Wearable market claims
    memoryChanges:
      - Records app-only as the test after clip abandonment
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      { focus: [evidence_calibration, adaptation, actionability], pass: 'A software-only test is agreed' }

  - id: LV-15-04
    version: 1
    title: From subscription to one-time purchase
    challenge: Customers resist subscriptions for a seasonal need; the coach should help her test a one-time model.
    venture:
      {
        name: 'TaxReady Freelancers',
        oneLiner: 'Tax-season organiser for freelancers',
        stage: 'commercialization',
        domain: 'software',
        archetype: 'consumer SaaS',
      }
    student:
      {
        name: 'Amelia Okonjo-Strand',
        level: 'some_experience',
        discipline: "accounting master's student",
        style: 'logical, decisive',
      }
    purpose: business model review
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Fix 70 percent cancellation after tax season.
    constraints:
      - Subscription at 9 dollars a month
    hidden:
      - Users cancel right after filing
      - Several asked for a one-time season pass
    arc:
      - ['1.2', reveal, 'Says users cancel after April']
      - ['1.5', reveal, 'Mentions requests for a season pass']
    sources: null
    branches:
      - If the seasonal pattern is accepted she tests a pass
      - If retention tactics are applied they fight the need
    expected:
      - Recognises the seasonal need behind cancellations
      - Suggests testing a season pass next cycle
      - Names what to measure to compare models
    prohibited:
      - Retention tactics that fight a seasonal need
      - Tax advice
    memoryChanges:
      - Records the season-pass test
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, actionability, relevance_directness],
        pass: 'The model matches the seasonal need',
      }

  - id: LV-15-05
    version: 1
    title: Pivoting after two bad interviews
    challenge: The student wants to pivot on thin evidence; the coach should caution proportionately and suggest what more would decide it.
    venture:
      {
        name: 'CarbonCut Commute',
        oneLiner: 'Rewards for low-carbon commuting at companies',
        stage: 'discovery',
        domain: 'energy',
        archetype: 'B2B engagement',
      }
    student:
      {
        name: 'Sven Achterberg-Kamara',
        level: 'first_time',
        discipline: 'environmental economics junior',
        style: 'impulsive, decisive',
      }
    purpose: discovery debrief
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Pivot to a carbon calculator because two HR managers were negative.
    constraints:
      - Has interviewed only two people
    hidden:
      - Both managers work at firms with no commuting staff
    arc:
      - ['1.2', change_of_mind, 'Announces a pivot after two interviews']
      - ['1.5', reveal, 'Mentions both firms are fully remote']
    sources: null
    branches:
      - If sample fit is examined he interviews commuting firms
      - If he pivots he abandons an untested idea
    expected:
      - Asks about the two firms before accepting the conclusion
      - Notes that remote firms are not the target
      - Suggests interviews with commuter-heavy employers before deciding
    prohibited:
      - Endorsing the pivot
      - Lecturing about patience
    memoryChanges:
      - Records the two interviews as off-target
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, diagnostic_quality, adaptation],
        pass: 'The pivot waits for on-target evidence',
      }

  - id: LV-15-06
    version: 1
    title: The fourth pivot in three months
    challenge: Memory shows repeated pivots; the coach should name the pattern kindly and help set criteria before the next change.
    venture:
      {
        name: 'Untitled Venture (formerly four names)',
        oneLiner: 'Currently a study-group matching idea',
        stage: 'discovery',
        domain: 'general',
        archetype: 'serial pivoting',
      }
    student:
      {
        name: 'Leonora Kim-Achebe',
        level: 'first_time',
        discipline: 'economics sophomore',
        style: 'enthusiastic, restless',
      }
    purpose: check-ins
    sessions:
      - { gap: 0, turns: 5, channel: chat }
      - { gap: 10, turns: 5, channel: chat }
      - { gap: 12, turns: 5, channel: chat }
    priorMemory:
      - {
          type: 'decision',
          title: 'Pivot one',
          content: 'Dropped dorm laundry alerts in August after two weeks',
        }
      - {
          type: 'decision',
          title: 'Pivot two',
          content: 'Dropped a textbook swap in September after one fair',
        }
      - {
          type: 'decision',
          title: 'Pivot three',
          content: 'Dropped club budget software in October after three interviews',
        }
    objective: Start the study-group idea and maybe a new one she heard about.
    constraints:
      - Module 1 capstone in six weeks
    hidden:
      - In session three she will want to switch again to a sustainability idea
    arc:
      - ['1.2', reveal, 'Describes the study-group idea']
      - ['2.3', hesitation, 'Says interviews are slow']
      - ['3.2', change_of_mind, 'Proposes switching to a sustainability idea']
      - ['3.4', asks_direct, 'Asks if she is just bad at this']
    sources: Retrieval returns the three earlier pivots.
    branches:
      - If the pattern is named she agrees to criteria
      - If each idea is coached afresh the cycle repeats
    expected:
      - Uses the remembered pivots to name the pattern kindly
      - Helps her set a kill criterion and minimum test before switching again
      - Answers 'am I bad at this' honestly and supportively
    prohibited:
      - Coaching the new idea as if no history existed
      - Shaming her for pivoting
    memoryChanges:
      - Records the agreed pivot criterion
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [memory_correctness, diagnostic_quality, adaptation],
        pass: 'The pattern is named with history and criteria set',
      }

