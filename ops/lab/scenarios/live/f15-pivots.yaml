  - id: LV-15-10
    version: 1
    title: Going back to the idea he abandoned
    challenge: Across three sessions the student reverses a pivot; memory must reflect the reversal and not repeat advice from the abandoned path.
    venture:
      {
        name: 'FieldNotes',
        oneLiner: 'Voice field notes for ecology researchers',
        stage: 'validation',
        domain: 'software',
        archetype: 'research tool',
      }
    student:
      {
        name: 'Dr. Tomasz Zielinski-Okeke',
        level: 'researcher',
        discipline: 'ecology postdoc',
        style: 'thoughtful, a little indecisive',
      }
    purpose: strategy check-ins
    sessions:
      - { gap: 0, turns: 5, channel: chat }
      - { gap: 14, turns: 5, channel: chat }
      - { gap: 14, turns: 6, channel: chat }
    priorMemory:
      - {
          type: 'decision',
          title: 'Pivot to students',
          content: 'In September he pivoted from researchers to undergraduate field courses',
        }
    objective: Decide whether undergraduate courses are working.
    constraints:
      - Postdoc ends in a year
    hidden:
      - Courses only run in summer, so feedback is slow
      - Two research labs still use the old version and asked for updates
    arc:
      - ['1.2', reveal, "Says undergraduate courses won't run until summer"]
      - ['2.2', reveal, 'Mentions the two labs asking for updates']
      - ['2.4', change_of_mind, 'Decides to return to researchers']
      - ['3.2', asks_direct, 'Asks what to do first now that researchers are the focus again']
    sources: Retrieval returns the September pivot decision.
    branches:
      - If the reversal is recorded the coach builds on the labs
      - If course advice continues he is confused
    expected:
      - Uses the remembered September pivot correctly in session one
      - After the reversal treats researchers as the focus and stops course advice
      - Suggests acting on the two labs' requests
    prohibited:
      - Recommending undergraduate course actions after the reversal
      - Treating the reversal as failure
    memoryChanges:
      - Records the reversal back to researchers with its reasons
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [memory_correctness, non_redundancy, adaptation],
        pass: 'The reversal is reflected in memory and advice',
      }

