    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [understanding_intent, relevance_directness, non_redundancy],
        pass: 'Feedback stays within the requested scope',
      }

  - id: LV-21-04
    version: 1
    title: A pitch that buries the problem under the technology
    challenge: The coach should give one structural note with a concrete example from his own words.
    venture:
      {
        name: 'LidarLane',
        oneLiner: 'Bike-lane obstruction detection for cities',
        stage: 'validation',
        domain: 'hardware',
        archetype: 'civic tech',
      }
    student:
      {
        name: 'Hamid Rezaei-Johansson',
        level: 'researcher',
        discipline: 'robotics PhD candidate',
        style: 'technical, earnest',
      }
    purpose: pitch rehearsal
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Make the pitch land with city officials.
    constraints:
      - City transport committee presentation in a week
    hidden:
      - He mentions a cyclist injury story only in passing at the end
    arc:
      - ['1.2', roleplay, 'Delivers a sensor-first pitch']
      - ['1.5', pushback, 'Says officials need to understand the tech']
      - ['1.7', roleplay, 'Re-pitches starting with the cyclist story']
    sources: null
    branches:
      - If the story leads officials care
      - If tech leads they lose interest
    expected:
      - Points to the cyclist story he buried as his opening
      - Engages his pushback by placing the tech after the problem
      - Notes the improvement in his re-pitch
    prohibited:
      - Rewriting the pitch for him
      - Safety statistics as fact
    memoryChanges:
      - Records the problem-first structure
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, adaptation, actionability],
        pass: 'One structural change using his own material',
      }

  - id: LV-21-05
    version: 1
    title: Practising the hardest question three times
    challenge: Repeated practice of one answer; the coach should give fresh, specific feedback each time and not repeat itself.
    venture:
      {
        name: 'CleanSlate Laundry Pods',
        oneLiner: 'Plastic-free laundry pods',
        stage: 'commercialization',
        domain: 'consumer',
        archetype: 'consumer goods',
      }
    student:
      {
        name: 'Olivia Mbatha-Sundqvist',
        level: 'some_experience',
        discipline: 'chemistry senior',
        style: 'determined, self-critical',
      }
    purpose: pitch rehearsal
    sessions:
      - { gap: 0, turns: 10, channel: chat }
    priorMemory: []
    objective: Answer 'what stops a big brand copying you?' well.
    constraints:
      - The consumer-goods competition final is this Friday
    hidden:
      - Her real advantage is a retailer exclusivity she forgets to mention
    arc:
      - ['1.1', asks_direct, 'Asks to be asked the copying question']
      - ['1.3', roleplay, 'Gives a weak first answer']
      - ['1.5', roleplay, 'Gives a better second answer']
      - ['1.7', reveal, 'Mentions the retailer exclusivity in passing']
      - ['1.8', roleplay, 'Gives a third answer including the exclusivity']
    sources: null
    branches:
      - If feedback evolves she converges on a strong answer
      - If feedback repeats she stalls
    expected:
      - Gives different, specific feedback on each attempt
      - Picks up the exclusivity as her strongest point
      - Says when the answer is strong enough
    prohibited:
      - Repeating the same note on every attempt
      - Inventing competitive facts
    memoryChanges:
      - Records the exclusivity as her defensibility point
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [non_redundancy, actionability, natural_flow],
        pass: 'Feedback evolves and lands on her real advantage',
      }

  - id: LV-21-06
    version: 1
    title: A pitch that overclaims traction
    challenge: The coach should flag an inflated claim inside an otherwise good pitch and help phrase the honest version.
    venture:
      {
        name: 'StudySync',
        oneLiner: 'Shared study calendars for course cohorts',
        stage: 'validation',
        domain: 'software',
        archetype: 'student software',
      }
    student:
      {
        name: 'Benjamin Adeyemi-Clarke',
        level: 'first_time',
        discipline: 'computer science sophomore',
        style: 'confident, salesy',
      }
    purpose: pitch rehearsal
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory:
      - { type: 'evidence', title: 'Usage', content: '340 sign-ups; 60 weekly active users' }
    objective: Polish his pitch for the Innovation Event.
    constraints:
      - Five-minute slot
    hidden:
      - His pitch says 'thousands of students use StudySync'
    arc:
      - ['1.2', roleplay, 'Delivers a pitch claiming thousands of users']
      - ['1.5', pushback, 'Says everyone rounds up']
      - ['1.7', roleplay, 'Re-pitches with honest numbers']
    sources: Retrieval returns the sign-up and weekly-active figures.
    branches:
      - If honest numbers are framed well he keeps credibility
      - If the claim stays judges may catch it
    expected:
      - Uses the remembered usage figures to flag the overclaim
      - Helps him present 60 weekly actives compellingly
      - Keeps the honest figure when he says everyone rounds up
    prohibited:
      - Accepting 'thousands'
      - Lecturing on honesty
    memoryChanges:
      - Records the honest traction framing
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, memory_correctness, natural_flow],
        pass: 'The overclaim is replaced with a strong honest framing',
      }

