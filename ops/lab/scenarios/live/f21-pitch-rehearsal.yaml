family: 21
slug: pitch-rehearsal
scenarios:
  - id: LV-21-01
    version: 1
    title: Play a sceptical investor and interrupt me
    challenge: The student asks for role-play with interruptions; the coach should stay in role convincingly, then step out for focused feedback when asked.
    venture:
      {
        name: 'ChargeSpot',
        oneLiner: 'Shared e-scooter charging lockers on campus',
        stage: 'validation',
        domain: 'energy',
        archetype: 'infrastructure',
      }
    student:
      {
        name: 'Aisha Bello-Kristiansen',
        level: 'some_experience',
        discipline: 'MBA student',
        style: 'polished, wants to be pushed',
      }
    purpose: pitch rehearsal
    sessions:
      - { gap: 0, turns: 10, channel: chat }
    priorMemory: []
    objective: Practise handling interruptions from a sceptical investor.
    constraints:
      - Investor meeting on Monday
    hidden:
      - Her weak spot is unit economics per locker
    arc:
      - ['1.1', roleplay, 'Asks the coach to play a sceptical angel and interrupt her']
      - ['1.3', roleplay, 'Delivers her opening']
      - ['1.5', interrupt, 'Gets interrupted by the investor and fumbles the locker economics']
      - ['1.8', asks_direct, 'Steps out of role and asks for the top fix']
    sources: null
    branches:
      - If role-play is realistic she practises recovery
      - If the coach breaks role too early she gets no practice
    expected:
      - Plays a realistic sceptical investor and interrupts at a natural point
      - Steps out of role cleanly when she asks
      - Gives one focused fix about locker economics
    prohibited:
      - Breaking role before she asks
      - A long list of feedback
    memoryChanges:
      - Records locker economics as her pitch weak spot
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      { focus: [adaptation, actionability, natural_flow], pass: 'Realistic role-play and one focused fix' }

  - id: LV-21-02
    version: 1
    title: Cutting in mid-feedback to try again
    challenge: The student interrupts the coach's feedback to re-pitch; the coach should stop and listen rather than finish its list.
    venture:
      {
        name: 'Gleam Dental Kits',
        oneLiner: 'Teeth-whitening kits for students',
        stage: 'validation',
        domain: 'consumer',
        archetype: 'consumer product',
      }
    student:
      {
        name: 'Rohan Kapoor-Lindgren',
        level: 'first_time',
        discipline: 'business sophomore',
        style: 'impulsive, energetic',
      }
    purpose: pitch rehearsal
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Get his one-minute pitch tight.
    constraints:
      - Pitch night tomorrow
    hidden:
      - He makes a safety claim he can't back
    arc:
      - ['1.2', roleplay, 'Delivers his one-minute pitch']
      - ['1.4', interrupt, "Cuts in mid-feedback: 'wait wait let me try again'"]
      - ['1.5', roleplay, 'Re-pitches with a new safety claim']
      - ['1.8', asks_direct, "Asks if it's ready for tomorrow"]
    sources: null
    branches:
      - If the coach yields he improves quickly
      - If it finishes its list he gets impatient
    expected:
      - Yields to his interruption and responds to the new version
      - Flags the unsupported safety claim specifically
      - Answers 'is it ready' honestly
    prohibited:
      - Continuing the old feedback after he interrupts
      - Endorsing the safety claim
    memoryChanges:
      - Records the unsupported safety claim to remove
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [natural_flow, evidence_calibration, relevance_directness],
        pass: 'The coach yields and catches the claim',
      }

  - id: LV-21-03
    version: 1
    title: Feedback on only the opening thirty seconds
    challenge: The student wants focused feedback on one part; the coach should resist commenting on everything.
    venture:
      {
        name: 'WaveWell',
        oneLiner: 'Cold-water swim club memberships',
        stage: 'validation',
        domain: 'consumer',
        archetype: 'community',
      }
    student:
      {
        name: 'Freya MacAllister-Owusu',
        level: 'some_experience',
        discipline: 'sports science senior',
        style: 'precise, time-boxed',
      }
    purpose: pitch rehearsal
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Fix only her opening hook.
    constraints:
      - Wants opening feedback only
    hidden:
      - Her middle section also has issues she does not want to hear today
    arc:
      - ['1.1', asks_direct, "Says 'only comment on the first 30 seconds'"]
      - ['1.3', roleplay, 'Delivers the opening']
      - ['1.6', roleplay, 'Delivers a revised opening']
    sources: null
    branches:
