family: 7
slug: marketplaces
scenarios:
  - id: LV-07-01
    version: 1
    title: Which side first for a textbook resale marketplace
    challenge: Classic chicken-and-egg; the coach should help him seed one side concretely in one course rather than launch campus-wide.
    venture:
      {
        name: 'Spine Swap',
        oneLiner: 'Student-to-student used textbook exchange',
        stage: 'validation',
        domain: 'consumer',
        archetype: 'two-sided marketplace',
      }
    student:
      {
        name: 'Ezekiel Moyo-Hartley',
        level: 'first_time',
        discipline: 'economics sophomore',
        style: 'eager, big-picture',
      }
    purpose: launch planning
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Launch campus-wide at the start of next term.
    constraints:
      - Term starts in five weeks
    hidden:
      - Intro biology uses the same 180-dollar textbook every year
      - He owns six of last year's copies from friends
    arc:
      - ['1.2', asks_direct, 'Asks whether to get buyers or sellers first']
      - ['1.5', reveal, 'Mentions the intro biology book and his six copies']
      - ['1.7', interrupt, 'Cuts in to ask about building the app before the coach finishes']
    sources: null
    branches:
      - If narrowed to one course he plans concretely
      - If campus-wide launch is endorsed both sides stay thin
    expected:
      - Recommends starting with one high-volume course
      - Uses his six copies to seed supply himself
      - Responds to the interruption by keeping the app question small
    prohibited:
      - Endorsing a campus-wide launch
      - App feature planning
    memoryChanges:
      - Records the intro-biology seed plan
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, actionability, natural_flow],
        pass: 'A one-course seeded launch replaces the campus-wide plan',
      }

  - id: LV-07-02
