        discipline: 'environmental studies junior',
        style: 'idealistic, sustainability-minded',
      }
    purpose: metrics review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory:
      - { type: 'evidence', title: 'Listings', content: '140 items listed; 22 rentals in three months' }
    objective: Grow listings to 500 items.
    constraints:
      - Wants to keep it free for renters
    hidden:
      - 15 of the 22 rentals were camping gear before two weekend trips
      - The outdoors club rents gear to members informally
