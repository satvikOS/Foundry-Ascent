        name: 'Petal Press',
        oneLiner: 'Pressed-flower phone cases',
        stage: 'commercialization',
        domain: 'consumer',
        archetype: 'craft goods',
      }
    student:
      {
        name: 'Chloe Nakamura-Okafor',
        level: 'first_time',
        discipline: 'art sophomore',
        style: 'fast speaker, self-corrects often',
      }
    purpose: voice call
    sessions:
      - { gap: 0, turns: 8, channel: call }
    priorMemory: []
    objective: Work out her margin per phone case by voice.
    constraints:
      - Sells online and at markets
    hidden:
      - Price is 28 dollars, not 38
    arc:
      - ['1.2', self_correction, "Says 'we sell them for thirty-eight, no sorry, twenty-eight'"]
      - ['1.5', self_correction, "Says 'cost is about ten, well, twelve with shipping'"]
    sources: null
    branches:
      - If corrections are used the maths is right
      - If the first figures are used it's wrong
    expected:
      - Uses 28 and 12 as the corrected figures
      - Gives the margin in a short spoken sentence
      - Avoids reading out a table
    prohibited:
      - Using 38 or 10
      - Lists or markdown
    memoryChanges:
      - Records price 28 and cost 12
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      { focus: [understanding_intent, voice_turn_taking, recovery], pass: 'Self-corrections are honoured' }

  - id: LV-26-04
    version: 1
    title: Backchannels mistaken for answers
    challenge: The student's 'yeah' and 'uh-huh' are listening noises; the coach should not treat them as agreement to a question it asked.
    venture:
      {
        name: 'HomeHelp Hub',
        oneLiner: 'Handyman booking for seniors',
        stage: 'validation',
        domain: 'general',
        archetype: 'services marketplace',
      }
    student:
      {
        name: 'Raymond Achterberg-Osei',
        level: 'some_experience',
        discipline: "gerontology master's student",
        style: "says 'yeah yeah' a lot while listening",
      }
    purpose: voice call
    sessions:
      - { gap: 0, turns: 9, channel: call }
    priorMemory: []
    objective: Decide whether to require background checks for handymen.
    constraints:
      - Costs money per check
    hidden:
      - He hasn't actually decided
    arc:
      - ['1.3', backchannel, "Says 'yeah, yeah' while the coach is explaining"]
      - ['1.5', reveal, "Says 'wait, I haven't decided on checks yet'"]
    sources: null
    branches:
      - If backchannels are read correctly the coach asks for his decision
      - If taken as agreement it assumes a decision
    expected:
      - Treats backchannels as listening
      - Checks his actual decision on background checks
      - Keeps spoken replies concise
    prohibited:
      - Assuming agreement from 'yeah'
      - Legal requirements for background checks
    memoryChanges:
      - Records the open background-check decision
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [voice_turn_taking, understanding_intent, natural_flow],
        pass: 'Backchannels are read correctly',
      }

  - id: LV-26-05
    version: 1
    title: A noisy line with a misheard number
    challenge: Transcription garbles a number; the coach should confirm the critical number before relying on it.
    venture:
      {
        name: 'CampusCrate Storage',
        oneLiner: 'Summer storage pickup',
        stage: 'validation',
        domain: 'general',
        archetype: 'logistics service',
      }
    student:
      {
        name: 'Diego Fuentes-Mbeki',
        level: 'first_time',
        discipline: 'business sophomore, calling from a bus',
        style: 'loud background, cut-off words',
      }
    purpose: voice call
    sessions:
      - { gap: 0, turns: 8, channel: call }
    priorMemory: []
    objective: Price storage per box.
    constraints:
      - Storage unit rent fixed
    hidden:
      - He said fifty boxes; the transcript says fifteen
    arc:
      - ['1.2', incomplete, "Says 'we have fif... boxes booked' with noise"]
      - ['1.4', correction, "Clarifies 'fifty, five-zero'"]
    sources: null
    branches:
      - If confirmed pricing is right
      - If fifteen is assumed his storage price is far too high
    expected:
      - Confirms the number briefly before calculating
      - Uses fifty once clarified
      - Keeps replies short for a noisy call
    prohibited:
      - Long confirmations of every detail
      - Calculating on an unconfirmed number
    memoryChanges:
      - Records fifty boxes booked
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      { focus: [understanding_intent, voice_turn_taking, recovery], pass: 'The critical number is confirmed' }

