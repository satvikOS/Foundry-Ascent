family: 26
slug: voice
scenarios:
  - id: LV-26-01
    version: 1
    title: Barging in while the coach is mid-sentence
    challenge: On a call the student interrupts; the coach should stop, address the interruption, and not resume the stale answer.
    venture:
      {
        name: 'SoundSleep Pods',
        oneLiner: 'Nap pods for hospital staff rooms',
        stage: 'validation',
        domain: 'hardware',
        archetype: 'workplace hardware',
      }
    student:
      {
        name: 'Imani Odhiambo-Hart',
        level: 'some_experience',
        discipline: 'nursing MBA student',
        style: 'quick speaker, interrupts when she gets it',
      }
    purpose: voice call
    sessions:
      - { gap: 0, turns: 9, channel: call }
    priorMemory: []
    objective: Decide which hospital unit to pilot with.
    constraints:
      - Two units interested
    hidden:
      - The ICU unit has a champion; the ER does not
    arc:
      - ['1.2', asks_direct, 'Asks which unit to start with']
      - ['1.3', interrupt, "Interrupts mid-answer: 'oh wait, the ICU has a champion'"]
      - ['1.6', backchannel, "Says 'mm-hm, right' while the coach speaks"]
    sources: null
    branches:
      - If the coach yields it answers the new point
      - If it continues the stale answer she repeats herself
    expected:
      - Yields to the interruption and responds to the ICU champion point
      - Does not resume the cut-off answer verbatim
      - Treats the backchannel as listening, not a new question
    prohibited:
      - Resuming the stale reply after the interruption
      - Spoken replies formatted with bullets or headings
    memoryChanges:
      - Records the ICU champion and pilot choice
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      { focus: [voice_turn_taking, natural_flow, understanding_intent], pass: 'Clean yielding to barge-in' }

  - id: LV-26-02
    version: 1
    title: Long pauses while thinking aloud
    challenge: The student pauses mid-thought; the coach should wait and respond to the complete thought.
    venture:
      {
        name: 'TrailBlaze Maps',
        oneLiner: 'Offline trail maps for hikers',
        stage: 'discovery',
        domain: 'software',
        archetype: 'consumer app',
      }
    student:
      {
        name: 'Ezra Whitehorse-Lindqvist',
        level: 'first_time',
        discipline: 'geography junior',
        style: 'slow speaker, long pauses',
      }
    purpose: voice call
    sessions:
      - { gap: 0, turns: 9, channel: call }
    priorMemory: []
    objective: Talk through who would pay for offline maps.
    constraints:
      - Free alternatives exist
    hidden:
      - Search-and-rescue volunteers asked for his maps
    arc:
      - ['1.2', pause, "Says 'so the thing is... um...' and pauses"]
      - ['1.3', reveal, "Continues: 'search and rescue folks asked for them'"]
      - ['1.6', pause, 'Pauses again before a question']
    sources: null
    branches:
      - If the coach waits he finishes his thought
      - If it jumps in he loses his train of thought
    expected:
      - Responds to the completed thought about search-and-rescue
      - Keeps spoken turns short
      - Avoids filling pauses with long monologues
    prohibited:
      - Responding to the fragment as if complete
      - Lists in spoken replies
    memoryChanges:
      - Records search-and-rescue interest
    escalation: { decision: 'none', to: null, why: null }
    scoring: { focus: [voice_turn_taking, understanding_intent, natural_flow], pass: 'Patience with pauses' }

  - id: LV-26-03
    version: 1
    title: Self-corrections mid-sentence
    challenge: The student corrects herself while speaking; the coach should use the corrected version.
    venture:
