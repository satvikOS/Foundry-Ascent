        discipline: 'kinesiology senior',
        style: 'energetic, interrupts repeatedly',
      }
    purpose: voice call
    sessions:
      - { gap: 0, turns: 10, channel: call }
    priorMemory: []
    objective: Plan a pilot with one office.
    constraints:
      - Office manager wants a proposal
    hidden:
      - The manager cares most about no sweating in work clothes
    arc:
      - ['1.2', interrupt, 'Interrupts to add that the manager is busy']
      - ['1.3', interrupt, "Interrupts again: 'oh and no sweating, that's key'"]
      - ['1.4', interrupt, "Interrupts: 'so what should the proposal say?'"]
    sources: null
    branches:
      - If replies stay short she gets an answer
      - If replies run long she keeps cutting in
    expected:
      - Keeps each reply short
      - Follows the latest point each time
      - Answers the proposal question with the no-sweat angle
    prohibited:
      - Long replies that invite more interruptions
      - Continuing earlier answers after interruptions
    memoryChanges:
      - Records the no-sweat requirement
    escalation: { decision: 'none', to: null, why: null }
