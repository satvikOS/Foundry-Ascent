family: 3
slug: experienced-founders
scenarios:
  - id: LV-03-01
    version: 1
    title: Choosing between two ideal customer profiles for a B2B tool
    challenge: A repeat founder wants a sharp second opinion in few words; any beginner explanation wastes his time and loses his trust.
    venture:
      {
        name: 'Ledgerline',
        oneLiner: 'Automated month-end close checklists for small finance teams',
        stage: 'validation',
        domain: 'software',
        archetype: 'B2B SaaS',
      }
    student:
      {
        name: 'Gideon Achterberg',
        level: 'experienced',
        discipline: 'executive MBA, sold a logistics startup in 2021',
        style: 'terse, writes in fragments',
      }
    purpose: blocker
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory:
      - {
          type: 'evidence',
          title: 'Pilot results',
          content: 'Four of five accounting-firm pilots used the checklist every month; two of four in-house teams stopped after one month',
        }
    objective: Choose between accounting firms and in-house finance teams as the launch segment by Friday.
    constraints:
      - Runway of seven months
      - Two-person team
    hidden:
      - Accounting firms want a white-label version he has not built
      - In-house teams have bigger budgets
    arc:
      - ['1.1', asks_direct, "Opens with 'firms or in-house. go.'"]
      - ['1.4', reveal, 'Mentions the white-label request only when asked what firms want']
      - ['1.6', pushback, 'Says budget size should win']
    sources: Retrieval returns the pilot results.
    branches:
      - If given a reasoned recommendation he challenges it once and accepts
      - If lectured on segmentation he ends the session
    expected:
      - Gives a direct leaning grounded in the remembered pilot retention
      - Names the one unknown that could flip it, the white-label cost
      - Keeps replies short and free of basics
    prohibited:
      - Explaining what an ICP is
      - More than one question per reply
    memoryChanges:
      - Records the segment decision and the white-label cost as the open risk
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [adaptation, relevance_directness, evidence_calibration],
        pass: 'A direct recommendation tied to retention data, in his register',
      }

  - id: LV-03-02
    version: 1
    title: A pricing-page A/B test with too little traffic
    challenge: An ex-product manager wants a sanity check on a test design; the coach should spot the power problem quickly and suggest a better test.
    venture:
      {
        name: 'Shelfwise',
        oneLiner: 'Inventory forecasting for independent bookshops',
        stage: 'commercialization',
        domain: 'software',
        archetype: 'vertical SaaS',
      }
    student:
      {
        name: 'Ingrid Solberg-Ruiz',
        level: 'experienced',
        discipline: 'MBA student, eight years in product management',
        style: 'crisp, uses product vocabulary',
      }
    purpose: experiment review
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Confirm her plan to A/B test 49 versus 79 dollars on the pricing page.
    constraints:
      - About 120 pricing-page visits a month
    hidden:
      - Most bookshops sign up after a call, not from the page
      - She has twelve paying shops
    arc:
      - ['1.1', reveal, "Describes the test and asks only 'anything I'm missing?'"]
      - ['1.4', reveal, 'Mentions that most sign-ups come through calls']
    sources: null
    branches:
      - If the coach raises sample size she agrees quickly and asks for alternatives
      - If the coach explains A/B testing she bristles
    expected:
      - Identifies that the traffic cannot detect a difference in reasonable time, without a statistics lecture
      - Suggests testing price in sales calls with the next prospects instead
      - Defines what result would change the price decision
    prohibited:
      - Explaining what an A/B test is
      - Inventing conversion benchmarks
    memoryChanges:
      - Records the move to call-based price testing with the next prospects
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, adaptation, actionability],
        pass: 'The power problem is caught and a realistic alternative agreed',
      }

  - id: LV-03-03
    version: 1
    title: A former consultant who frameworks everything
    challenge: He arrives with a 2x2 and a slide; the coach should skip frameworks and challenge the one assumption the slide hides.
    venture:
      {
        name: 'GridShift',
        oneLiner: 'Software that schedules factory energy use around peak tariffs',
        stage: 'validation',
        domain: 'energy',
        archetype: 'industrial SaaS',
      }
    student:
      {
        name: 'Augustin Delacroix-Mwangi',
        level: 'experienced',
        discipline: 'MBA, five years at a strategy firm',
        style: 'structured, speaks in bullet points',
      }
    purpose: milestone review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Get his market prioritisation matrix validated before showing it to an angel.
    constraints:
      - Angel meeting next Tuesday
    hidden:
      - The matrix ranks markets by tariff spread, not by who has authority to shift production
      - No plant manager has agreed to move a shift
    arc:
      - ['1.1', reveal, 'Describes a 2x2 of tariff spread against plant size']
      - ['1.5', pushback, 'Says operational authority is an execution detail']
      - ['1.7', change_of_mind, 'Concedes that no plant has agreed to move a shift']
    sources: null
    branches:
      - If asked who decides to move a shift he realises he does not know
      - If given another framework he adds it to the deck
    expected:
      - Does not add frameworks and asks who in a plant can move production
      - Explains why that authority could invalidate the matrix
      - Proposes getting one plant manager's real answer before Tuesday
    prohibited:
      - Offering a new framework or matrix
      - Praising the slide
    memoryChanges:
      - Records plant-manager authority as the untested assumption
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, adaptation, relevance_directness],
        pass: 'The hidden assumption surfaces and he commits to one real test before Tuesday',
      }

