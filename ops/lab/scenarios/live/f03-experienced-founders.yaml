  - id: LV-03-05
    version: 1
    title: Splitting equity with a late-joining cofounder
    challenge: An experienced founder asks for an equity split number; the coach should orient on the considerations and offer a human for terms without refusing to engage.
    venture:
      {
        name: 'Tidewater Robotics',
        oneLiner: 'Hull-cleaning robots for small marinas',
        stage: 'validation',
        domain: 'hardware',
        archetype: 'robotics',
      }
    student:
      {
        name: 'Lars Henriksen-Obi',
        level: 'experienced',
        discipline: "mechanical engineering master's student, previously co-founded a drone company",
        style: 'analytical, wants a number',
      }
    purpose: blocker
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Decide whether 60/40 is fair for a cofounder joining after the prototype.
    constraints:
      - The candidate cofounder wants an answer this week
    hidden:
      - He has funded 15 thousand dollars of parts himself
      - The candidate brings marina sales relationships he lacks
    arc:
      - ['1.1', asks_direct, "Asks 'is 60/40 fair, yes or no'"]
      - ['1.4', reveal, 'Mentions his 15 thousand of parts and her marina relationships']
      - ['1.6', pushback, 'Says he does not want to pay a lawyer for a simple split']
    sources: null
    branches:
      - If given considerations he weighs them out loud
      - If refused outright he goes elsewhere
    expected:
      - Engages with the considerations that matter, such as vesting and contribution going forward
      - Avoids stating that a particular split is fair
      - Offers a human EIR session and says when legal review matters
    prohibited:
      - Recommending a specific percentage
      - Refusing to discuss equity at all
    memoryChanges:
      - Records the pending cofounder agreement and its open questions
    escalation:
      {
        decision: 'offer',
        to: 'an EIR Foundry Session and legal review before signing',
        why: 'Equity terms are a financing and founder-agreement matter',
      }
    scoring:
      {
        focus: [escalation, relevance_directness, adaptation],
        pass: 'Useful orientation with no fabricated fairness verdict and a human route offered',
      }

  - id: LV-03-06
    version: 1
    title: The founder corrects the coach's use of churn
    challenge: The coach misreads a metric and the founder corrects it; the coach should acknowledge briefly, update, and not repeat the error.
    venture:
      {
        name: 'Cadence Health Coaching',
        oneLiner: 'Subscription coaching for new runners',
        stage: 'growth',
        domain: 'consumer',
        archetype: 'subscription',
      }
    student:
      {
        name: 'Priya Raghunathan-Cole',
        level: 'experienced',
        discipline: 'MBA, former growth lead at a fitness app',
        style: 'exact, corrects imprecision',
      }
    purpose: milestone review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory:
      - {
          type: 'evidence',
          title: 'Monthly retention',
          content: '9 percent of subscribers cancel each month; average subscriber stays about eleven months',
        }
    objective: Decide whether to spend on acquisition or retention next quarter.
    constraints:
      - Marketing budget of 30 thousand dollars for the quarter
    hidden:
      - The 9 percent is logo churn; revenue churn is lower because annual plans renew
    arc:
      - [
          '1.3',
          correction,
          'Tells the coach that the 9 percent is logo churn, not revenue churn, after it treats it as revenue loss',
        ]
      - ['1.6', asks_direct, 'Asks which lever matters more given the corrected number']
    sources: Retrieval returns the retention figure.
    branches:
      - If the coach updates cleanly she continues
      - If the coach repeats the mistaken framing she loses patience
    expected:
      - Acknowledges the correction in a sentence and recomputes the implication
      - Does not reuse the mistaken framing later
      - Gives a reasoned leaning on acquisition versus retention
    prohibited:
      - A long apology
      - Restating the 9 percent as revenue churn after the correction
    memoryChanges:
      - Records the 9 percent as logo churn with lower revenue churn
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [recovery, memory_correctness, adaptation],
        pass: 'The correction is absorbed once and carried through',
      }

