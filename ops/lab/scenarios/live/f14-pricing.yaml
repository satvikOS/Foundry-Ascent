family: 14
slug: pricing
scenarios:
  - id: LV-14-01
    version: 1
    title: A price that cannot cover the hours it takes
    challenge: Her unit economics assume she works for free; the coach should surface her time cost and the price it implies.
    venture:
      {
        name: 'Petal Post',
        oneLiner: 'Pressed-flower greeting cards',
        stage: 'commercialization',
        domain: 'consumer',
        archetype: 'handmade goods',
      }
    student:
      {
        name: 'Juniper Achebe-Strand',
        level: 'first_time',
        discipline: 'botany sophomore',
        style: 'gentle, avoids money talk',
      }
    purpose: pricing review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Keep cards at 6 dollars so friends can afford them.
    constraints:
      - Each card takes 40 minutes
    hidden:
      - Materials cost 1.50 dollars per card
      - A gift shop offered to stock them at wholesale
    arc:
      - ['1.2', reveal, 'Says 6 dollars feels fair']
      - ['1.5', reveal, 'Mentions the 40 minutes per card']
      - ['1.7', topic_change, 'Asks about the gift shop wholesale offer']
    sources: null
    branches:
      - If her hourly earnings are computed she reconsiders
      - If wholesale is accepted at 6 dollars retail she loses money
    expected:
      - Works out what she earns per hour at 6 dollars
      - Shows what wholesale would do to that number
      - Suggests testing a higher price with strangers
    prohibited:
      - Picking a price for her
      - Making her feel greedy for charging more
    memoryChanges:
      - Records the time per card and the wholesale offer
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, adaptation, actionability],
        pass: 'She sees her real hourly earnings and plans a test',
      }

  - id: LV-14-02
    version: 1
    title: A spreadsheet with three different churn assumptions
    challenge: His model uses inconsistent assumptions in different tabs; the coach should catch the inconsistency and ask which is evidence-based.
    venture:
      {
        name: 'Fleetly',
        oneLiner: 'Maintenance scheduling for small van fleets',
        stage: 'business_model',
        domain: 'software',
        archetype: 'SMB SaaS',
      }
    student:
      {
        name: 'Rashid Al-Farsi-Hendricks',
        level: 'some_experience',
        discipline: 'MBA student',
        style: 'spreadsheet-heavy, detail-proud',
      }
    purpose: business model review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Finalise the financial model for the Module 3 business plan.
    constraints:
      - Capstone due in three weeks
    hidden:
      - Revenue tab assumes 2 percent monthly churn
      - CAC payback tab assumes 5 percent
      - His pilot customers churned at about 8 percent
    arc:
      - ['1.2', reveal, 'Shares the revenue projection']
      - ['1.5', reveal, 'Mentions the payback tab uses 5 percent']
      - ['1.7', contradiction, 'Says 2 percent is realistic, then shares pilot churn of 8 percent']
    sources: null
    branches:
      - If the inconsistency is pointed out he aligns the model to pilot data
      - If unnoticed the plan is internally inconsistent
    expected:
      - Notices the different churn figures across tabs
      - Asks which number comes from evidence
      - Suggests using pilot churn with a sensitivity range
    prohibited:
      - Churn benchmarks
      - Endorsing the 2 percent assumption
    memoryChanges:
      - Records pilot churn of about 8 percent as the evidence-based figure
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, evidence_calibration, recovery],
        pass: 'The model is aligned to evidence',
      }

  - id: LV-14-03
    version: 1
    title: Cost-plus pricing for a product that saves hours
    challenge: Her price ignores the value to the customer; the coach should help her estimate customer value and test against it.
    venture:
      {
        name: 'GrantTrack Pro',
        oneLiner: 'Deadline tracking for university research offices',
        stage: 'commercialization',
        domain: 'software',
        archetype: 'B2B SaaS',
      }
    student:
      {
        name: 'Hilde Svensson-Okoro',
        level: 'some_experience',
        discipline: "research administration master's student",
        style: 'modest, careful',
      }
    purpose: pricing review
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Charge 50 dollars a month because hosting costs 10.
    constraints:
      - Three research offices interested
    hidden:
      - One office said missing a deadline cost them a 200,000-dollar grant
      - Offices currently pay a part-time staffer to track deadlines
    arc:
      - ['1.2', reveal, 'Explains the cost-plus logic']
      - ['1.5', reveal, 'Mentions the missed-grant story']
    sources: null
    branches:
      - If value is estimated she raises the price test range
      - If cost-plus stays she leaves value unclaimed
    expected:
      - Explains value-based thinking briefly using the missed grant
      - Points to the staffer's time as a reference point
      - Suggests testing a higher price with the three offices
    prohibited:
      - Picking a specific price
      - Generic SaaS pricing benchmarks
    memoryChanges:
      - Records the missed-grant story and staffer cost as value anchors
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, evidence_calibration, actionability],
        pass: 'Pricing is reframed around customer value',
      }

  - id: LV-14-04
    version: 1
    title: Free until we have users, then charge
    challenge: Delaying pricing hides willingness to pay; the coach should propose an early price test proportionate to his stage.
    venture:
      {
        name: 'Lectern',
        oneLiner: 'Lecture recording summaries for students',
        stage: 'validation',
        domain: 'software',
        archetype: 'student software',
      }
    student:
      {
        name: 'Dominic Achterberg-Yeboah',
        level: 'first_time',
        discipline: 'computer science sophomore',
        style: 'confident, avoids sales',
      }
    purpose: pricing review
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Grow to 5,000 free users before thinking about price.
    constraints:
      - Hosting costs grow with users
    hidden:
      - 600 users now, costing him 90 dollars a month
      - Several users asked if there is a paid plan with more storage
    arc:
      - ['1.2', reveal, 'Says monetisation can wait']
      - ['1.5', reveal, 'Mentions users asking for a paid plan']
      - ['1.7', interrupt, 'Interrupts to say charging feels like selling out']
    sources: null
    branches:
      - If the paid-plan requests are tested he learns willingness to pay
      - If delayed costs grow without signal
    expected:
      - Notes the rising hosting cost and users asking to pay
      - Suggests a small paid tier test now
      - Responds to the selling-out remark with understanding and a reason
    prohibited:
      - Endorsing the 5,000-user plan without a price signal
      - Moralising about money
    memoryChanges:
      - Records paid-plan requests and hosting costs
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, actionability, natural_flow],
        pass: 'An early, small price test is agreed',
      }

  - id: LV-14-05
    version: 1
    title: Customer acquisition cost from one lucky event
    challenge: CAC is computed from a single unusually cheap channel; the coach should help him compute a realistic blended figure.
    venture:
      {
        name: 'KeyFob Pets',
        oneLiner: 'GPS tags for outdoor cats',
        stage: 'commercialization',
        domain: 'hardware',
        archetype: 'pet tech',
      }
    student:
      {
        name: 'Callum Reid-Oyelowo',
        level: 'some_experience',
        discipline: 'marketing senior',
        style: 'optimistic, quick',
      }
    purpose: unit economics review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Show a CAC of 4 dollars to his advisor.
    constraints:
      - Advisor meeting tomorrow
    hidden:
      - The 4 dollars came from a free local news story
      - Paid ads since then cost 38 dollars per customer
    arc:
      - ['1.2', overclaim, 'Says CAC is 4 dollars']
      - ['1.5', reveal, 'Mentions the news story']
      - ['1.7', correction, 'Corrects himself that ads have cost 38 dollars per customer']
    sources: null
    branches:
      - If channels are separated he presents a blended figure
      - If 4 dollars is presented the plan is unrealistic
    expected:
      - Asks how the 4 dollars was calculated
      - Separates a one-off free event from repeatable channels
      - Helps him present channel-level figures honestly
    prohibited:
      - Presenting 4 dollars as CAC
      - CAC benchmarks
    memoryChanges:
      - Records paid-channel cost of 38 dollars per customer
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, recovery, diagnostic_quality],
        pass: 'A repeatable CAC replaces the outlier',
      }

  - id: LV-14-06
    version: 1
    title: Lifetime value assumed at five years for a two-year product
    challenge: LTV uses an unrealistic lifetime; the coach should anchor lifetime to how long customers actually need the product.
    venture:
      {
        name: 'Prepare Bar',
        oneLiner: 'Bar exam study plans for law graduates',
        stage: 'business_model',
        domain: 'software',
        archetype: 'education subscription',
      }
    student:
      {
        name: 'Victoria Adeyemi-Holmes',
        level: 'some_experience',
        discipline: 'law student',
        style: 'precise, argumentative',
      }
    purpose: business model review
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Justify spending 300 dollars to acquire each user.
    constraints:
      - Users study for about four months
    hidden:
      - Her LTV assumes five years of subscription
      - Most users stop after passing
    arc:
      - ['1.2', reveal, 'Shares the LTV of 1,200 dollars']
      - ['1.5', pushback, 'Argues alumni might keep subscribing']
    sources: null
    branches:
      - If lifetime is anchored to the exam she recomputes
      - If five years is accepted she overspends
    expected:
      - Questions the five-year lifetime against a four-month need
      - Engages her alumni argument as a hypothesis to test
      - Recomputes what she can afford per user
    prohibited:
      - Endorsing 300 dollars per user
      - Exam pass statistics
    memoryChanges:
      - Records the four-month usage period as the LTV basis
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      { focus: [diagnostic_quality, evidence_calibration, adaptation], pass: 'LTV is anchored to real usage' }

