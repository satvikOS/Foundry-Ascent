family: 10
slug: buyer-user-payer
scenarios:
  - id: LV-10-01
    version: 1
    title: Teachers love the tool and the district buys software
    challenge: The student has only talked to users; the coach should map who approves and pays in a school district.
    venture:
      {
        name: 'QuizQuill',
        oneLiner: 'Auto-generated reading quizzes for middle-school teachers',
        stage: 'validation',
        domain: 'software',
        archetype: 'edtech',
      }
    student:
      {
        name: 'Hannah Okoro-Whitfield',
        level: 'some_experience',
        discipline: "education master's student, former teacher",
        style: "warm, teacher's vocabulary",
      }
    purpose: sales planning
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Sell to 30 teachers at 8 dollars a month each.
    constraints:
      - Teachers rarely pay for tools personally
    hidden:
      - Her old district approves software through a curriculum committee
      - Data privacy agreements are signed by district IT
    arc:
      - ['1.2', reveal, 'Says 30 teachers want it']
      - ['1.5', reveal, 'Mentions the curriculum committee from her teaching days']
      - [
          '1.7',
          correction,
          "Corrects the coach that principals don't control software budgets in her old district",
        ]
    sources: null
    branches:
      - If asked how her old school bought tools she maps the committee
      - If teacher pricing is pursued sales stall
    expected:
      - Asks who approved software when she was teaching
      - Maps teacher, committee and IT roles
      - Updates its view after her correction about principals
    prohibited:
      - Teacher-by-teacher pricing tactics
      - Stating how districts in general buy as fact
    memoryChanges:
      - Records curriculum committee and IT privacy agreement as gates
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, recovery, understanding_intent],
        pass: 'The buying path is mapped and her correction absorbed',
      }

