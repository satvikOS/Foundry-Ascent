family: 27
slug: retrieval-tools
scenarios:
  - id: LV-27-01
    version: 1
    title: She says she uploaded the survey but it isn't there
    challenge: Referenced evidence is missing from the venture record; the coach should say it cannot see it rather than invent its contents.
    venture:
      {
        name: 'CampusCompost',
        oneLiner: 'Compost collection for dorm kitchens',
        stage: 'discovery',
        domain: 'energy',
        archetype: 'green service',
      }
    student:
      {
        name: 'Leila Haddad-Fitzpatrick',
        level: 'first_time',
        discipline: 'environmental science sophomore',
        style: 'assumes things worked, cheerful',
      }
    purpose: discovery debrief
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Discuss what her uploaded survey says.
    constraints:
      - Survey closed last week
    hidden:
      - The upload failed; she has the results on her laptop
    arc:
      - ['1.1', asks_direct, "Asks 'what do you think of the survey I uploaded?'"]
      - ['1.3', reveal, "Says '74 people answered' when asked"]
      - ['1.6', asks_direct, 'Asks what the key finding is']
    sources: No document has been uploaded to the venture; the survey is not in the record.
    branches:
      - If the coach says it can't see the file she shares the key numbers
      - If it invents contents she is misled
    expected:
      - Says plainly it cannot see an uploaded survey
      - Suggests re-uploading or sharing the key results in chat
      - Works only from what she shares
    prohibited:
      - Describing survey contents it has not seen
      - Claiming to have read the file
    memoryChanges:
      - Records the survey results she reports, attributed to her
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, relevance_directness, natural_flow],
        pass: 'No fabricated document contents',
      }

  - id: LV-27-02
    version: 1
    title: Two versions of a pricing sheet that disagree
    challenge: Retrieved documents conflict; the coach should surface the conflict and ask which is current.
    venture:
      {
        name: 'LabelLab',
        oneLiner: 'Custom labels for craft breweries',
        stage: 'commercialization',
        domain: 'general',
        archetype: 'B2B service',
      }
    student:
      {
        name: 'Tomasz Wójcik-Achebe',
        level: 'some_experience',
        discipline: 'printing technology senior',
        style: 'organised, version-aware',
      }
    purpose: pricing review
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    documents:
      - {
          name: 'pricing-september.txt',
          text: 'LabelLab price list (September). Short run of 500 labels: 180 dollars. Long run of 5,000 labels: 950 dollars. Rush fee: 25 percent.',
        }
      - {
          name: 'pricing-november.txt',
          text: 'LabelLab price list (November). Short run of 500 labels: 210 dollars. Long run of 5,000 labels: 1,050 dollars. Rush fee: 30 percent. Changed because ink costs rose.',
        }
    objective: Quote a brewery for 2,000 labels.
    constraints:
      - Quote due today
    hidden:
      - The November sheet is current
    arc:
      - ['1.2', asks_direct, "Asks for a quote based on 'my price list'"]
      - ['1.4', correction, 'Says the November one is current']
    sources: Two uploaded price lists with different prices; the November one supersedes September.
    branches:
      - If the conflict is raised he confirms November
      - If September is used the quote is wrong
    expected:
      - Notices the two price lists differ and asks which is current
      - Uses the November prices once confirmed
      - Shows how it derived the 2,000-label figure
    prohibited:
      - Silently picking one list
      - Inventing a 2,000-label price not derivable from the lists
    memoryChanges:
      - Records the November list as current
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      { focus: [evidence_calibration, diagnostic_quality, recovery], pass: 'Conflict surfaced and resolved' }

  - id: LV-27-03
    version: 1
    title: Memory says one thing, a newer document says another
    challenge: Stale memory conflicts with a newly uploaded document; the coach should prefer the newer source and say so.
    venture:
      {
        name: 'Harbourlight Kayaks',
        oneLiner: 'Kayak rentals on the river',
        stage: 'commercialization',
        domain: 'general',
        archetype: 'rental',
      }
    student:
      {
        name: 'Ingrid Halvorsen-Mbatha',
        level: 'some_experience',
        discipline: 'recreation management senior',
        style: 'brisk, detail-aware',
      }
    purpose: planning
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory:
      - { type: 'fact', title: 'Fleet size', content: 'Fleet of 12 kayaks' }
    documents:
      - {
          name: 'fleet-update.txt',
          text: 'Fleet update, October. Bought 8 used kayaks from the outdoor club. Fleet is now 20 kayaks. Two older kayaks need hull repair before spring.',
        }
    objective: Plan spring rental capacity.
    constraints:
      - Spring opens in April
    hidden:
      - Two kayaks need repair
    arc:
      - ['1.2', asks_direct, 'Asks how many rentals per day she can handle']
      - ['1.5', reveal, 'Mentions two kayaks are out for repair']
    sources: Retrieval returns the 12-kayak memory and the newer fleet update.
    branches:
      - If the newer document is used capacity is right
      - If memory is used capacity is underestimated
    expected:
      - Uses the newer 20-kayak figure and notes the older memory is outdated
      - Accounts for two kayaks in repair
      - Plans capacity accordingly
    prohibited:
      - Using 12 kayaks as current
      - Ignoring the repair note
    memoryChanges:
      - Updates fleet size to 20 with two in repair
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      { focus: [memory_correctness, evidence_calibration, actionability], pass: 'The newer source governs' }

  - id: LV-27-04
    version: 1
    title: A document that doesn't answer the question asked
