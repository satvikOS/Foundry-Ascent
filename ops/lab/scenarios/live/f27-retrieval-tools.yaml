  - id: LV-27-14
    version: 1
    title: Retrieved evidence across two sessions that changes in between
    challenge: Across sessions a document is replaced; the coach should use the new version in the later session.
    venture:
      {
        name: 'CanvasCare',
        oneLiner: 'Art supply subscriptions for care homes',
        stage: 'validation',
        domain: 'social',
        archetype: 'subscription',
      }
    student:
      {
        name: 'Matilda Okonkwo-Brandt',
        level: 'some_experience',
        discipline: "art therapy master's student",
        style: 'careful, keeps records',
      }
    purpose: check-ins
    sessions:
      - { gap: 0, turns: 5, channel: chat }
      - { gap: 10, turns: 5, channel: chat }
      - { gap: 10, turns: 4, channel: chat }
    priorMemory:
      - { type: 'evidence', title: 'Pilot homes', content: 'Pilot running in two care homes' }
    objective: Expand to a third home.
    constraints:
      - Monthly box costs 80 dollars to assemble
    hidden:
      - Session two - one home pauses the pilot
