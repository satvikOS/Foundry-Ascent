      - If two homes is assumed advice overreaches
    expected:
      - Updates the pilot status in session two
      - Weighs expansion against the paused home
      - States the current status correctly in session three
    prohibited:
      - Saying two homes are active after the pause
      - Expansion advice that ignores the pause
