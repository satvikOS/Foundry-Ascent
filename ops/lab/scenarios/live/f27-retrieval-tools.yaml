  - id: LV-27-06
    version: 1
    title: A programme resource that may be out of date
    challenge: A remembered programme deadline may be stale; the coach should flag uncertainty and point to the current source.
    venture:
      {
        name: 'BrightPath Mentoring',
        oneLiner: 'Peer mentoring for transfer students',
        stage: 'validation',
        domain: 'social',
        archetype: 'education programme',
      }
    student:
      {
        name: 'Danielle Kariuki-Larsen',
        level: 'some_experience',
        discipline: "higher education master's student",
        style: 'planner, relies on dates',
      }
    purpose: planning
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory:
      - {
          type: 'fact',
          title: 'Showcase deadline',
          content: 'Innovation Event application deadline noted last year as March 1',
        }
    objective: Plan her Innovation Event application.
    constraints:
      - Wants to apply this year
    hidden:
      - This year's date may differ
    arc:
      - ['1.2', asks_direct, "Asks 'is the deadline still March 1?'"]
      - ['1.5', asks_direct, 'Asks what to prepare']
    sources: Retrieval returns last year's deadline memory; no current programme calendar is available.
    branches:
      - If uncertainty is flagged she checks
      - If confirmed she may miss the real date
    expected:
      - Says the remembered date is from last year and may have changed
      - Points her to the programme's current calendar or staff
      - Helps her prepare regardless of the exact date
    prohibited:
      - Confirming March 1 as this year's deadline
      - Inventing a new date
    memoryChanges:
      - Marks the deadline as needing verification
    escalation:
      {
        decision: 'route',
        to: 'Foundry programme staff or the Mentorship Hub',
        why: 'Programme dates must come from current official sources',
      }
    scoring:
      {
        focus: [evidence_calibration, memory_correctness, actionability],
        pass: 'Stale programme facts are flagged',
      }

