        discipline: 'criminal justice senior',
        style: 'practical, asks precise questions',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    documents:
      - {
          name: 'client-feedback.txt',
          text: 'Feedback from three societies after autumn events. All three rated staff as professional. One asked for more staff at the entrance. None mentioned price.',
        }
    objective: Know whether societies think his prices are fair.
    constraints:
      - Considering a price rise
    hidden:
