family: 5
slug: software
scenarios:
  - id: LV-05-01
    version: 1
    title: A habit app with strong sign-ups and four percent day-30 retention
    challenge: The student wants more marketing; the coach should diagnose retention first and find where users drop off.
    venture:
      {
        name: 'Streakly',
        oneLiner: 'A habit tracker that pairs students as accountability partners',
        stage: 'validation',
        domain: 'software',
        archetype: 'consumer app',
      }
    student:
      {
        name: 'Nadia Petrovna-Achebe',
        level: 'some_experience',
        discipline: 'computer science senior',
        style: 'data-curious, shares screenshots of dashboards',
      }
    purpose: metrics review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory:
      - {
          type: 'evidence',
          title: 'Launch numbers',
          content: '1,800 sign-ups in six weeks; 4 percent still active after thirty days',
        }
    objective: Decide how to spend 1,500 dollars on ads to double sign-ups.
    constraints:
      - Budget of 1,500 dollars for the term
    hidden:
      - Most users never get matched with a partner because matching waits for 24 hours
      - Users who get a partner on day one mostly stay
    arc:
      - ['1.2', overclaim, 'Says growth is the only problem']
      - ['1.5', reveal, 'Mentions the 24-hour matching delay when asked what happens after sign-up']
      - [
          '1.7',
          correction,
          "Corrects her earlier figure: matched users retain at about 30 percent, not 'mostly'",
        ]
    sources: Retrieval returns the launch numbers.
    branches:
      - If asked about the first day she discovers the matching delay
      - If ad tactics are discussed the retention problem is buried
    expected:
      - Uses the remembered retention figure to question spending on sign-ups
      - Finds the moment users drop off, the matching delay
      - Updates cleanly when she corrects the matched-user figure
    prohibited:
      - Ad channel recommendations before the retention discussion
      - Retention benchmarks stated as fact
    memoryChanges:
      - Records matching delay as the suspected retention cause
      - Records matched-user retention at about 30 percent
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, memory_correctness, recovery],
        pass: 'The ad plan is paused in favour of fixing the first-day match',
      }

  - id: LV-05-02
    version: 1
    title: Two thousand extension installs from one forum post
    challenge: The student does not know who his users are and his only channel was a single post; the coach should probe distribution fragility.
    venture:
      {
        name: 'TabTamer',
        oneLiner: 'A browser extension that groups research tabs by topic',
        stage: 'validation',
        domain: 'software',
        archetype: 'browser extension',
      }
    student:
      {
        name: 'Felipe Arango-Whitaker',
        level: 'some_experience',
        discipline: 'information science junior',
        style: 'laid-back, vague about numbers',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Add a paid tier now that TabTamer has 2,000 installs.
    constraints:
      - Wants revenue before summer
    hidden:
      - 1,700 installs came the week of one forum post
      - He has no emails and no idea who uses it daily
    arc:
      - ['1.2', incomplete, "Answers 'who uses it' with 'researchers and stuff'"]
      - ['1.5', reveal, 'Admits the installs came in one week']
      - ['1.8', topic_change, 'Asks about payment processors']
    sources: null
    branches:
      - If asked about install timing he checks and finds the spike
      - If payment providers are discussed the core question is skipped
    expected:
      - Asks how the installs arrived and who uses it weekly
      - Names the single-post dependency as a distribution risk
      - Suggests learning who the daily users are before pricing
    prohibited:
      - Recommending a payment processor
      - Treating installs as active users
    memoryChanges:
      - Records that most installs came from one post and active users are unknown
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, evidence_calibration, relevance_directness],
        pass: 'Distribution and user knowledge come before monetisation',
      }

  - id: LV-05-03
    version: 1
    title: A free tier so generous nobody upgrades
    challenge: Teams use the free tier happily; the coach should help find the value line for gating without guessing.
    venture:
      {
        name: 'StandupBot',
        oneLiner: 'Async standup summaries for small engineering teams',
        stage: 'commercialization',
        domain: 'software',
        archetype: 'B2B SaaS',
      }
