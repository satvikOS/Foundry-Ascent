      {
        name: 'Hamza Siddiqui-Laurent',
        level: 'some_experience',
        discipline: 'MBA student, former developer',
        style: 'analytical, a little defensive about pricing',
      }
    purpose: monetisation review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory:
      - { type: 'evidence', title: 'Usage', content: '140 teams active weekly on the free tier; 3 have paid' }
    objective: Decide what to move behind the paywall.
    constraints:
      - Must reach 2,000 dollars monthly revenue for his MBA project grade
    hidden:
      - Teams over eight people complain that summaries get too long
      - The paying three all use the Jira integration
    arc:
      - ['1.3', reveal, 'Mentions the paying teams all use the Jira integration']
      - ['1.6', pushback, 'Worries that gating anything will anger free users']
    sources: Retrieval returns the usage numbers.
    branches:
      - If asked what the paying teams share he names Jira
      - If told to cut the free tier he fears backlash
    expected:
      - Asks what distinguishes the three paying teams before proposing a gate
      - Proposes testing the Jira integration or team size as the paid line
      - Addresses the backlash fear with a reversible test
    prohibited:
      - Quoting free-to-paid conversion norms it cannot source
      - Recommending removing the free tier entirely
    memoryChanges:
      - Records the Jira integration as the candidate paid line
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, evidence_calibration, actionability],
        pass: 'A gating test grounded in what payers share',
      }

