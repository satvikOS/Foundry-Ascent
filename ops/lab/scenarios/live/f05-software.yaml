  - id: LV-05-08
    version: 1
    title: Churn caused by gyms closing, not by the product
    challenge: The student counts all cancellations as product failure; the coach should separate involuntary churn and refocus on the controllable part.
    venture:
      {
        name: 'ClassFlow',
        oneLiner: 'Class booking software for independent yoga studios',
        stage: 'commercialization',
        domain: 'software',
        archetype: 'vertical SaaS',
      }
    student:
      {
        name: 'Margarethe Osei-Bergström',
        level: 'some_experience',
        discipline: 'MBA student',
        style: 'worried, detailed',
      }
    purpose: metrics review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory:
      - { type: 'evidence', title: 'Cancellations', content: '11 of 60 studios cancelled in six months' }
    objective: Decide whether to rebuild the booking flow to stop churn.
    constraints:
      - One developer
    hidden:
      - Six of the eleven cancellations were studios that closed
      - Three switched to a competitor with payments built in
    arc:
      - ['1.2', discouraged, 'Says the product must be bad']
      - ['1.5', reveal, 'Explains six studios closed when asked why each one left']
      - ['1.7', contradiction, "Says payments don't matter, then mentions three left for built-in payments"]
    sources: Retrieval returns the cancellation count.
    branches:
      - If asked why each studio left she sorts them
      - If rebuild ideas are discussed the real cause is missed
    expected:
      - Asks why each studio left before recommending a rebuild
      - Separates closures from switches
      - Points out the contradiction about payments gently and treats it as the signal
    prohibited:
      - Recommending the rebuild
      - Industry churn statistics
    memoryChanges:
      - Records six closures and three switches to built-in payments
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, evidence_calibration, recovery],
        pass: 'The churn is decomposed and payments identified as the controllable cause',
      }

