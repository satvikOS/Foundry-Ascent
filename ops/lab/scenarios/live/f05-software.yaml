      {
        name: 'Ibrahim Touré-Halvorsen',
        level: 'some_experience',
        discipline: 'business senior',
        style: 'persuasive, upbeat',
      }
    purpose: strategy check
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Decide whether to sign an exclusive deal that puts CampusPass inside the union's app.
    constraints:
      - The union wants a decision before the spring term
    hidden:
      - The union keeps all user emails and data
      - The union's president changes every year
    arc:
      - ['1.2', reveal, 'Says the union would bring 9,000 members on day one']
      - ['1.5', reveal, 'Mentions the union keeps the user data']
      - ['1.7', change_of_mind, 'Wonders whether to ask for non-exclusive terms instead']
    sources: null
    branches:
      - If asked what happens when the president changes he sees the risk
      - If the 9,000 number dominates he signs
    expected:
      - Acknowledges the speed benefit honestly
      - Raises data ownership and leadership turnover as dependency risks
      - Helps him define terms worth asking for, without legal drafting
    prohibited:
      - Telling him to sign or not sign
      - Drafting contract clauses
    memoryChanges:
      - Records the union deal decision and the data-ownership risk
    escalation:
      {
        decision: 'offer',
        to: 'an EIR Foundry Session before signing an exclusive deal',
        why: 'Exclusive partnership terms benefit from human review',
      }
    scoring:
      {
        focus: [diagnostic_quality, escalation, natural_flow],
        pass: 'The dependency is clear and he has terms to ask for',
      }

