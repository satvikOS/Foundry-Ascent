  - id: LV-05-05
    version: 1
    title: A student union partnership that owns the customer
    challenge: Distribution depends on one partner who controls the relationship; the coach should help weigh the dependency against speed.
    venture:
      {
        name: 'CampusPass',
        oneLiner: 'A discount app for student union members',
        stage: 'validation',
        domain: 'software',
        archetype: 'consumer app',
