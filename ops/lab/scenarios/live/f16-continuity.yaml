  - id: LV-16-04
    version: 1
    title: What did we decide last time
    challenge: The student directly asks for last session's decisions; the coach should recall accurately and specifically or say what it is unsure of.
    venture:
      {
        name: 'GreenCrate',
        oneLiner: 'Reusable delivery crates for local grocers',
        stage: 'validation',
        domain: 'energy',
        archetype: 'circular logistics',
