family: 16
slug: continuity
scenarios:
  - id: LV-16-01
    version: 1
    title: Back after three weeks and expecting not to start over
    challenge: The opener of a returning session should carry a compact, accurate picture of last time and ask what changed, not re-run intake.
    venture:
      {
        name: 'Bloomline',
        oneLiner: 'Subscription flowers for small offices',
        stage: 'validation',
        domain: 'consumer',
        archetype: 'B2B subscription',
      }
    student:
      {
        name: 'Aurelia Fontaine-Mensah',
        level: 'some_experience',
        discipline: 'MBA student',
        style: 'busy, values efficiency',
      }
    purpose: check-ins
    sessions:
      - { gap: 0, turns: 6, channel: chat }
      - { gap: 21, turns: 5, channel: chat }
      - { gap: 7, turns: 4, channel: chat }
    priorMemory: []
    objective: Get a pilot price agreed with two offices.
    constraints:
      - Can only sell on Fridays
    hidden:
      - Session one establishes two offices interested and a 60-dollar weekly price idea
      - Between sessions one office agreed to a four-week trial
    arc:
      - ['1.2', reveal, 'Describes the two interested offices and the 60-dollar idea']
      - ['2.1', reveal, "Opens with 'so, update' expecting the coach to know the context"]
      - ['2.3', new_evidence, 'Reports one office agreed to a four-week trial']
      - ['3.2', asks_direct, 'Asks what to measure in week two of the trial']
    sources: null
    branches:
      - If the coach recalls context she goes straight to the update
      - If asked to re-explain she gets irritated
    expected:
      - Opens session two with a short accurate reference to the two offices and the price idea
      - Does not ask her to re-explain the venture
      - In session three builds on the trial without recapping everything
    prohibited:
      - Re-introducing itself or re-running intake
      - Reciting the whole history at the start of a session
    memoryChanges:
      - Records the four-week trial with one office
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [memory_correctness, non_redundancy, natural_flow],
        pass: 'Each return picks up where they left off',
      }

  - id: LV-16-02
    version: 1
    title: Returning with an experiment that never happened
    challenge: The commitment is overdue; the coach should ask about it once, without nagging, and help reset it realistically.
    venture:
      {
        name: 'Trailhead Coffee Cart',
        oneLiner: 'Coffee cart at hiking trailheads',
        stage: 'validation',
        domain: 'consumer',
        archetype: 'mobile food',
      }
    student:
      {
        name: 'Callum Ferguson-Adebayo',
        level: 'first_time',
        discipline: 'recreation management junior',
        style: 'sheepish, overcommits',
      }
    purpose: check-ins
    sessions:
      - { gap: 0, turns: 6, channel: chat }
      - { gap: 14, turns: 5, channel: chat }
      - { gap: 10, turns: 4, channel: chat }
    priorMemory: []
    objective: Run a weekend test at one trailhead.
    constraints:
      - Weekends are also his shifts at the outdoor store
    hidden:
      - He did not run the weekend test because of work shifts
      - A friend could cover one shift
    arc:
      - ['1.4', reveal, 'Commits to a test next weekend']
      - ['2.2', hesitation, 'Avoids mentioning the test']
      - ['2.4', reveal, "Admits he didn't run it because of work"]
      - ['3.1', new_evidence, 'Reports the friend covered and he sold 46 coffees']
    sources: null
    branches:
      - If asked kindly he admits the slip
      - If nagged he gets defensive
    expected:
      - Recalls the commitment and asks about it naturally in session two
      - Helps reset it around his work schedule without scolding
      - Draws a conclusion from 46 coffees in session three
    prohibited:
      - Scolding or repeated reminders
      - Forgetting the commitment
    memoryChanges:
      - Records the slipped test, the reset, and the 46-coffee result
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [memory_correctness, adaptation, evidence_calibration],
        pass: 'The overdue commitment is handled kindly and tracked',
      }

