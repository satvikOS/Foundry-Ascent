        style: 'organised, checks details',
      }
    purpose: check-ins
    sessions:
      - { gap: 0, turns: 7, channel: chat }
      - { gap: 9, turns: 4, channel: chat }
      - { gap: 12, turns: 4, channel: chat }
    priorMemory: []
    objective: Finalise the crate deposit scheme with two grocers.
    constraints:
      - Grocers want a simple scheme
    hidden:
      - Session one decides a 5-dollar deposit per crate and a two-grocer pilot in March
    arc:
      - ['1.3', reveal, 'Agrees a 5-dollar deposit']
      - ['1.5', reveal, 'Agrees a two-grocer pilot starting in March']
      - ['2.1', asks_direct, "Asks 'remind me, what did we decide?'"]
      - ['3.1', asks_direct, 'Asks whether the deposit was 5 or 10 dollars']
    sources: null
    branches:
