  - id: LV-12-10
    version: 1
    title: Evidence accumulating across three check-ins
    challenge: Over three sessions the evidence strengthens; the coach should update its conclusions each time instead of repeating early caveats.
    venture:
      {
        name: 'QuietCart',
        oneLiner: 'Sensory-friendly grocery hours booked through an app',
        stage: 'validation',
        domain: 'social',
        archetype: 'booking service',
