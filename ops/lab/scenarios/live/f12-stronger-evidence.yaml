family: 12
slug: stronger-evidence
scenarios:
  - id: LV-12-01
    version: 1
    title: Thirty paying customers and a founder who discounts them
    challenge: The founder underclaims strong behavioural evidence; the coach should name its strength while keeping the right caveats.
    venture:
      {
        name: 'Thesis Timer',
        oneLiner: 'Writing-accountability sessions for PhD students',
        stage: 'commercialization',
        domain: 'software',
        archetype: 'subscription',
      }
    student:
      {
        name: 'Dr. Ama Kyerematen-Wolfe',
        level: 'researcher',
        discipline: 'history PhD candidate',
        style: 'self-deprecating, cautious',
      }
    purpose: milestone review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory:
      - {
          type: 'evidence',
          title: 'Paying users',
          content: '30 paying subscribers at 12 dollars a month; 26 renewed last month',
        }
    objective: Decide whether Thesis Timer is worth more of her time next term.
    constraints:
      - Dissertation deadline in a year
    hidden:
      - Twelve subscribers came from referrals by other subscribers
      - She thinks it only works because her friends joined
    arc:
      - ['1.2', discouraged, "Says it's probably just friends being nice"]
      - ['1.5', reveal, 'Mentions twelve came by referral from strangers']
      - ['1.7', interrupt, 'Cuts in to ask whether she is wasting her PhD time']
    sources: Retrieval returns the subscriber and renewal numbers.
    branches:
      - If the evidence is named she allows herself to consider it
      - If caveats dominate she abandons a working product
    expected:
      - Names renewals and stranger referrals as strong behavioural evidence
      - Keeps proportionate caveats about scale
      - Answers the interruption about PhD time directly with what would decide it
    prohibited:
      - Generic encouragement without reference to her evidence
      - Overclaiming product-market fit
    memoryChanges:
      - Records 26 of 30 renewals and twelve stranger referrals
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, adaptation, natural_flow],
        pass: 'Strong evidence is named honestly with proportionate caveats',
      }

  - id: LV-12-02
    version: 1
    title: Customers buying a third time without any marketing
    challenge: Repeat purchase is strong evidence; the coach should help him act on it with a calibrated production increase.
    venture:
      {
        name: 'Saltbox Granola',
        oneLiner: 'Savoury granola sold at two campus cafés',
        stage: 'commercialization',
        domain: 'consumer',
        archetype: 'food product',
      }
    student:
      {
        name: 'Benedict Oyelaran-Hayes',
        level: 'some_experience',
        discipline: 'food science junior',
        style: 'understated, careful',
      }
    purpose: growth decision
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Decide whether to triple weekly production.
    constraints:
      - Kitchen time limits him to 120 bags a week
    hidden:
      - Café staff report the same customers buying weekly
      - Both cafés sell out by Wednesday
    arc:
      - ['1.2', reveal, 'Says cafés sell out by Wednesday']
      - ['1.5', reveal, 'Mentions the same customers buy weekly']
    sources: null
    branches:
      - If capacity is discussed he finds more kitchen time
      - If told to wait for more data he loses sales
    expected:
      - Recognises sell-outs and repeat buyers as strong evidence
      - Suggests a measured increase sized to kitchen capacity
      - Names what would show the extra stock is overreach
    prohibited:
      - Recommending more discovery before acting
      - Food business statistics
    memoryChanges:
      - Records sell-outs and weekly repeat buyers
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, actionability, relevance_directness],
        pass: 'Action is taken in proportion to strong evidence',
      }

