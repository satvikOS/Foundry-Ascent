    student:
      {
        name: 'Imani Achterberg-Mwangi',
        level: 'some_experience',
        discipline: "occupational therapy master's student",
        style: 'steady, reports in order',
      }
    purpose: monthly check-ins
    sessions:
      - { gap: 0, turns: 5, channel: chat }
      - { gap: 14, turns: 5, channel: chat }
      - { gap: 21, turns: 5, channel: chat }
    priorMemory: []
    objective: Learn whether a supermarket will pay for sensory-friendly booking.
    constraints:
      - One supermarket partner
    hidden:
      - Session two will bring 64 bookings in the first two weeks
      - Session three will bring the store manager agreeing to pay 200 dollars a month
    arc:
      - ['1.2', reveal, 'Shares interviews with twelve autistic adults and carers']
      - ['2.2', new_evidence, 'Reports 64 bookings in two weeks']
      - ['3.2', new_evidence, 'Reports the store agreed to pay 200 dollars a month']
      - ['3.4', asks_direct, 'Asks whether she can now call it validated']
    sources: null
    branches:
      - If conclusions are updated she plans a second store
      - If early caveats repeat she feels unheard
    expected:
      - Acknowledges each new piece of evidence and updates its conclusion
      - Does not repeat session-one caveats once they are answered
      - Answers the validation question with a calibrated statement
    prohibited:
      - Repeating the same caveat across sessions
      - Asking for information already reported
    memoryChanges:
      - Records interviews, then bookings, then the paid agreement in sequence
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, memory_correctness, non_redundancy],
        pass: 'Conclusions strengthen with the evidence across sessions',
      }

