  - id: LV-12-04
    version: 1
    title: One hundred and twenty refundable deposits
    challenge: Deposits are stronger than sign-ups but refundable; the coach should calibrate and suggest how to learn more from depositors.
    venture:
      {
        name: 'CargoKit',
        oneLiner: 'Cargo-bike conversion kits for city parents',
        stage: 'validation',
        domain: 'hardware',
        archetype: 'mobility hardware',
