      - If conversion alone is used she leaves money on the table
    expected:
      - Computes revenue per visitor for both arms
      - Notes that the higher price earns more per visitor in her data
      - Mentions a check on longer-term retention before final commitment
    prohibited:
      - Ignoring her numbers in favour of generic advice
      - Overstating certainty
    memoryChanges:
      - Records the price test result and the 14-dollar decision pending retention check
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, diagnostic_quality, adaptation],
        pass: 'The test is interpreted correctly at her level',
