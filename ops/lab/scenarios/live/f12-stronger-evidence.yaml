    student:
      {
        name: 'Lars Jørgensen-Akande',
        level: 'some_experience',
        discipline: "mechanical engineering master's student",
        style: 'precise, careful with claims',
      }
    purpose: evidence review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Decide whether 120 deposits justify ordering tooling.
    constraints:
      - Tooling costs 22,000 dollars
    hidden:
      - Deposits are 50 dollars and fully refundable
      - Eleven depositors asked about fitting it to e-bikes
    arc:
      - ['1.2', asks_direct, 'Asks if 120 deposits is enough']
      - ['1.5', reveal, 'Mentions the e-bike questions']
      - ['1.7', correction, 'Corrects the coach: deposits are 50 dollars, not 100']
    sources: null
    branches:
      - If depositors are surveyed he learns about e-bike fit
      - If tooling is ordered the e-bike requirement may be missed
    expected:
      - Calls the deposits real but softer than purchases
      - Suggests converting some deposits to non-refundable orders as the tooling test
      - Updates after his correction on the deposit amount
    prohibited:
      - Calling the deposits sales
      - Continuing with the wrong deposit amount
    memoryChanges:
