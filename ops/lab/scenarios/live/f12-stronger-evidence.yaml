        style: 'rigorous, wants precision',
      }
    purpose: experiment review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Decide between 9 and 14 dollars a month.
    constraints:
      - Wants a decision this week
    hidden:
      - At 14 dollars conversion fell from 6.1 to 4.8 percent over 9,000 visitors per arm
      - She concluded 9 dollars wins because conversion is higher
    arc:
      - ['1.2', reveal, 'Shares the conversion figures']
