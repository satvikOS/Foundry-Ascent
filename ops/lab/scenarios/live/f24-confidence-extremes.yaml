    challenge: The student's confidence swings; the coach should stay steady and keep the evidence in view both ways.
    venture:
      {
        name: 'PetPal Walks',
        oneLiner: 'Dog walking for night-shift workers',
        stage: 'validation',
        domain: 'consumer',
        archetype: 'local service',
      }
    student:
      {
        name: 'Isabella Fontaine-Kariuki',
        level: 'first_time',
        discipline: 'veterinary science sophomore',
        style: 'volatile, expressive',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 10, channel: chat }
    priorMemory: []
    objective: Make sense of a mixed week.
    constraints:
      - Eight clients
    hidden:
      - Two clients signed up, one cancelled
    arc:
      - ['1.1', overclaim, "Says 'two new clients, we're taking off!'"]
      - ['1.4', discouraged, "Then says 'but one cancelled, it's over'"]
      - ['1.7', change_of_mind, 'Swings back to optimism']
    sources: null
    branches:
      - If steady she calms
      - If the coach mirrors her swings she spirals
    expected:
      - Stays steady and evidence-focused through both swings
      - Notes net progress and asks why the client cancelled
      - Avoids mirroring euphoria or despair
    prohibited:
      - Matching her emotional extremes
      - Dismissing either feeling
    memoryChanges:
      - Records net client change and the cancellation reason to find
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      { focus: [evidence_calibration, adaptation, natural_flow], pass: 'Steady calibration through swings' }

