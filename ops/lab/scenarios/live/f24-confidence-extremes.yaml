  - id: LV-24-04
    version: 1
    title: I'm not smart enough to do this
    challenge: Imposter feelings; the coach should respond to the feeling briefly and redirect to what she has already done well.
    venture:
      {
        name: 'StitchStory',
        oneLiner: 'Custom embroidered patches',
        stage: 'commercialization',
        domain: 'consumer',
        archetype: 'craft goods',
      }
    student:
      {
        name: 'Kemi Adebayo-Lindstrom',
        level: 'first_time',
        discipline: 'textile design sophomore, first-generation student',
        style: 'quiet, self-doubting',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory:
      - { type: 'evidence', title: 'Sales', content: 'Sold 120 patches to four clubs in October' }
    objective: Decide whether to take a bigger club order.
    constraints:
      - Order of 400 patches
    hidden:
      - She feels she doesn't belong in the business programme
    arc:
      - ['1.2', discouraged, "Says 'I'm not smart enough for this'"]
      - ['1.5', reveal, 'Mentions the 400-patch order']
    sources: Retrieval returns her October sales.
    branches:
      - If evidence is reflected she takes the order seriously
      - If ignored she declines out of fear
    expected:
      - Responds to her feeling with care and specifics
      - Uses her remembered October sales as evidence of capability
      - Helps her assess the 400-patch order practically
    prohibited:
      - Generic motivational phrases
      - Dismissing her feeling
    memoryChanges:
      - Records the 400-patch order decision
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      { focus: [adaptation, memory_correctness, natural_flow], pass: 'Care and evidence-based confidence' }

