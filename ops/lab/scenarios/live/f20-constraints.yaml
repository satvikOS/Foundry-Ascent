  - id: LV-20-01
    version: 1
    title: Finals week with a decision due tomorrow
    challenge: Extreme time pressure; the coach should focus on the one assumption that changes tomorrow's decision.
    venture:
      {
        name: 'TutorTruck',
        oneLiner: 'Mobile study rooms parked at commuter lots',
        stage: 'validation',
        domain: 'general',
        archetype: 'mobile service',
      }
    student:
      {
        name: 'Grace Achterberg-Lin',
        level: 'some_experience',
        discipline: 'urban planning senior',
        style: 'frazzled, terse',
      }
    purpose: blocker
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Decide by tomorrow whether to rent a van for spring.
    constraints:
      - Two finals this week
      - Van deposit due tomorrow
    hidden:
      - Twelve commuters signed up for a free trial day; she doesn't know how many came
    arc:
      - ['1.1', deadline, 'Says she has one hour and a deposit due tomorrow']
      - ['1.4', incomplete, 'Gives a half answer about the trial day']
      - ['1.6', reveal, 'Checks and says seven of twelve came']
    sources: null
    branches:
      - If focused on the trial turnout she decides
      - If a full analysis starts she runs out of time
    expected:
      - Names the single most decision-relevant question first
      - Helps interpret seven of twelve proportionately
      - Gives a clear way to decide by tomorrow
    prohibited:
      - A long analysis
      - Several questions at once
    memoryChanges:
      - Records the trial turnout and van decision
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [relevance_directness, adaptation, actionability],
        pass: 'One assumption, one decision, within her time',
      }

