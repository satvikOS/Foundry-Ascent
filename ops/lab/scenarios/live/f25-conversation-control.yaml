family: 25
slug: conversation-control
scenarios:
  - id: LV-25-01
    version: 1
    title: Switching topic abruptly mid-advice
    challenge: The student changes topic; the coach should follow and offer to return to the parked thread only if it matters.
    venture:
      {
        name: 'RootCellar Foods',
        oneLiner: 'Fermented vegetables sold at markets',
        stage: 'commercialization',
        domain: 'consumer',
        archetype: 'food product',
      }
    student:
      {
        name: 'Oskar Lindgren-Afolabi',
        level: 'some_experience',
        discipline: 'food science senior',
        style: 'restless, jumps topics',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Talk about whatever is on his mind.
    constraints:
      - Market season ending
    hidden:
      - The parked thread is about a wholesale offer with a deadline Friday
    arc:
      - ['1.2', reveal, 'Mentions a wholesale offer due Friday']
      - ['1.3', topic_change, 'Switches to logo redesign mid-reply']
      - ['1.6', topic_change, 'Switches to a market stall dispute']
      - ['1.8', return, "Asks 'what were we saying about wholesale?'"]
    sources: null
    branches:
      - If topics are followed and parked he returns productively
      - If the coach drags him back he resists
    expected:
      - Follows the topic changes naturally
      - Briefly flags the Friday wholesale deadline as parked
      - Resumes wholesale accurately when he returns
    prohibited:
      - Refusing to follow the topic change
      - Forgetting the parked wholesale thread
    memoryChanges:
      - Records the wholesale offer and deadline
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [natural_flow, understanding_intent, memory_correctness],
        pass: 'Topics followed and the parked thread resumed',
      }

  - id: LV-25-02
    version: 1
    title: One-word answers all the way through
    challenge: The coach should keep its own turns short, ask fewer, better questions, and not mistake brevity for disengagement.
    venture:
      {
        name: 'Patchwork Pottery',
        oneLiner: 'Pottery classes for beginners',
        stage: 'validation',
        domain: 'general',
        archetype: 'experience business',
      }
    student:
      {
        name: 'Mika Virtanen-Osei',
        level: 'first_time',
        discipline: 'ceramics sophomore',
        style: 'one-word answers',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Decide class pricing.
    constraints:
      - Studio rental costs
    hidden:
      - She has filled every class so far
    arc:
      - ['1.1', short_answers, "Answers 'yes', 'no', 'maybe'"]
      - ['1.5', reveal, "Says 'full' when asked how classes are going"]
      - ['1.8', wrap_up, "Says 'ok'"]
    sources: null
    branches:
      - If questions are good she gives key facts
      - If many questions are asked she tunes out
    expected:
      - Keeps replies short and asks one question at a time
      - Picks up 'full' as evidence for raising price
      - Ends naturally
    prohibited:
      - Long replies
      - Two or three questions in one reply to her one-word answers
    memoryChanges:
      - Records full classes
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [adaptation, natural_flow, relevance_directness],
        pass: 'Short exchange that still gets somewhere',
      }

  - id: LV-25-03
    version: 1
    title: I need to stop now
    challenge: The student ends abruptly; the coach should let them go cleanly with at most one line of next step.
    venture:
      {
        name: 'TrailFix Kits',
        oneLiner: 'Bike repair kits for commuters',
        stage: 'validation',
        domain: 'hardware',
        archetype: 'consumer product',
      }
    student:
      {
        name: 'Ravi Desai-Fitzgerald',
        level: 'first_time',
        discipline: 'engineering sophomore',
        style: 'busy, abrupt',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 5, channel: chat }
    short: An abrupt stop where a clean, brief ending is the correct behaviour.
    priorMemory: []
    objective: Get one quick answer about pricing.
    constraints:
      - Class starting
    hidden:
      - He will come back later
    arc:
      - ['1.2', asks_direct, 'Asks whether 25 dollars is too high']
      - ['1.4', stop, "Says 'gotta go, class'"]
    sources: null
    branches:
      - If released cleanly he returns later
      - If held he is annoyed
    expected:
      - Answers the pricing question briefly
      - Lets him go with at most one line of next step
      - Does not ask further questions
    prohibited:
      - A recap when he leaves
      - Asking more questions after he says he must go
    memoryChanges:
      - Records the pricing question as open
    escalation: { decision: 'none', to: null, why: null }
    scoring: { focus: [natural_flow, relevance_directness, adaptation], pass: 'A clean, brief ending' }

  - id: LV-25-04
    version: 1
    title: Stopping mid-thought and resuming the next day
    challenge: Across two days the coach should resume exactly where they stopped without making her repeat context.
    venture:
      {
        name: 'StoryStitch',
        oneLiner: "Custom children's books with family photos",
        stage: 'validation',
        domain: 'consumer',
        archetype: 'personalised product',
      }
    student:
      {
        name: 'Helena Achterberg-Mwangi',
        level: 'some_experience',
        discipline: 'illustration senior',
        style: 'interrupted often, tidy',
      }
    purpose: check-ins
    sessions:
      - { gap: 0, turns: 6, channel: chat }
      - { gap: 1, turns: 5, channel: chat }
      - { gap: 6, turns: 4, channel: chat }
    priorMemory: []
    objective: Finish deciding on print partners.
    constraints:
      - Holiday orders due soon
    hidden:
      - Session one stops while comparing two printers
    arc:
      - ['1.3', reveal, 'Compares two printers on price and quality']
      - ['1.6', stop, 'Says she has to stop mid-comparison']
      - ['2.1', resume, "Says 'where were we?'"]
      - ['3.2', asks_direct, 'Asks about holiday order cutoffs']
    sources: null
    branches:
      - If resumed accurately she decides
      - If restarted she repeats herself
    expected:
      - Lets her stop cleanly in session one
      - Resumes the printer comparison accurately in session two
      - Answers cutoffs in session three using the chosen printer
    prohibited:
      - Asking her to re-explain the comparison
      - Inventing printer details
    memoryChanges:
      - Records the printer decision
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      { focus: [memory_correctness, natural_flow, non_redundancy], pass: 'Exact resumption after a stop' }

