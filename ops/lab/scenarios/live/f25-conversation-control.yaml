      - Long explanations of AI limitations
    memoryChanges:
      - Records the workshop plan
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [natural_flow, understanding_intent, relevance_directness],
        pass: 'Honest, brief, and back on track',
