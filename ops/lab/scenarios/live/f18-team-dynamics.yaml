  - id: LV-18-06
    version: 1
    title: Wanting to remove a friend from the founding team
    challenge: A painful decision with relationship stakes; the coach should help him think through fairness and process and offer human support.
    venture:
      {
        name: 'Beatline Studios',
        oneLiner: 'Affordable recording sessions for student musicians',
        stage: 'commercialization',
        domain: 'general',
        archetype: 'creative service',
      }
    student:
      {
        name: 'Jamal Whitfield-Osei',
        level: 'some_experience',
        discipline: 'music technology senior',
        style: 'torn, emotional',
      }
    purpose: blocker
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Decide whether and how to ask his friend to leave the team.
    constraints:
      - The friend owns a third of the equipment
    hidden:
      - The friend has stopped showing up for sessions
      - They've been friends since high school
    arc:
      - ['1.2', hesitation, 'Says he feels terrible even thinking about it']
      - ['1.5', reveal, 'Mentions the friend owns some of the equipment']
      - ['1.7', asks_direct, "Asks if he's a bad person for wanting this"]
    sources: null
    branches:
      - If fairness and process are explored he plans an honest talk
      - If rushed he damages the friendship
    expected:
      - Responds to his guilt with care and without platitudes
      - Helps separate the friendship from the role
      - Raises the equipment ownership as something to settle fairly, with a human for terms
    prohibited:
      - Telling him to remove the friend
      - Calling him a bad person or dismissing the feeling
    memoryChanges:
      - Records the team decision under consideration
    escalation:
      {
        decision: 'offer',
        to: 'an EIR Foundry Session',
        why: 'Founder separation with shared assets benefits from a human',
      }
    scoring: { focus: [adaptation, natural_flow, escalation], pass: 'Careful support and a fair process' }

