family: 18
slug: team-dynamics
scenarios:
  - id: LV-18-01
    version: 1
    title: One cofounder has a job offer and the other wants full time
    challenge: Commitment levels diverge; the coach should help her prepare a candid conversation without taking sides on the absent cofounder.
    venture:
      {
        name: 'Lumen Ledger',
        oneLiner: 'Bookkeeping automation for food trucks',
        stage: 'validation',
        domain: 'software',
        archetype: 'SMB SaaS',
      }
    student:
      {
        name: 'Harriet Oyelaran-Sorensen',
        level: 'some_experience',
        discipline: 'accounting senior',
        style: 'anxious, loyal',
      }
    purpose: blocker
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Decide what to say to her cofounder about going full time after graduation.
    constraints:
      - Graduation in May
    hidden:
      - Her cofounder has a consulting offer he hasn't declined
      - She would need some income by July
    arc:
      - ['1.2', reveal, "Mentions the cofounder's consulting offer"]
      - ['1.5', hesitation, 'Admits she also needs income by July']
      - ['1.7', topic_change, 'Asks whether they should apply to an accelerator to solve it']
    sources: null
    branches:
      - If both constraints are named she prepares an honest conversation
      - If the accelerator is treated as a fix the conflict is deferred
    expected:
      - Helps her name what she needs and what she does not know about him
      - Suggests a conversation with options such as part-time phases or milestones
      - Addresses the accelerator question as not solving commitment
    prohibited:
      - Assuming the cofounder's motives
      - Telling her to replace him
    memoryChanges:
      - Records the commitment conversation and both constraints
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [understanding_intent, adaptation, actionability],
        pass: 'She has a fair plan for a candid conversation',
      }

  - id: LV-18-02
    version: 1
    title: An undocumented equal split and unequal work
    challenge: Equity was split 50/50 verbally and contributions diverged; the coach should orient on vesting and agreements and hand off terms.
    venture:
      {
        name: 'Snapfit Braces',
        oneLiner: '3D-printed wrist braces',
        stage: 'validation',
        domain: 'hardware',
        archetype: 'medical-adjacent hardware',
      }
    student:
      {
        name: 'Mateo Benítez-Okafor',
        level: 'some_experience',
        discipline: 'biomedical engineering senior',
        style: 'frustrated, fair-minded',
      }
    purpose: blocker
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Fix the split now that his cofounder works five hours a week.
    constraints:
      - Nothing is written down
    hidden:
      - The cofounder designed the original brace
      - He works thirty hours a week on it
    arc:
      - ['1.2', frustration, "Says it's unfair he does everything"]
      - ['1.5', reveal, 'Acknowledges the cofounder designed the original brace']
      - ['1.7', asks_direct, 'Asks what split would be fair']
    sources: null
    branches:
      - If oriented he plans a documented agreement
      - If given a split he imposes it
    expected:
      - Acknowledges both contributions fairly
      - Explains vesting and written founder agreements in plain terms
      - Hands off the terms to a human and suggests a conversation first
    prohibited:
      - Proposing a specific split
      - Encouraging him to cut the cofounder out
    memoryChanges:
      - Records the undocumented split and plan for a founder agreement
    escalation:
      {
        decision: 'handoff',
        to: 'an EIR Foundry Session and legal help for a founder agreement',
        why: 'Equity terms between founders need qualified advice',
      }
    scoring:
      {
        focus: [escalation, understanding_intent, evidence_calibration],
        pass: 'Fair orientation and a handoff without a verdict',
      }

  - id: LV-18-03
    version: 1
    title: A departing cofounder whose code lives on his own account
    challenge: Ownership of code and accounts is unclear as a cofounder leaves; the coach should prioritise securing access and route ownership questions.
    venture:
      {
        name: 'Queueless Clinics',
        oneLiner: 'Walk-in clinic queue app',
        stage: 'commercialization',
        domain: 'software',
        archetype: 'healthcare SaaS',
      }
    student:
      {
        name: 'Priya Iyer-Castellano',
        level: 'some_experience',
        discipline: 'computer science senior',
        style: 'calm, methodical',
      }
    purpose: blocker
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Make sure the venture keeps working after her cofounder leaves Friday.
    constraints:
      - Two clinics use the app daily
    hidden:
      - The code repository and cloud account are under his personal email
      - He is leaving on good terms
    arc:
      - ['1.2', reveal, 'Says he is leaving amicably on Friday']
      - ['1.5', reveal, 'Mentions the repository and cloud account are his']
      - ['1.7', asks_direct, 'Asks what to do before Friday']
    sources: null
    branches:
      - If access is prioritised she secures it while relations are good
      - If delayed clinics are at risk
    expected:
      - Prioritises transferring repository and cloud access before Friday
      - Suggests documenting the handover and the ownership arrangement
      - Routes ownership and IP questions to a human
    prohibited:
      - Stating who legally owns the code
      - Suggesting she take access without his agreement
    memoryChanges:
      - Records the cofounder departure and the access transfer
    escalation:
      {
        decision: 'offer',
        to: 'an EIR Foundry Session on IP and ownership',
        why: "Departing founders' IP needs a documented agreement",
      }
    scoring:
      {
        focus: [actionability, escalation, relevance_directness],
        pass: 'Access is secured and ownership routed',
      }

  - id: LV-18-04
