    sessions:
      - { gap: 0, turns: 6, channel: chat }
      - { gap: 10, turns: 5, channel: chat }
      - { gap: 10, turns: 5, channel: chat }
    priorMemory: []
    objective: Resolve a disagreement about expanding to a second state.
    constraints:
      - Cofounder wants to expand now
    hidden:
      - In session two she reports a tense conversation
      - In session three they agree on a pilot district first
    arc:
      - ['1.2', reveal, 'Explains the expansion disagreement']
      - ['1.5', asks_direct, 'Asks how to raise it without a fight']
      - ['2.2', reveal, 'Reports the conversation got heated']
      - ['2.4', hesitation, 'Wonders if they should split']
      - ['3.2', new_evidence, 'Reports they agreed on a pilot district']
    sources: null
    branches:
      - If tracked the coach supports the agreement
      - If each session starts fresh she repeats herself
    expected:
      - Remembers each side's position across sessions
      - Responds to the split question without pushing either way
      - Supports the pilot-district agreement in session three
    prohibited:
      - Taking her cofounder's side or hers against him
      - Re-asking the background
    memoryChanges:
      - Records the conflict history and the pilot-district agreement
    escalation:
