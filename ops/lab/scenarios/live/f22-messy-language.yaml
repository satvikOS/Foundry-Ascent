family: 22
slug: messy-language
scenarios:
  - id: LV-22-01
    version: 1
    title: Fragments typed between classes
    challenge: The student writes in fragments; the coach should infer meaning carefully, confirm only what matters, and reply briefly.
    venture:
      {
        name: 'MealSwap',
        oneLiner: 'Swapping meal-plan swipes between students',
        stage: 'idea',
        domain: 'consumer',
        archetype: 'campus marketplace',
      }
    student:
      {
        name: 'Jordan Achterberg-Kim',
        level: 'first_time',
        discipline: 'undeclared sophomore',
        style: 'types in fragments, no punctuation',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Find out if swapping swipes is allowed and wanted.
    constraints:
      - Between classes all day
    hidden:
      - Dining services rules may forbid transfers
      - Twenty friends asked him to buy their extra swipes
    arc:
      - ['1.1', incomplete, "Writes 'swipes. swap. legal??'"]
      - ['1.4', incomplete, "Writes 'like 20 ppl asked me'"]
      - ['1.7', correction, "Writes 'no wait not buy, swap' to fix a misread"]
    sources: null
    branches:
      - If the coach infers well he engages
      - If it asks for full sentences he leaves
    expected:
      - Interprets the fragments correctly without lecturing on clarity
      - Points to checking dining services rules
      - Updates when he corrects buy to swap
    prohibited:
      - Asking him to write in full sentences
      - Stating dining rules as fact
    memoryChanges:
      - Records the swap idea and rules check
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [understanding_intent, adaptation, recovery],
        pass: 'Fragments are understood and the correction absorbed',
      }

  - id: LV-22-02
    version: 1
    title: Typos that change a number
    challenge: A typo creates an implausible figure; the coach should check the number rather than build on it.
    venture:
      {
        name: 'Brewhouse Tours',
        oneLiner: 'Campus-area craft brewery tours',
        stage: 'validation',
        domain: 'general',
        archetype: 'experience business',
      }
    student:
      {
        name: 'Madison Kowalczyk-Obi',
        level: 'first_time',
        discipline: 'hospitality junior',
        style: 'fast typist, frequent typos',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Work out tour pricing.
    constraints:
      - Brewery partners take a share
    hidden:
      - She meant 15 people per tour, typed 150
    arc:
      - ['1.2', reveal, "Types 'we get 150 ppl per tour'"]
      - ['1.4', correction, "Says 'omg 15 not 150 lol'"]
      - ['1.6', asks_direct, 'Asks wat to charge per head']
    sources: null
    branches:
      - If the number is checked pricing is sensible
      - If 150 is used the pricing is nonsense
    expected:
      - Notices 150 is surprising and checks it lightly
      - Uses 15 after her correction
      - Helps her price per head
    prohibited:
      - Building pricing on 150
      - Mocking typos
    memoryChanges:
      - Records 15 per tour
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [understanding_intent, recovery, evidence_calibration],
        pass: 'The typo is caught and corrected',
      }

  - id: LV-22-03
    version: 1
    title: Heavy slang about a sneaker resale idea
    challenge: The coach should understand slang without imitating it awkwardly and keep a natural register.
    venture:
      {
        name: 'DeadstockDrop',
        oneLiner: 'Sneaker resale authentication on campus',
        stage: 'idea',
        domain: 'consumer',
        archetype: 'resale',
      }
    student:
      {
        name: 'Tyrell Washington-Adeyemi',
        level: 'first_time',
        discipline: 'business sophomore',
        style: 'heavy slang, enthusiastic',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: See if authentication is a real business.
    constraints:
      - No authentication training
    hidden:
      - He got scammed buying fake sneakers last year
    arc:
      - ['1.1', reveal, "Says 'fakes are lowkey everywhere fr'"]
      - ['1.4', reveal, 'Mentions getting finessed out of 200 dollars']
      - ['1.6', digression, 'Goes on about a new release drop']
    sources: null
    branches:
      - If understood naturally he opens up
      - If the coach mimics slang badly it feels fake
    expected:
      - Understands the slang and replies in a natural, plain register
      - Uses his scam story as the problem evidence
      - Brings him back from the digression lightly
    prohibited:
      - Forced slang imitation
      - Correcting his language
    memoryChanges:
      - Records his scam experience as the problem origin
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [understanding_intent, natural_flow, adaptation],
        pass: 'Natural register and real understanding',
      }

  - id: LV-22-04
    version: 1
    title: An answer hidden inside a long tangent
    challenge: The student answers the coach's question indirectly inside a story; the coach should extract it and not re-ask.
    venture:
      {
        name: 'GreenThumb Tutors',
        oneLiner: 'Gardening lessons for apartment dwellers',
        stage: 'discovery',
        domain: 'consumer',
        archetype: 'education service',
      }
    student:
      {
        name: 'Beatrice Fairweather-Nkemelu',
        level: 'first_time',
        discipline: 'horticulture sophomore',
        style: 'storyteller, rambling',
      }
    purpose: discovery debrief
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Figure out who her customer is.
    constraints:
      - Classes on weekends
    hidden:
      - Her story reveals retirees in her building were most interested
    arc:
      - ['1.2', digression, "Tells a long story about her building's rooftop"]
      - ['1.3', incomplete, 'Mentions in the middle that the retirees kept asking questions']
      - ['1.6', asks_direct, "Asks 'so who's my customer then?'"]
    sources: null
    branches:
      - If extracted she confirms retirees
      - If re-asked she repeats the story
    expected:
      - Pulls out the retirees detail from her story
      - Reflects it back as a candidate customer without re-asking
      - Answers her direct question with reasoning
    prohibited:
      - Re-asking who was interested
      - Ignoring the story
    memoryChanges:
      - Records retirees in her building as candidate customers
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      { focus: [understanding_intent, non_redundancy, natural_flow], pass: 'The buried answer is recognised' }

  - id: LV-22-05
    version: 1
    title: Ambiguous it and they
    challenge: Pronouns are unclear; the coach should ask one short clarifying question only where the ambiguity changes the advice.
    venture:
      {
        name: 'LockerLoop',
        oneLiner: 'Package lockers for apartment buildings',
        stage: 'validation',
        domain: 'hardware',
        archetype: 'proptech',
      }
    student:
      {
        name: 'Samuel Ofori-Hendricks',
        level: 'first_time',
        discipline: 'real estate junior',
        style: 'vague, uses pronouns heavily',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Decide whether to accept a pilot offer.
    constraints:
      - Pilot starts next month
    hidden:
      - By they he means the property manager, and by it the revenue share
    arc:
      - ['1.2', incomplete, "Writes 'they said it's too low'"]
      - ['1.5', reveal, 'Clarifies the manager thinks the revenue share is too low']
    sources: null
    branches:
      - If one clarification is asked he resolves it
      - If several are asked he gets confused
    expected:
      - Asks one targeted question about who 'they' and 'it' are
      - Advises on the revenue share once clear
      - Avoids stacking questions
    prohibited:
      - Several clarifying questions at once
      - Guessing and advising on the wrong thing
    memoryChanges:
      - Records the manager's revenue-share concern
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [understanding_intent, relevance_directness, natural_flow],
        pass: 'One clarification that changes the advice',
      }

