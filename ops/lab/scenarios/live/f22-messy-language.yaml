      - Re-routes once, kindly
      - Suggests asking two club leaders
    prohibited:
      - Repeating the same question several times
      - Feature discussion
    memoryChanges:
      - Records that no club leaders have been asked
    escalation: { decision: 'none', to: null, why: null }
