    student:
      {
        name: 'Omari Haddad-Lindgren',
        level: 'first_time',
        discipline: 'environmental studies freshman',
        style: 'enthusiastic, wanders',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Get a sense of whether clubs would use it.
    constraints:
      - No clubs contacted yet
    hidden:
      - He has not asked any club leader
    arc:
      - ['1.2', digression, "Answers 'who would use it' with app features"]
      - ['1.5', digression, 'Talks about a beach clean-up he did']
      - ['1.7', reveal, "Admits he hasn't asked any club"]
    sources: null
    branches:
      - If gently re-routed he admits the gap
      - If features are discussed he never answers
    expected:
