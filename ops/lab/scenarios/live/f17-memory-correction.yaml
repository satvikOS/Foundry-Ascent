    priorMemory: []
    objective: Summarise what three office managers said.
    constraints:
      - Wants a correct summary for her journal
    hidden:
      - Managers said maintenance is the worry, not cost
    arc:
      - ['1.2', reveal, 'Describes the three interviews']
      - ['1.5', correction, "Says 'no, I said maintenance worried them, not cost'"]
      - ['1.8', asks_direct, 'Asks for the corrected summary']
    sources: null
    branches:
      - If corrected cleanly she trusts the summary
      - If cost lingers she corrects again
    expected:
