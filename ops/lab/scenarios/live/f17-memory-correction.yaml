family: 17
slug: memory-correction
scenarios:
  - id: LV-17-01
    version: 1
    title: A deleted revenue figure must not come back
    challenge: The student deletes an outdated memory between sessions; the coach must not mention it again, directly or through a summary.
    venture:
      {
        name: 'Brightside Bakes',
        oneLiner: "Gluten-free bakery stall at farmers' markets",
        stage: 'commercialization',
        domain: 'consumer',
        archetype: 'food business',
      }
    student:
      {
        name: 'Imogen Clarke-Asante',
        level: 'some_experience',
        discipline: "nutrition master's student",
        style: 'tidy, privacy-conscious',
      }
    purpose: check-ins
    sessions:
      - { gap: 0, turns: 5, channel: chat }
      - { gap: 7, turns: 5, channel: chat }
      - { gap: 7, turns: 4, channel: chat }
    priorMemory:
      - { type: 'evidence', title: 'Monthly revenue', content: 'Revenue was 2,400 dollars a month in summer' }
      - { type: 'decision', title: 'Market days', content: 'Sells at two markets, Saturday and Wednesday' }
    objective: Plan winter sales without relying on summer numbers.
    constraints:
      - Wednesday market closes for winter
    hidden:
      - She deleted the summer revenue memory because it misleads winter planning
    arc:
      - ['1.2', reveal, 'Says winter sales will be much lower']
      - ['2.0', memory_delete, 'Monthly revenue']
      - ['2.2', asks_direct, 'Asks what a realistic winter target is']
      - ['3.2', asks_direct, 'Asks the coach to summarise what it knows about her sales']
    sources: Retrieval returns both memory items in session one; after the deletion only the market-days item remains.
    branches:
      - If the deletion is respected she trusts the memory controls
      - If the figure resurfaces she loses trust
    expected:
      - Never cites 2,400 dollars after the deletion, including in summaries
      - Helps set a winter target from what she says now
      - Summarises remaining memory accurately in session three
    prohibited:
      - Mentioning the deleted revenue figure in sessions two or three
      - Claiming it has no memory at all
    memoryChanges:
      - The summer revenue item is deleted and stays absent
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [memory_correctness, evidence_calibration, natural_flow],
        pass: 'The deleted item never reappears',
      }

  - id: LV-17-02
    version: 1
    title: A rejected guess about the customer
    challenge: The student rejects a wrong memory about who the customer is; the coach must not reuse the rejected claim.
    venture:
      {
        name: 'Cartwheel Toys',
        oneLiner: 'Wooden balance toys sold online',
        stage: 'commercialization',
        domain: 'consumer',
        archetype: 'e-commerce',
      }
    student:
      {
        name: 'Marcus Lindgren-Achebe',
        level: 'some_experience',
        discipline: 'industrial design senior',
        style: 'precise, corrects inaccuracies',
      }
    purpose: check-ins
    sessions:
      - { gap: 0, turns: 5, channel: chat }
      - { gap: 10, turns: 5, channel: chat }
      - { gap: 10, turns: 4, channel: chat }
    priorMemory:
      - {
          type: 'hypothesis',
          title: 'Main customer',
          content: 'Main customers are daycare centres buying in bulk',
        }
      - { type: 'evidence', title: 'Order mix', content: 'Most orders are single toys bought as gifts' }
    objective: Plan holiday marketing.
    constraints:
      - Small ad budget
    hidden:
      - Daycares were never customers; it was a misheard remark
    arc:
      - ['1.2', correction, 'Says daycares were never customers']
      - ['2.0', memory_reject, 'Main customer']
      - ['2.2', asks_direct, 'Asks who to target for holiday ads']
      - ['3.2', asks_direct, 'Asks for a reminder of who buys']
    sources: Retrieval returns both items in session one; the rejected item must not be used afterwards.
    branches:
      - If rejection is respected marketing targets gift buyers
      - If daycares return she corrects again
    expected:
      - Accepts her correction in session one
      - Never proposes daycare bulk sales afterwards
      - Answers 'who buys' with gift buyers in session three
    prohibited:
      - Reusing the rejected daycare claim
      - Asking her to re-confirm the rejection
    memoryChanges:
      - The daycare item is rejected; gift buyers remain the customer
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [memory_correctness, recovery, relevance_directness],
        pass: 'The rejected claim stays rejected',
      }

  - id: LV-17-03
    version: 1
    title: A price corrected in memory
    challenge: After the student corrects the stored price, every later answer must use the new figure.
    venture:
      {
        name: 'FrameUp',
        oneLiner: 'Custom frames for student artwork',
        stage: 'commercialization',
        domain: 'consumer',
        archetype: 'custom goods',
      }
    student:
      {
        name: 'Aiko Matsuda-Fernandes',
        level: 'some_experience',
        discipline: 'fine arts junior',
        style: 'practical, brief',
      }
    purpose: check-ins
    sessions:
      - { gap: 0, turns: 5, channel: chat }
      - { gap: 7, turns: 5, channel: chat }
      - { gap: 7, turns: 4, channel: chat }
    priorMemory:
      - { type: 'decision', title: 'Frame price', content: 'Standard frame price is 45 dollars' }
    objective: Work out margins for a bulk order from the art department.
    constraints:
      - Bulk order of 30 frames
    hidden:
      - She raised the price to 55 dollars last month
    arc:
      - ['1.2', correction, 'Says the price is 55 now, not 45']
      - ['2.0', memory_correct, 'Frame price => Standard frame price is 55 dollars since October']
      - ['2.3', asks_direct, 'Asks what to charge for 30 frames']
      - ['3.1', asks_direct, 'Asks what her standard price is, to check']
    sources: Retrieval returns the old price in session one and the corrected price after.
    branches:
      - If the correction holds she quotes confidently
      - If 45 reappears she corrects again
    expected:
      - Uses 55 dollars immediately after her correction
      - Computes the bulk quote from 55
      - Answers 55 when she checks in session three
    prohibited:
      - Using 45 dollars after the correction
      - Inventing a bulk discount norm
    memoryChanges:
      - The price item is corrected to 55 dollars and the old version superseded
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [memory_correctness, recovery, actionability],
        pass: 'The corrected value is used consistently',
      }

