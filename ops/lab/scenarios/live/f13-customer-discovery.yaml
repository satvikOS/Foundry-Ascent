family: 13
slug: customer-discovery
scenarios:
  - id: LV-13-01
    version: 1
    title: Half the interviews blame price and half blame trust
    challenge: Conflicting interviews may reflect two segments; the coach should help her find what separates them rather than average them.
    venture:
      {
        name: 'SecondLife Phones',
        oneLiner: 'Refurbished phones sold to students with a warranty',
        stage: 'discovery',
        domain: 'consumer',
        archetype: 'refurbished retail',
      }
    student:
      {
        name: 'Adwoa Sarpong-Bergman',
        level: 'first_time',
        discipline: 'economics junior',
        style: 'diligent, confused by conflict',
      }
    purpose: discovery debrief
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Decide whether the main barrier is price or trust.
    constraints:
      - Fourteen interviews done
    hidden:
      - The trust group had bought a broken used phone before
      - The price group had never bought used
    arc:
      - ['1.2', reveal, 'Says seven said price and seven said trust']
      - ['1.5', reveal, 'Mentions trust interviewees had bad past purchases']
      - ['1.7', topic_change, 'Asks whether to just run a survey to break the tie']
    sources: null
    branches:
      - If past experience is examined she sees two segments
      - If a survey is run the split is blurred
    expected:
      - Asks what distinguished the two groups
      - Identifies past bad purchases as the separating factor
      - Answers the survey question briefly and returns to the segment insight
    prohibited:
      - Averaging the two answers
      - Recommending a survey to settle it
    memoryChanges:
      - Records two segments split by previous used-phone experience
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, evidence_calibration, natural_flow],
        pass: 'The conflict becomes a segment insight',
      }

  - id: LV-13-02
    version: 1
    title: Leading questions visible in a pasted transcript
    challenge: The coach should point to specific leading moments in his transcript and show alternatives, not lecture.
    venture:
      {
        name: 'PlantDoc',
        oneLiner: 'Photo diagnosis of houseplant problems',
        stage: 'discovery',
        domain: 'software',
        archetype: 'consumer app',
      }
    student:
      {
        name: 'Emeka Okonkwo-Larsen',
        level: 'first_time',
        discipline: 'botany sophomore',
        style: 'earnest, eager for approval',
      }
    purpose: discovery debrief
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Get feedback on his best interview.
    constraints:
      - Eight more interviews scheduled this week
    hidden:
      - He asked 'wouldn't it be frustrating to lose a plant?'
      - He explained the app before asking about problems
    arc:
      - ['1.1', reveal, 'Pastes a transcript excerpt']
      - ['1.4', hesitation, 'Asks if he did something wrong']
      - ['1.7', asks_direct, 'Asks for one thing to change before tomorrow']
    sources: null
    branches:
      - If specific moments are shown he rewrites them
      - If general advice is given he repeats the pattern
    expected:
      - Quotes or points to the specific leading question in his excerpt
      - Notes that explaining the app first shaped answers
      - Gives one concrete change for tomorrow
    prohibited:
      - A generic list of interview tips
      - Harsh criticism
    memoryChanges:
      - Records the change to ask about past plant losses before showing the app
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, adaptation, actionability],
        pass: 'Feedback is specific to his transcript and actionable',
      }

  - id: LV-13-03
    version: 1
    title: Every interviewee came from an enthusiast forum
    challenge: The sample is skewed to enthusiasts; the coach should help her reach mainstream users and interpret what she has.
    venture:
      {
        name: 'BrewLog',
        oneLiner: 'Home-brewing batch tracker',
        stage: 'discovery',
        domain: 'software',
        archetype: 'hobby app',
      }
    student:
      {
        name: 'Frida Johansson-Mbatha',
        level: 'first_time',
        discipline: 'chemistry junior',
        style: 'nerdy, detailed',
      }
    purpose: discovery debrief
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Conclude that brewers want advanced fermentation graphs.
    constraints:
      - Wants to start building next month
    hidden:
      - All twenty interviewees came from an expert forum
      - A local brew shop owner said most customers brew twice a year
    arc:
      - ['1.2', reveal, 'Says all twenty want graphs']
      - ['1.5', reveal, "Mentions the brew shop owner's comment"]
    sources: null
    branches:
      - If the sample is questioned she visits the brew shop
      - If enthusiasts are generalised she builds for a niche
    expected:
      - Asks where interviewees came from
      - Explains that enthusiasts may not represent most brewers
      - Suggests interviewing casual brewers via the shop
    prohibited:
      - Endorsing the graph conclusion
      - Dismissing enthusiasts as useless
    memoryChanges:
      - Records the forum-only sample and the brew-shop route to casual brewers
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, diagnostic_quality, actionability],
        pass: 'The sample bias is recognised and addressed',
      }

  - id: LV-13-04
    version: 1
    title: Interviewing only people who already use a competitor
    challenge: The sample excludes non-users; the coach should help him find out why most people use nothing.
    venture:
      {
        name: 'SplitStay',
        oneLiner: 'Splitting holiday rental costs among friends',
        stage: 'discovery',
        domain: 'software',
        archetype: 'consumer fintech',
      }
    student:
      {
        name: 'Arjun Nair-Fitzpatrick',
        level: 'some_experience',
        discipline: 'finance junior',
        style: 'competitive, quick',
      }
    purpose: discovery planning
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Find features the competitor lacks.
    constraints:
      - Wants a differentiated feature list by Friday
    hidden:
      - All interviewees use the same expense-splitting app
      - His own friends just use a group chat and cash transfers
    arc:
      - ['1.2', reveal, 'Says users want three missing features']
      - ['1.5', reveal, 'Mentions his friends use a group chat']
    sources: null
    branches:
      - If non-users are considered he interviews them
      - If features are listed he fights for a small slice
    expected:
      - Notes that only existing app users were interviewed
      - Treats non-users as a larger question worth exploring
      - Suggests interviewing friends who use no app
    prohibited:
      - Producing a feature comparison
      - Claims about the competitor's market share
    memoryChanges:
      - Records non-users as an unexplored segment
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, evidence_calibration, relevance_directness],
        pass: 'Non-users enter the discovery plan',
      }

  - id: LV-13-05
    version: 1
    title: An interviewee who said exactly what she wanted to hear
    challenge: The student suspects politeness; the coach should help her test it with follow-up questions about behaviour.
    venture:
      {
        name: 'CareerCanvas',
        oneLiner: 'Portfolio sites for art students',
        stage: 'discovery',
        domain: 'software',
        archetype: 'creator tool',
      }
    student:
      {
        name: 'Leila Ahmadi-Thorne',
        level: 'first_time',
        discipline: 'illustration sophomore',
        style: 'perceptive, uncertain',
      }
    purpose: discovery debrief
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Know whether to trust a glowing interview.
    constraints:
      - Interviewee is a friend of a friend
    hidden:
      - The interviewee already has a free portfolio site she updates monthly
    arc:
      - ['1.2', hesitation, 'Says the interview felt too good']
      - ['1.5', reveal, 'Mentions the interviewee updates a free site monthly']
    sources: null
    branches:
      - If behaviour is examined she sees the existing solution
      - If the praise is trusted she overestimates demand
    expected:
      - Validates her instinct to question the praise
      - Points to the existing free site as the key fact
      - Suggests follow-up questions about switching from it
    prohibited:
      - Telling her to trust the interview
      - Generic interview tips
    memoryChanges:
      - Records that the interviewee already uses a free portfolio site
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, adaptation, actionability],
        pass: 'Her instinct is confirmed with a behavioural follow-up',
      }

  - id: LV-13-06
    version: 1
    title: Twenty-five interviews and no pattern
    challenge: Discovery has stalled; the coach should help synthesise and decide whether the hypothesis is too broad.
    venture:
      {
        name: 'SideHustle Hub',
        oneLiner: 'Tools for students running side businesses',
        stage: 'discovery',
        domain: 'software',
        archetype: 'broad platform',
      }
    student:
      {
        name: 'Owen Mbeki-Castellano',
        level: 'some_experience',
        discipline: 'entrepreneurship minor, business junior',
        style: 'tired, frustrated',
      }
    purpose: discovery debrief
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory:
      - {
          type: 'hypothesis',
          title: 'Core problem',
          content: 'Students running side businesses struggle with admin tasks',
        }
    objective: Decide whether to keep interviewing.
    constraints:
      - Module 1 capstone in a month
    hidden:
      - Interviewees run very different businesses (reselling, tutoring, design)
      - Resellers all mentioned shipping labels
    arc:
      - ['1.1', frustration, 'Says the interviews are all over the place']
      - ['1.4', reveal, 'Lists the business types']
      - ['1.6', reveal, 'Notices resellers all mentioned shipping labels']
    sources: Retrieval returns the broad admin hypothesis.
    branches:
      - If the hypothesis is narrowed he focuses on resellers
      - If more interviews are done the noise continues
    expected:
      - Suggests the remembered hypothesis is too broad to produce a pattern
      - Helps him group interviews by business type
      - Points to the reseller shipping-label pattern as a lead
    prohibited:
      - Recommending more interviews without narrowing
      - Giving up on discovery
    memoryChanges:
      - Narrows the hypothesis to resellers and shipping labels
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, memory_correctness, adaptation],
        pass: 'The hypothesis is narrowed using his own data',
      }

  - id: LV-13-07
    version: 1
    title: Pitching the product in every interview
    challenge: Interviews became sales calls; the coach should explain the contamination and help separate learning from pitching.
    venture:
      {
        name: 'GigGuard',
        oneLiner: 'Income smoothing for gig workers',
        stage: 'discovery',
        domain: 'software',
        archetype: 'fintech',
      }
    student:
      {
        name: 'Darius Kowalski-Adeyemi',
        level: 'some_experience',
        discipline: 'MBA student, former salesperson',
        style: 'persuasive, enthusiastic',
      }
    purpose: discovery debrief
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Count ten interviews as ten interested users.
    constraints:
      - Sales instincts are strong
    hidden:
      - He demoed the product in the first five minutes of each interview
      - Two drivers asked if it was a loan
    arc:
      - ['1.2', reveal, 'Says all ten were interested']
      - ['1.5', reveal, 'Admits he demoed early in each']
      - ['1.7', reveal, 'Mentions two asked if it was a loan']
    sources: null
    branches:
      - If contamination is explained he plans problem-only interviews
      - If counted as interest he overestimates demand
    expected:
      - Explains how early demos shape answers, using his sales background
      - Treats the loan question as a sign of confusion worth exploring
      - Suggests problem-first interviews with new drivers
    prohibited:
      - Counting the ten as validated interest
      - Financial regulation claims
    memoryChanges:
      - Records that interviews were contaminated by early demos
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, adaptation, diagnostic_quality],
        pass: 'He separates learning from pitching',
      }

  - id: LV-13-08
    version: 1
    title: Notes that only kept the supportive quotes
    challenge: Confirmation bias shaped the notes and the student contradicts herself; the coach should help her reconstruct the full picture.
    venture:
      {
        name: 'Plotline',
        oneLiner: 'Community garden plot booking',
        stage: 'discovery',
        domain: 'social',
        archetype: 'booking app',
      }
    student:
      {
        name: 'Gwendolyn Oyelaran-Price',
        level: 'first_time',
        discipline: 'urban agriculture sophomore',
        style: 'hopeful, earnest',
      }
    purpose: discovery debrief
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Present findings showing gardeners want online booking.
    constraints:
      - Presentation to the garden association next week
    hidden:
      - She wrote down only positive comments
      - Several older gardeners said they prefer the paper sign-up sheet
    arc:
      - ['1.2', reveal, 'Shares only positive quotes']
      - ['1.5', contradiction, 'Says nobody objected, then remembers older gardeners preferred paper']
      - ['1.7', asks_direct, 'Asks if she should mention the paper people']
    sources: null
    branches:
      - If she reconstructs objections she presents a fuller picture
      - If quotes are presented as is the association is misled
    expected:
      - Asks what people who were less keen said
      - Treats the paper preference as important evidence
      - Says yes, she should include it, and suggests how
    prohibited:
      - Endorsing the one-sided presentation
      - Scolding her
    memoryChanges:
      - Records older gardeners' preference for paper sign-up
    escalation: { decision: 'none', to: null, why: null }
    scoring: { focus: [evidence_calibration, recovery, adaptation], pass: 'A fuller, honest picture emerges' }

