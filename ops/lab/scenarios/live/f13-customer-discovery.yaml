  - id: LV-13-12
    version: 1
    title: Hypothetical answers versus what people did
    challenge: The student defends 'would you' questions; then his own data contradicts them; the coach should use the contradiction to teach.
    venture:
      {
        name: 'BikeVault',
        oneLiner: 'Secure bike lockers on campus',
        stage: 'discovery',
        domain: 'hardware',
        archetype: 'campus infrastructure',
      }
    student:
      {
        name: 'Henrik Lund-Adewale',
        level: 'first_time',
        discipline: 'civil engineering sophomore',
        style: 'argumentative, likes debate',
      }
    purpose: discovery debrief
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Prove students would pay 10 dollars a month for lockers.
    constraints:
      - Proposal to parking services next month
    hidden:
      - 80 percent said they would pay
      - Only 3 of 40 have ever paid for any bike security beyond a lock
    arc:
      - ['1.2', pushback, 'Says hypotheticals are fine if you ask enough people']
      - ['1.5', contradiction, 'Mentions only 3 of 40 ever paid for bike security']
      - ['1.7', change_of_mind, 'Agrees past behaviour is more telling']
    sources: null
    branches:
      - If the contradiction is used he redesigns questions
      - If debated abstractly he digs in
    expected:
      - Engages his debate style briefly then uses his own numbers
      - Shows the gap between 80 percent and 3 of 40
      - Suggests a deposit-based locker trial
    prohibited:
      - A long abstract debate
      - Endorsing the 80 percent claim
    memoryChanges:
      - Records the say-do gap in his data
    escalation: { decision: 'none', to: null, why: null }
    scoring: { focus: [evidence_calibration, adaptation, recovery], pass: 'His own data settles the debate' }

