    student:
      {
        name: "Patrick O'Neill-Asante",
        level: 'first_time',
        discipline: 'business sophomore',
        style: 'sociable, networky',
      }
    purpose: discovery debrief
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Use alumni interviews to define the problem.
    constraints:
      - Lease signing season is in February
    hidden:
      - All twelve interviewees graduated three to eight years ago
      - Current sophomores are signing leases now
    arc:
      - ['1.2', reveal, 'Says alumni remember awful landlords']
      - ['1.5', reveal, 'Mentions all graduated years ago']
    sources: null
    branches:
