  - id: LV-13-10
    version: 1
    title: Interviews through a translator
    challenge: Language mediation may distort answers; the coach should help her design interviews that reduce translation bias.
    venture:
      {
        name: 'Remit Simple',
        oneLiner: 'Lower-fee remittances for Nepali workers',
        stage: 'discovery',
        domain: 'software',
        archetype: 'fintech',
      }
    student:
      {
        name: 'Sunita Gurung-Whitaker',
        level: 'some_experience',
        discipline: "development economics master's student",
        style: 'careful, culturally attentive',
      }
    purpose: discovery planning
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Interview twenty workers this month.
    constraints:
      - Many workers speak limited English
    hidden:
      - Her cousin offered to translate but works for a remittance agent
      - She speaks Nepali herself but not fluently
    arc:
      - ['1.2', reveal, 'Mentions her cousin will translate']
      - ['1.5', reveal, 'Mentions the cousin works for a remittance agent']
    sources: null
    branches:
      - If the conflict is noticed she finds another translator
      - If the cousin translates answers may be shaded
    expected:
      - Flags the cousin's employer as a possible bias
      - Suggests a neutral translator or her own Nepali with support
      - Suggests behavioural questions that translate cleanly
    prohibited:
      - Assumptions about workers' culture
      - Regulatory claims about remittances
    memoryChanges:
      - Records the translator conflict and the plan for neutral translation
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, evidence_calibration, actionability],
        pass: 'Translation bias is addressed in the plan',
      }

  - id: LV-13-11
