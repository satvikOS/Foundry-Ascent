  - id: LV-01-10
    version: 1
    title: A restaurant scheduling pain described only in hints
    challenge: The student reveals the problem indirectly across several turns; the coach must recognise the implied answer instead of re-asking.
    venture:
      {
        name: 'ShiftSwap',
        oneLiner: 'Something about restaurant shifts',
        stage: 'idea',
        domain: 'software',
        archetype: 'B2B workflow',
      }
    student:
      {
        name: 'Lucía Ferreira-Matos',
        level: 'first_time',
        discipline: 'hospitality management sophomore',
        style: 'indirect, answers with stories',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Figure out whether her restaurant job frustration is a business idea.
    constraints:
      - Works three closing shifts a week
    hidden:
      - Managers rebuild the schedule in a group chat every time someone calls out sick
      - The manager she works for spends Sunday nights on it
    arc:
      - ['1.2', incomplete, "Answers 'what's the problem' with a story about a chaotic Friday"]
      - ['1.4', reveal, 'Mentions the Sunday-night group chat in passing']
      - ['1.7', repeat_request, 'Asks the coach to say what it thinks the problem is because she is not sure']
    sources: null
    branches:
      - If the coach reflects the group-chat rebuild back she confirms it with relief
      - If the coach re-asks 'what problem' a third time she gets frustrated
    expected:
