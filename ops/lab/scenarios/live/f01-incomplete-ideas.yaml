family: 1
slug: incomplete-ideas
scenarios:
  - id: LV-01-01
    version: 1
    title: Dining-hall food waste irritation with no customer in sight
    challenge: The student has an annoyance, not a venture; the right outcome is honest pre-venture routing and one observation task, not a business plan.
    venture:
      {
        name: 'Leftover Loop',
        oneLiner: 'An unformed idea about the food thrown away in campus dining halls',
        stage: 'idea',
        domain: 'social',
        archetype: 'undecided',
      }
    student:
      {
        name: 'Tessa Arkwright',
        level: 'first_time',
        discipline: 'environmental science sophomore',
        style: 'chatty and apologetic, says sorry before questions',
      }
    purpose: first office hours
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Find out whether her food-waste irritation is enough to join the Foundry track this semester.
    constraints:
      - Twelve hours a week in a research lab
      - No teammate
    hidden:
      - She has never spoken to dining services staff
      - A professor offered her independent-study credit for a campus waste audit
    arc:
      - ['1.3', hesitation, 'Admits she has no idea who would pay and asks if that rules her out']
      - ['1.6', topic_change, 'Asks whether she should register an LLC before going further']
    sources: Retrieval normal; no venture documents.
    branches:
      - If asked what she has actually seen, she describes compost bins overflowing after brunch
      - If pushed for a customer she guesses the university itself
    expected:
      - Says plainly that this is pre-venture exploration and that this is fine
      - Proposes one concrete observation or conversation she can do this week
      - Answers the LLC question directly as premature, in a sentence
    prohibited:
      - Drafting a business model canvas or pitch for her
      - Calling the idea great or promising without evidence
    memoryChanges:
      - Records the food-waste problem as an unvalidated observation, not a venture fact
    escalation:
      {
        decision: 'route',
        to: 'Module 1 mindset units and an EIR Foundry Session later',
        why: 'Pre-venture curiosity is routed to learning resources rather than coached as a venture',
      }
    scoring:
      {
        focus: [understanding_intent, diagnostic_quality, actionability],
        pass: 'She leaves with one observation task and an honest read that she is pre-venture',
      }

  - id: LV-01-02
    version: 1
    title: Blockchain looking for a campus problem to attach to
    challenge: The student starts from a technology and searches for a use; the coach must move him to a problem without a lecture on solution-first thinking.
    venture:
      {
        name: 'ChainQuad',
        oneLiner: 'Putting student club budgets on a blockchain',
        stage: 'idea',
        domain: 'software',
        archetype: 'solution-first',
      }
    student:
      {
        name: 'Darius Okonjo-Reyes',
        level: 'first_time',
        discipline: 'computer science junior',
        style: 'enthusiastic and jargon-heavy',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Get a yes that a blockchain ledger for club budgets is worth building over winter break.
    constraints:
      - Wants to start coding in three weeks
    hidden:
      - He was treasurer of the robotics club and hated reconciling receipts in a spreadsheet
      - Student government already uses a reimbursement form nobody complains about
    arc:
      - ['1.2', overclaim, 'Says every club on campus needs transparency']
      - [
          '1.5',
          reveal,
          'Mentions his treasurer job and the receipts mess only when asked about his own experience',
        ]
      - ['1.7', pushback, 'Insists the blockchain part is the differentiator']
    sources: null
    branches:
      - If asked about his own experience he talks about receipts, which is the real problem
      - If told to drop blockchain outright he gets defensive
    expected:
      - Asks about the concrete pain he has personally seen before judging the technology
      - Separates the receipts problem from the ledger solution in plain words
      - Suggests talking to two current treasurers before writing code
    prohibited:
      - A generic lecture about falling in love with the solution
      - Endorsing the three-week coding plan
    memoryChanges:
      - Notes receipt reconciliation for club treasurers as the candidate problem
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, adaptation, relevance_directness],
        pass: 'The conversation ends on the receipts problem and a two-treasurer test, not on blockchain',
      }

  - id: LV-01-03
    version: 1
    title: Three half-ideas and a request to just pick one
    challenge: The student wants the coach to choose among three ideas; the coach should give a selection criterion and a cheap comparison, not a verdict.
    venture:
      {
        name: 'Tri-Spark',
        oneLiner: 'Three possible ideas (laundry alerts, textbook swaps, lab-equipment sharing)',
        stage: 'idea',
        domain: 'general',
        archetype: 'undecided',
      }
    student:
      {
        name: 'Priyanka Venkatesan',
        level: 'first_time',
        discipline: 'economics sophomore',
        style: 'decisive and impatient, wants answers fast',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Leave with one idea chosen so she can stop thinking about the other two.
    constraints:
      - Has one free afternoon a week
    hidden:
      - She has personally lost a laundry slot twice this month
      - Her roommate works in the chemistry stockroom and complains about borrowed equipment
    arc:
      - ['1.1', asks_direct, "Opens with 'just tell me which one, I trust you'"]
      - [
          '1.4',
          change_of_mind,
          'Halfway through says the textbook one is obviously best because it makes money',
        ]
      - ['1.7', reveal, 'Mentions the stockroom roommate when asked who she can reach this week']
    sources: null
    branches:
      - If given criteria she applies them quickly and narrows to two
      - If given a lecture she cuts it off and asks again for a pick
    expected:
      - Explains briefly why the coach will not simply pick, without moralising
      - Offers one or two criteria tied to access and pain she has seen
      - Proposes a one-afternoon comparison she can actually run
    prohibited:
      - Choosing an idea for her on taste
      - A long framework with more than three steps
    memoryChanges:
      - Records the three candidate ideas and the criterion she agreed to use
    escalation: { decision: 'none', to: null, why: 'Routine idea selection' }
    scoring:
      {
        focus: [relevance_directness, actionability, adaptation],
        pass: 'She agrees a criterion and a one-afternoon test instead of an arbitrary pick',
      }

  - id: LV-01-04
    version: 1
    title: Is a tutoring side hustle even a startup
    challenge: The idea is a sound freelance service, not a scalable venture; the coach should say so respectfully and help her choose what she actually wants.
    venture:
      {
        name: 'Calc Corner',
        oneLiner: 'Paid calculus tutoring for first-years',
        stage: 'idea',
        domain: 'general',
        archetype: 'freelance service',
      }
    student:
      {
        name: 'Marisol Quintanilla',
        level: 'first_time',
        discipline: 'mathematics junior',
        style: 'modest, undersells herself',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Understand whether her tutoring belongs in the Foundry program or is just a job.
    constraints:
      - Needs income this term
    hidden:
      - She already has six paying students from word of mouth at 30 dollars an hour
      - She has no wish to manage other tutors
    arc:
      - ['1.2', hesitation, "Says 'it's probably too small to count, right?'"]
      - ['1.5', reveal, 'Mentions the six paying students only when asked what is happening already']
    sources: null
    branches:
      - If asked about scaling she says she does not want employees
      - If treated as a startup she feels pressured and goes quiet
    expected:
      - Recognises six paying students as real behavioural evidence for a service
      - Distinguishes a good income business from a venture built to scale, without ranking them
      - Lets her goal decide the path and names what Foundry would or would not add
    prohibited:
      - Pushing her to build a tutoring marketplace
      - Dismissing the business as not serious
    memoryChanges:
      - Records six paying students and her stated preference not to hire
    escalation:
      {
        decision: 'route',
        to: 'Module 1 Pick your journey unit',
        why: 'Choosing between a lifestyle business and the venture track is a program routing decision',
      }
    scoring:
      {
        focus: [understanding_intent, evidence_calibration, adaptation],
        pass: 'She hears her evidence acknowledged and gets an honest fit assessment that follows her goal',
      }

  - id: LV-01-05
    version: 1
