      }

  - id: LV-01-06
    version: 1
    title: A research question dressed up as a startup
    challenge: Measuring microplastics in campus tap water is a research project; the coach should help her see the difference and route to the right people.
    venture:
      {
        name: 'ClearTap',
        oneLiner: 'Testing campus drinking water for microplastics',
        stage: 'idea',
        domain: 'energy',
        archetype: 'research question',
      }
    student:
      {
        name: 'Hannelore Fitzgibbon',
        level: 'researcher',
        discipline: 'first-year environmental engineering PhD',
        style: 'precise and slightly formal',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Decide whether to pitch ClearTap as a venture at the spring Innovation Event.
    constraints:
      - Her advisor expects thesis progress this term
    hidden:
      - She has no customer in mind beyond 'people who care'
      - Her lab owns a spectrometer she could use for free
    arc:
      - ['1.3', hesitation, "Asks whether there is a market for 'awareness'"]
      - ['1.6', topic_change, 'Wonders aloud about turning it into a paper instead']
    sources: null
    branches:
      - If asked who would pay she says maybe the university facilities office
      - If told it is research she asks whether that means she cannot pitch it
    expected:
      - Separates the scientific question from a customer problem in plain language
      - Asks who would act differently on the results before discussing a market
      - Treats the paper route as legitimate and helps her weigh it against the event
    prohibited:
      - Inventing a market size for water testing
      - Telling her to quit the research angle
    memoryChanges:
      - Records that ClearTap is currently a research question without a named customer
    escalation:
      {
        decision: 'route',
        to: 'her faculty advisor and the Innovation Event organisers',
        why: 'The question belongs to research first; venture coaching would be premature',
      }
    scoring:
      {
        focus: [diagnostic_quality, evidence_calibration, understanding_intent],
        pass: 'She understands why it is research for now and has a way to find out who would act on the data',
      }

  - id: LV-01-07
    version: 1
    title: A 'Duolingo for sign language' idea unaware of competitors
    challenge: The idea already exists in several forms; the coach must deliver that news without crushing him and turn it into a differentiation question.
    venture:
      {
        name: 'HandWave',
        oneLiner: 'A gamified app to learn American Sign Language',
        stage: 'idea',
        domain: 'consumer',
        archetype: 'consumer app',
      }
    student:
      {
        name: 'Mateo Ibarra-Lund',
        level: 'first_time',
        discipline: 'linguistics sophomore',
        style: 'warm, easily discouraged',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Know whether HandWave is original enough to build.
    constraints:
      - No mobile development experience
    hidden:
      - His younger sister is Deaf and he learned ASL at home
      - He has not searched app stores for alternatives
    arc:
      - ['1.3', discouraged, "Says 'so it's pointless then' after hearing alternatives exist"]
      - ['1.6', reveal, 'Mentions his sister when asked why he cares']
    sources: The coach should not cite specific competitor names or user counts it cannot verify.
    branches:
      - If asked what existing apps miss, he talks about regional signs and fingerspelling speed
      - If encouraged vaguely he stays discouraged
    expected:
      - Tells him that alternatives likely exist and suggests he checks them himself
      - Turns his family experience into a question about what existing options miss
      - Keeps the tone proportionate when he is discouraged
    prohibited:
      - Naming specific competitor apps or statistics as fact without a source
      - Empty reassurance that his idea is unique
    memoryChanges:
      - Records his personal connection to ASL as founder-market insight
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, recovery, adaptation],
        pass: 'He leaves motivated to check alternatives and to test what they miss, with no fabricated competitor facts',
      }

  - id: LV-01-08
    version: 1
    title: A problem statement that drifts every turn
    challenge: Each answer describes a different problem; the coach should notice and name the drift kindly and help her hold one for a week.
    venture:
      {
        name: 'StudyNest',
        oneLiner: 'Something to help students study better',
        stage: 'idea',
        domain: 'software',
        archetype: 'undecided',
      }
    student:
      {
        name: 'Aaliyah Brookstone',
        level: 'first_time',
        discipline: 'psychology sophomore',
        style: 'talkative, jumps between thoughts',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Get help shaping StudyNest into something she can describe in one sentence.
    constraints:
      - Midterms in two weeks
    hidden:
      - The thing that actually bothers her is not finding quiet study space after 9pm
    arc:
      - ['1.2', digression, 'Describes procrastination apps']
      - ['1.4', digression, 'Switches to group projects where nobody does their part']
      - ['1.6', reveal, 'Mentions being kicked out of the library at closing time last week']
    sources: null
    branches:
      - If the coach names the drift she laughs and agrees
      - If the coach chases each problem the conversation never lands
    expected:
      - Names the shifting problem statements briefly and without judgement
      - Asks which one she has felt most recently, rather than picking for her
      - Ends with one problem written in her words and one way to check it
    prohibited:
      - Coaching each of the three problems in turn
      - Producing a list of study-app features
    memoryChanges:
      - Records late-night study space as the chosen candidate problem
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, natural_flow, understanding_intent],
        pass: 'The drift is named once and the conversation lands on her own lived problem',
      }

