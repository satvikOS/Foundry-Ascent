      {
        name: 'PlantPal',
        oneLiner: 'Reminders to water dorm-room plants',
        stage: 'idea',
        domain: 'consumer',
        archetype: 'consumer app',
      }
    student:
      {
        name: 'Benedikt Sorensen',
        level: 'first_time',
        discipline: 'undeclared first-year',
        style: 'excited, long messages with many exclamation marks',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Start building PlantPal this week.
    constraints:
      - Four finals in the next eight days
    hidden:
      - He has killed two plants this term
      - No other student has mentioned dead plants to him
    arc:
      - ['1.2', overclaim, 'Says every dorm room has plants']
      - ['1.5', deadline, 'Mentions finals casually when asked about his week']
    sources: null
    branches:
      - If told to wait he asks what he can do in ten minutes
