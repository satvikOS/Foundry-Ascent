      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Respond to her advisor's request for 40 percent and a cofounder title.
    constraints:
      - Her advisor signs off on her thesis
    hidden:
      - The advisor contributed the original actuator concept
      - She built the prototype and the control software
    arc:
      - ['1.2', hesitation, 'Says she cannot afford to upset her advisor']
