        name: 'Takeshi Morimoto-Barnes',
        level: 'researcher',
        discipline: 'computer vision PhD candidate',
        style: 'quiet, data-driven',
      }
    purpose: milestone review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Plan outreach to hospitals using his benchmark win.
    constraints:
      - No clinical collaborator yet
    hidden:
      - One radiologist told him she would not open another application
      - His model runs only on research-format images
    arc:
