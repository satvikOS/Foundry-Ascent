        name: 'Dr. Kwabena Asamoah-Lindqvist',
        level: 'researcher',
        discipline: 'bioengineering assistant professor',
        style: 'proud, reads reviewer quotes',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Use the grant reviews as evidence of market need in his pitch.
    constraints:
      - Teaching two courses this term
    hidden:
      - No water utility or parent has been asked about it
      - A reviewer wrote 'transformative for public health'
    arc:
