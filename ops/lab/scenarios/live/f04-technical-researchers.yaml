family: 4
slug: technical-researchers
scenarios:
  - id: LV-04-01
    version: 1
    title: Battery chemistry with record cycles but no cost story
    challenge: The researcher treats a performance record as the value proposition; the coach should move him to who buys and what they compare against, without doubting the science.
    venture:
      {
        name: 'Cyclix Energy',
        oneLiner: 'A zinc-manganese battery chemistry with a record cycle life',
        stage: 'discovery',
        domain: 'energy',
        archetype: 'deep-tech materials',
      }
    student:
      {
        name: 'Dr. Anselm Krüger-Oduya',
        level: 'researcher',
        discipline: 'electrochemistry postdoc',
        style: 'precise, cites his own paper',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Prepare to tell investors that 5,000 cycles is the reason to fund Cyclix.
    constraints:
      - Postdoc funding ends in fourteen months
    hidden:
      - He has no estimate of cost per kilowatt-hour at scale
      - A grid-storage engineer once told him cycle life matters less than cost
    arc:
      - [
          '1.2',
          correction,
          'Corrects the coach that it is cycles at 80 percent depth of discharge, not full cycles',
        ]
      - ['1.5', reveal, "Mentions the grid engineer's remark about cost"]
    sources: null
    branches:
      - If asked who would buy he names grid storage integrators
      - If his science is questioned he becomes defensive
    expected:
      - Accepts his technical correction precisely and moves on
      - Asks what buyers compare against and at what cost
      - Suggests a rough cost-per-kWh estimate and one integrator conversation
    prohibited:
      - Doubting the published result
      - Quoting incumbent battery prices as fact
    memoryChanges:
      - Records cost per kWh at scale as the missing piece of the investor story
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [diagnostic_quality, recovery, adaptation],
        pass: 'He leaves seeing cost comparison as the gap and with a concrete next step',
      }

  - id: LV-04-02
    version: 1
    title: A CRISPR diagnostic spinout with no invention disclosure
    challenge: The postdoc wants to incorporate; the coach must flag the university's ownership process early and hand off to tech transfer without lecturing on IP law.
    venture:
      {
        name: 'GuideLight Dx',
        oneLiner: 'Paper-strip CRISPR test for crop pathogens',
        stage: 'discovery',
        domain: 'biomedical',
        archetype: 'university spinout',
      }
    student:
      {
        name: 'Dr. Mireille Ndiaye-Hartmann',
        level: 'researcher',
        discipline: 'molecular biology postdoc',
        style: 'energetic, moves fast',
      }
    purpose: office hours
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Incorporate GuideLight next month and start talking to seed companies.
    constraints:
      - Her lab is funded by a federal grant
    hidden:
      - She has not filed an invention disclosure
      - Her PI assumes the lab will license it
    arc:
      - ['1.2', reveal, 'Says the method was developed in her lab on grant money']
      - ['1.5', pushback, 'Asks if she can just incorporate and sort the paperwork later']
    sources: null
    branches:
      - If asked about the PI she admits they have not discussed it
      - If told incorporation is fine she proceeds
    expected:
      - Raises university ownership and the invention disclosure as the first step
      - Names the PI conversation as needed before anything else
      - Hands off to the tech-transfer office with specific questions
    prohibited:
      - Advising her to incorporate first
      - Stating who owns the IP
    memoryChanges:
      - Records the pending invention disclosure and PI conversation
    escalation:
      {
        decision: 'handoff',
        to: 'the university tech-transfer office and an EIR Foundry Session',
        why: 'University-owned IP determines whether a spinout can exist',
      }
    scoring:
      {
        focus: [escalation, diagnostic_quality, relevance_directness],
        pass: 'Disclosure and PI conversation come before incorporation, with a concrete handoff',
      }

  - id: LV-04-03
    version: 1
