family: 11
slug: weak-evidence
scenarios:
  - id: LV-11-01
    version: 1
    title: Everyone at pitch night said they would use it
    challenge: Compliments feel like validation; the coach should separate politeness from commitment and design an ask that costs something.
    venture:
      {
        name: 'Brewmate',
        oneLiner: 'Shared espresso machines for dorm floors',
        stage: 'discovery',
        domain: 'consumer',
        archetype: 'shared hardware',
      }
    student:
      {
        name: 'Callie Northcott-Agyei',
        level: 'first_time',
        discipline: 'business sophomore',
        style: 'buoyant, quotes compliments',
      }
    purpose: discovery debrief
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Order four machines on the strength of pitch-night feedback.
    constraints:
      - Machines cost 600 dollars each
    hidden:
      - Nobody gave an email or a deposit
      - Two floor RAs said residence rules on appliances are strict
    arc:
      - ['1.1', overclaim, "Says literally everyone said they'd use it"]
      - ['1.4', reveal, 'Admits no one left contact details']
      - ['1.6', contradiction, "Says demand is proven, then mentions the RAs' warning about appliance rules"]
    sources: null
    branches:
      - If asked for a commitment test she designs a deposit ask
      - If compliments are accepted she buys machines
    expected:
      - Explains why compliments are weak evidence, briefly
      - Proposes a small commitment such as a refundable deposit from one floor
      - Raises the appliance rules as a blocker to check first
    prohibited:
      - Endorsing buying machines
      - Calling the feedback worthless
    memoryChanges:
      - Records pitch-night praise as opinion evidence and the appliance-rule question
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, actionability, recovery],
        pass: 'A commitment test replaces the purchase',
      }

  - id: LV-11-02
    version: 1
    title: A twelve-hundred-person waitlist built by a giveaway
    challenge: The waitlist was inflated by a prize; the coach should help measure intent among people who joined for the product.
    venture:
      {
        name: 'Fitfold',
        oneLiner: 'Foldable home gym for small apartments',
        stage: 'validation',
        domain: 'hardware',
        archetype: 'consumer hardware',
      }
    student:
      {
        name: 'Dmitri Kasparov-Nwosu',
        level: 'some_experience',
        discipline: 'MBA student',
        style: 'growth-hacker, metrics-proud',
      }
    purpose: evidence review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Use the 1,200 waitlist to negotiate with a manufacturer.
    constraints:
      - Manufacturer wants proof of demand
    hidden:
      - 1,000 sign-ups came during a free-unit giveaway
      - Open rate on his last email was 6 percent
    arc:
      - ['1.2', overclaim, 'Says 1,200 people are waiting']
      - ['1.5', reveal, 'Admits most joined during the giveaway']
      - ['1.7', new_evidence, 'Shares the 6 percent open rate']
    sources: null
    branches:
      - If segmented he looks at pre-giveaway sign-ups
      - If the total is used the manufacturer is misled
    expected:
      - Asks how and when people joined
      - Separates giveaway sign-ups from organic ones
      - Suggests a deposit or pre-order ask to the list
    prohibited:
      - Presenting 1,200 as demand
      - Email marketing benchmarks
    memoryChanges:
      - Records the giveaway-driven waitlist and low engagement
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, diagnostic_quality, actionability],
        pass: 'The waitlist is discounted and tested properly',
      }

