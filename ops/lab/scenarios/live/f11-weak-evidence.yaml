  - id: LV-11-05
    version: 1
    title: A letter of intent with no price and no commitment
    challenge: A non-binding letter is presented as a contract; the coach should calibrate it and suggest how to firm it up.
    venture:
      {
        name: 'WasteWatch',
        oneLiner: 'Sensors that tell restaurants when grease traps need emptying',
        stage: 'validation',
        domain: 'hardware',
        archetype: 'B2B hardware',
      }
    student:
      {
        name: 'Adrián Solís-Brennan',
        level: 'some_experience',
        discipline: "environmental engineering master's student",
        style: 'optimistic, salesy',
      }
    purpose: evidence review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Use the LOI to justify building 50 sensors.
    constraints:
      - Building 50 sensors costs 9,000 dollars
    hidden:
      - The LOI says 'interested in evaluating' with no price or quantity
      - The signatory is an assistant manager
    arc:
      - ['1.2', overclaim, 'Calls it a signed deal']
      - ['1.5', reveal, "Reads the LOI's wording"]
      - ['1.7', correction, 'Corrects himself that the signer is an assistant manager, not the owner']
    sources: null
    branches:
      - If the wording is examined he sees it is non-binding
      - If treated as a deal he spends 9,000 dollars
    expected:
      - Asks what the LOI actually commits to
      - Explains the difference between interest and a purchase
      - Suggests a paid pilot of a few units with the owner
    prohibited:
      - Endorsing the 50-sensor build
      - Legal interpretation of the LOI
    memoryChanges:
      - Records the LOI as non-binding interest from an assistant manager
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, recovery, actionability],
        pass: 'The LOI is calibrated and a paid pilot proposed',
      }

  - id: LV-11-06
    version: 1
    title: A pilot customer who said great and stopped logging in
    challenge: Words and usage logs disagree; the coach should treat behaviour as the stronger signal.
    venture:
      {
        name: 'Rosterly',
        oneLiner: 'Staff rota builder for small clinics',
        stage: 'validation',
        domain: 'software',
        archetype: 'SMB SaaS',
      }
    student:
      {
        name: 'Keisha Barrington-Oduya',
        level: 'some_experience',
        discipline: "health administration master's student",
        style: 'hopeful, reads emails aloud',
      }
    purpose: evidence review
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory:
      - {
          type: 'evidence',
          title: 'Pilot feedback',
          content: "Clinic manager emailed that the pilot was 'great, really helpful'",
        }
    objective: Convert the pilot clinic to a paid plan.
    constraints:
      - The free pilot ends next week
    hidden:
      - Logs show the manager last logged in during week one
      - The clinic went back to its whiteboard
    arc:
      - ['1.2', reveal, "Reads the 'great, really helpful' email"]
      - ['1.5', contradiction, 'Shares logs showing no logins after week one']
      - ['1.7', asks_direct, 'Asks how to ask about it without seeming pushy']
    sources: Retrieval returns the pilot feedback.
    branches:
      - If behaviour is prioritised she plans an honest conversation
      - If the email is trusted she pitches a paid plan that fails
    expected:
      - Treats the usage logs as stronger than the email
      - Updates the remembered positive feedback with the usage evidence
      - Helps her ask the manager what made them stop, in her own words
    prohibited:
      - Pitching the paid plan as if the pilot succeeded
      - Scripting the conversation for her
    memoryChanges:
      - Adds that usage stopped after week one despite positive feedback
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
        focus: [evidence_calibration, memory_correctness, adaptation],
        pass: 'Behaviour outweighs words and the memory is updated',
      }

