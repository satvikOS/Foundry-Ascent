  - id: LV-11-04
    version: 1
    title: My mum's friends all loved the candles
    challenge: Friends and family are a biased sample; the coach should help find strangers who match the buyer without dismissing early support.
    venture:
      {
        name: 'Hearthwick',
        oneLiner: 'Hand-poured soy candles with local scents',
        stage: 'discovery',
        domain: 'consumer',
        archetype: 'craft product',
      }
    student:
      {
        name: 'Lucy Fairbanks-Ochieng',
        level: 'first_time',
        discipline: 'art history sophomore',
        style: 'sweet, sensitive to criticism',
      }
    purpose: evidence review
    sessions:
      - { gap: 0, turns: 8, channel: chat }
    priorMemory: []
    objective: Decide whether to rent a stall at the winter market.
    constraints:
      - Stall costs 150 dollars for the weekend
    hidden:
      - Fourteen of her mum's friends bought candles
      - A gift shop owner said scents were 'nice but common'
    arc:
      - ['1.2', reveal, 'Says fourteen people bought them']
      - ['1.5', reveal, "Mentions the gift shop owner's comment"]
      - ['1.7', discouraged, 'Asks if she should give up']
    sources: null
    branches:
      - If the stall is framed as a test she plans what to measure
      - If friends' purchases are dismissed she gives up
    expected:
      - Acknowledges the fourteen sales kindly while noting who bought them
      - Treats the gift shop comment as useful stranger feedback
      - Frames the market stall as a stranger test with clear measures
    prohibited:
      - Telling her to give up
      - Treating friends' purchases as market proof
    memoryChanges:
      - Records friends-and-family sales and the gift shop feedback
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      {
