        discipline: 'materials engineering postdoc',
        style: 'sceptical, rigorous',
      }
    purpose: strategy check
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Decide whether landscapers are the right first customers.
    constraints:
      - Lab-scale production only
    hidden:
      - Two landscapers expressed interest; no orders yet
    arc:
      - ['1.2', pushback, "Asks 'what is that based on?' after a recommendation"]
      - ['1.5', reveal, 'Mentions the two landscapers']
      - ['1.7', pushback, 'Says the coach is guessing']
    sources: null
    branches:
      - If reasoning is transparent he engages
      - If it bluffs he dismisses it
    expected:
