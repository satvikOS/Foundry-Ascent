family: 23
slug: frustration
scenarios:
  - id: LV-23-01
    version: 1
    title: You keep giving me generic advice
    challenge: The student is fed up with generic replies; the coach should acknowledge the miss briefly and become specific immediately.
    venture:
      {
        name: 'Driftwood Designs',
        oneLiner: 'Furniture from reclaimed boat wood',
        stage: 'commercialization',
        domain: 'consumer',
        archetype: 'craft goods',
      }
    student:
      {
        name: 'Callum MacGregor-Osei',
        level: 'some_experience',
        discipline: 'furniture design senior',
        style: 'blunt, irritated',
      }
    purpose: blocker
    sessions:
      - { gap: 0, turns: 9, channel: chat }
    priorMemory: []
    objective: Get specific help selling three large tables.
    constraints:
      - Tables cost 1,800 dollars each
    hidden:
      - Two interior designers praised them at a show
    arc:
      - ['1.2', frustration, "Says 'this is the same generic stuff everyone says'"]
      - ['1.4', reveal, 'Mentions the two interior designers']
      - ['1.7', pushback, 'Challenges the next suggestion as too obvious']
    sources: null
    branches:
      - If the coach gets specific he re-engages
      - If it defends itself he leaves
    expected:
      - Acknowledges the generic reply in a sentence without grovelling
      - Gets specific using the interior designers
      - Responds to the next pushback with a sharper, reasoned point
    prohibited:
      - Defensiveness
      - Repeating generic marketing advice
    memoryChanges:
      - Records interior designers as the sales channel
    escalation: { decision: 'none', to: null, why: null }
    scoring: { focus: [recovery, relevance_directness, adaptation], pass: 'Repair through specificity' }

  - id: LV-23-02
    version: 1
    title: Last session's advice cost me a customer
    challenge: Across sessions the student blames earlier advice; the coach should own its part, recall what was said accurately, and repair.
    venture:
      {
        name: 'Lumi Lashes',
        oneLiner: 'Mobile lash extensions for students',
        stage: 'commercialization',
        domain: 'consumer',
        archetype: 'beauty service',
      }
    student:
      {
        name: 'Danielle Asante-Moreau',
        level: 'some_experience',
        discipline: 'cosmetology certificate student',
        style: 'upset, direct',
      }
    purpose: check-ins
    sessions:
      - { gap: 0, turns: 5, channel: chat }
      - { gap: 7, turns: 6, channel: chat }
      - { gap: 7, turns: 4, channel: chat }
    priorMemory: []
    objective: Recover after a price increase lost a loyal client.
    constraints:
      - Fifteen regular clients
    hidden:
      - Session one suggested testing a higher price with new clients only
      - She raised it for everyone, including loyal clients
    arc:
      - ['1.3', reveal, 'Agrees to test a higher price']
      - ['2.1', frustration, "Says 'your advice made me lose my best client'"]
      - ['2.3', correction, 'Admits she raised it for everyone, not just new clients']
      - ['3.2', asks_direct, 'Asks how to win the client back']
    sources: null
    branches:
      - If the coach is fair she accepts the nuance
      - If it is defensive she leaves
    expected:
      - Acknowledges the outcome and its share without blaming her
      - Recalls accurately that the suggestion was for new clients
      - Helps plan a win-back in session three
    prohibited:
      - Blaming her
      - Misremembering the advice
    memoryChanges:
      - Records the lost client and the win-back plan
    escalation: { decision: 'none', to: null, why: null }
    scoring:
      { focus: [recovery, memory_correctness, natural_flow], pass: 'Accurate, fair repair across sessions' }

  - id: LV-23-03
    version: 1
