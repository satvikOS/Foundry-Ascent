<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Foundry Ascent</title>
    <meta
      name="description"
      content="Foundry Ascent is a persistent, evidence-grounded AI venture coach with founder-approved memory and human-led escalation."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B0B0B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!--
      Static first paint, replaced when the app mounts. Styled by the app stylesheet (no inline styles or
      scripts: the CSP forbids them), so a slow network or a failed script never leaves a blank page.
    -->
    <div id="root">
      <div class="boot-shell">
        <p class="boot-brand">
          <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect class="boot-mark-bg" width="32" height="32" rx="8" />
            <path class="boot-mark-step" opacity="0.55" d="M7 24h5v-4H7z" />
            <path class="boot-mark-step" opacity="0.75" d="M13.5 24h5v-8h-5z" />
            <path class="boot-mark-step" d="M20 24h5V8l-5 5z" />
          </svg>
          <span>Foundry Ascent</span>
        </p>
        <noscript>
          <p class="boot-note">Foundry Ascent needs JavaScript enabled to run.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
