name: CI

# Blocking quality gates for every push and pull request (system design §11, §12). `deploy.yml` runs
# after this workflow succeeds on a push to main, so the job set here is the release gate.
#
# Supply chain: every action is pinned to a full commit SHA (version in the trailing comment, bumped by
# Dependabot). No job receives secrets or cloud credentials; the database jobs use throwaway service
# containers, and the model provider is the deterministic mock.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs on branches and PRs are cancelled; every commit on main keeps a complete record.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  CDK_DISABLE_CLI_TELEMETRY: 'true'
  # No job talks to AWS: keep SDKs from probing instance metadata for credentials.
  AWS_EC2_METADATA_DISABLED: 'true'

jobs:
  quality:
    name: Lint, format, typecheck, unit tests, web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm 10.28.0 comes from package.json "packageManager" (single source of truth).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrations bundle is up to date
        run: |
          pnpm --filter @foundry/db gen:migrations
          if ! git diff --exit-code -- packages/db/src/migrations \
            || [ -n "$(git status --porcelain -- packages/db/src/migrations)" ]; then
            echo "::error::packages/db/src/migrations/bundle.generated.ts is stale. Run 'pnpm --filter @foundry/db gen:migrations' and commit the result."
            exit 1
          fi

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      # Unit tests of every package (--no-bail: report every failing package, not just the first). The
      # infra suite (CDK synth + cdk-nag + snapshots) runs in the "infra" job; the *.db.test.ts suites run
      # in the "database" job.
      - name: Unit tests
        run: pnpm -r --no-bail --filter '!@foundry/infra' --if-present test

      - run: pnpm --filter @foundry/web build

      - name: Generated route tree is committed
        run: |
          if ! git diff --exit-code -- apps/web/src/routeTree.gen.ts; then
            echo "::error::apps/web/src/routeTree.gen.ts changed during the build. Run 'pnpm --filter @foundry/web build' and commit it."
            exit 1
          fi

  database:
    name: Database integration (PostgreSQL 16 + pgvector, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Superuser creates each test database and the vector/pgcrypto extensions; migrations and the app
      # run as the non-superuser fa_master role, like Aurora's master user.
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every package's *.db.test.ts suite (db, core, api), in dependency order. Each test file gets its
      # own database.
      - name: Database tests
        run: pnpm -r --no-bail --if-present test:db

  infra:
    name: Infrastructure (bundles, CDK tests, synth)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The deployable synth needs the real SPA (apps/web/dist) and handler entry points.
      - run: pnpm --filter @foundry/web build

      # Bundles api/worker/migrate the way CDK does and import-checks each bundle.
      - run: pnpm --filter @foundry/api check:bundles

      - run: pnpm --filter @foundry/infra test

      # Full synth with real assets and cdk-nag; no AWS credentials (region pinned, account-agnostic).
      - name: cdk synth
        working-directory: infra/cdk
        run: pnpm exec cdk synth --quiet --context "appVersion=${GITHUB_SHA}"

  python:
    name: Python (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: ops/aws
            ruff-format: false # hand-formatted; `ruff check` only
          - project: evals
            ruff-format: true # pyproject.toml [tool.ruff.format]; evals.yml checks the same
    # Each project is linted and tested from its own directory, so its pyproject/ruff configuration and
    # import layout apply exactly as they do locally. Tests run offline (no AWS, no network).
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements*.txt

      # Single source of truth for the toolchain: each project's requirements-dev.txt pins ruff, pytest and
      # their dependencies and includes the runtime pins (-r requirements.txt). Nothing else is installed.
      - name: Install dependencies
        run: |
          for file in requirements.txt requirements-dev.txt; do
            if [ ! -f "${file}" ]; then
              echo "::error::${PWD#"${GITHUB_WORKSPACE}/"}/${file} is missing"
              exit 1
            fi
          done
          python -m pip install -r requirements-dev.txt
          ruff --version
          python -m pytest --version

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        if: matrix.ruff-format
        run: ruff format --check .

      - name: pytest
        run: python -m pytest -q

  e2e:
    name: E2E founder journey (Playwright, mock model)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Local stack contract (apps/web/playwright.config.ts starts the servers): the API dev server
      # (apps/api dev, :8787) and `vite preview` (:4173, proxies /api to :8787).
      APP_ENV: development
      DB_DRIVER: pg
      MODEL_PROVIDER: mock
      LOG_LEVEL: warn
      HOME_TENANT_SLUG: ain
      E2E_BASE_URL: http://localhost:4173
      E2E_API_URL: http://localhost:8787
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @foundry/web exec playwright install --with-deps chromium

      # Creates database "foundry", migrates it as fa_master and seeds synthetic data with a fresh
      # owner access code. The code is masked and handed to the tests as E2E_OWNER_ACCESS_CODE.
      - name: Reset and seed the e2e database
        run: |
          out="$(mktemp)"
          if ! pnpm db:reset > "${out}"; then
            sed '/access code/d' "${out}"
            exit 1
          fi
          url="$(sed -n 's/^DATABASE_URL=//p' "${out}" | head -n 1)"
          code="$(grep -oE 'FA-[0-9A-Z]{5}(-[0-9A-Z]{5}){3}' "${out}" | head -n 1 || true)"
          rm -f "${out}"
          if [ -z "${url}" ] || [ -z "${code}" ]; then
            echo "::error::db:reset did not print DATABASE_URL and an owner access code"
            exit 1
          fi
          echo "::add-mask::${code}"
          {
            echo "DATABASE_URL=${url}"
            echo "E2E_OWNER_ACCESS_CODE=${code}"
          } >> "${GITHUB_ENV}"

      - run: pnpm --filter @foundry/web build

      - run: pnpm --filter @foundry/web e2e

      # Synthetic data only; reports help debug failures and expire after a week.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
