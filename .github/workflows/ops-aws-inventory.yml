name: Ops - AWS inventory (read-only)

# Retired. Read-only FinOps and hygiene report of the account (ops/aws/inventory.py). It ran as the stage-0 IAM user,
# whose access key was deleted on 2026-10-06 (ADR-0016), and the GitHub OIDC deploy role is not given its
# read access. Run ops/aws/inventory.py locally with read-only credentials, or use Cost Explorer
# (docs/runbooks/cost-controls.md, "Routine checks").
# A dispatched run stops at its first step with this explanation instead of an opaque STS error.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain why this workflow cannot run
        run: |
          echo "::error title=AWS inventory retired::This workflow used the stage-0 AWS access key, which was deleted on 2026-10-06. Run ops/aws/inventory.py locally with read-only credentials, or use Cost Explorer: docs/runbooks/cost-controls.md, section 'Routine checks'."
          exit 1
