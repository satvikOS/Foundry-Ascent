name: Ops - AWS inventory (read-only)

# Manually triggered FinOps / hygiene report. Never mutates AWS resources.
# Runs as the stage-0 IAM user. The repository is public: inventory.py masks the account id (::add-mask::)
# before it prints anything. The access key reaches only the step that calls AWS. Actions are pinned to
# commit SHAs (Node 24).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-aws-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report which AWS secret names are configured (values never printed)
        env:
          S_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S_AWS_REGION: ${{ secrets.AWS_REGION }}
          S_AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S_AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          S_AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          S_AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          S_AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          S_AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION AWS_DEFAULT_REGION AWS_ACCOUNT_ID \
                      AWS_ACCESS_KEY AWS_SECRET_KEY AWS_SESSION_TOKEN AWS_ROLE_ARN; do
            var="S_${name}"
            if [ -n "${!var}" ]; then echo "secret ${name}: set"; else echo "secret ${name}: not set"; fi
          done

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: pip install --quiet -r ops/aws/requirements.txt

      - name: Inventory
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
        run: python ops/aws/inventory.py
