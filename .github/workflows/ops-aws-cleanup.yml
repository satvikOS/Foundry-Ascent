name: Ops - AWS legacy cleanup

# One-time removal of resources that predate Foundry Ascent. "plan" is read-only.
# "apply" requires typing the confirmation phrase. See docs/runbooks/legacy-aws-cleanup.md.
#
# Runs as the stage-0 IAM user. The repository is public: cleanup.py masks the account id (::add-mask::)
# before it prints anything and redacts digit runs from AWS messages. The access key is passed only to the
# step that calls AWS, never to dependency installation. Actions are pinned to commit SHAs (Node 24).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan (read-only) or apply (deletes)
        type: choice
        options: [plan, apply]
        default: plan
      confirm:
        description: Type DELETE-LEGACY-RESOURCES to allow apply
        type: string
        default: ''
      include_mail_zones:
        description: Also delete Route 53 zones that have MX (email) records
        type: boolean
        default: false
      regions:
        description: all, or a comma-separated region list
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: ops-aws-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    steps:
      - name: Require confirmation for apply
        if: inputs.mode == 'apply' && inputs.confirm != 'DELETE-LEGACY-RESOURCES'
        run: |
          echo "::error::apply requires confirm=DELETE-LEGACY-RESOURCES"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: pip install --quiet -r ops/aws/requirements.txt

      - name: Cleanup (${{ inputs.mode }})
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MODE: ${{ inputs.mode }}
          REGIONS: ${{ inputs.regions }}
          INCLUDE_MAIL: ${{ inputs.include_mail_zones }}
        run: |
          args=(--mode "$MODE" --regions "$REGIONS" --json-out cleanup-report.json)
          if [ "$INCLUDE_MAIL" = "true" ]; then args+=(--include-mail-zones); fi
          python ops/aws/cleanup.py "${args[@]}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cleanup-report-${{ inputs.mode }}
          path: cleanup-report.json
          retention-days: 7
          if-no-files-found: ignore
