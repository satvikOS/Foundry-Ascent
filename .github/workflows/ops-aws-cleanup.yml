name: Ops - AWS legacy cleanup

# Retired. One-time removal of resources that predate Foundry Ascent (ops/aws/cleanup.py). It is done, and the
# stage-0 access key it ran with was deleted on 2026-10-06 (docs/runbooks/legacy-aws-cleanup.md, archived).
# A dispatched run stops at its first step with this explanation instead of an opaque STS error.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain why this workflow cannot run
        run: |
          echo "::error title=Legacy cleanup retired::The one-time legacy cleanup is done, and the stage-0 access key it used was deleted on 2026-10-06. See docs/runbooks/legacy-aws-cleanup.md (archived)."
          exit 1
