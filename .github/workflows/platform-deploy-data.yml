name: Platform - deploy data stack

# Retired. Deployed FoundryAscent-Data on its own, ahead of the first full release, as the stage-0 IAM user. That
# user has had no access key since 2026-10-06 (ADR-0016); the Deploy workflow updates the Data stack with
# every release over GitHub OIDC (docs/runbooks/deploy-and-rollback.md).
# A dispatched run stops at its first step with this explanation instead of an opaque STS error.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain why this workflow cannot run
        run: |
          echo "::error title=Data stack deploy retired::This workflow used the stage-0 AWS access key, which was deleted on 2026-10-06. The Deploy workflow updates FoundryAscent-Data with every release over GitHub OIDC: docs/runbooks/deploy-and-rollback.md."
          exit 1
