name: Ops - verify AWS access

# Retired. Checked that the stage-0 IAM user had every permission in infra/iam/required-actions.json
# (ops/aws/verify_access.py). That user has had no access key since 2026-10-06 (ADR-0016); every Deploy
# run now proves the OIDC deploy role works, and Bedrock is probed as described in
# docs/runbooks/deploy-and-rollback.md, "Probing Bedrock and Polly".
# A dispatched run stops at its first step with this explanation instead of an opaque STS error.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain why this workflow cannot run
        run: |
          echo "::error title=AWS access check retired::This workflow checked the stage-0 IAM user, whose access key was deleted on 2026-10-06. Every Deploy run proves the GitHub OIDC role; to probe Bedrock see docs/runbooks/deploy-and-rollback.md, section 'Probing Bedrock and Polly'."
          exit 1
