name: Ops - Bedrock live probe

# Retired. This probe signed in with the stage-0 access key, which was deleted on 2026-10-06
# (infra/iam/README.md), and it is deliberately not moved to GitHub OIDC: the only OIDC role,
# FoundryAscent-GitHubDeploy (infra/cdk/src/stacks/foundation-stack.ts), may assume the four CDK bootstrap
# roles and read CloudFormation, platform Lambda logs and Cost Explorer, nothing else, and any job in the
# production environment can assume it. A dispatched run therefore stops at its first step with that
# explanation instead of an opaque STS error. How to probe Bedrock and Polly today, and what a revived
# probe needs (its own narrowly scoped role and GitHub environment): docs/runbooks/deploy-and-rollback.md,
# "Probing Bedrock and Polly".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain why this probe cannot run
        run: |
          echo "::error title=Bedrock probe retired::This workflow used the stage-0 AWS access key, which was deleted on 2026-10-06, and the GitHub OIDC deploy role has no Bedrock or Polly access by design. See docs/runbooks/deploy-and-rollback.md, section 'Probing Bedrock and Polly'."
          exit 1
