name: Ops - retire stage-0 AWS access

# Retired. Retired the stage-0 CI identity (ops/aws/retire_stage0.py). That happened on 2026-10-06: the access key
# was deleted and deploys run through GitHub OIDC (ADR-0016, infra/iam/README.md). Nothing is left to retire.
# A dispatched run stops at its first step with this explanation instead of an opaque STS error.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain why this workflow cannot run
        run: |
          echo "::error title=Stage-0 retirement done::Stage 0 was retired on 2026-10-06: its access key is deleted and deploys run through GitHub OIDC. Nothing is left to do here; see ADR-0016 and docs/runbooks/owner-actions.md for the leftover secrets."
          exit 1
