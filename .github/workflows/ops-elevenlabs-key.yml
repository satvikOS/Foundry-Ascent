name: Ops - sync ElevenLabs key

# Two owner-run modes, both by hand from the Actions tab on main (docs/runbooks/elevenlabs-voice.md):
#
# sync (default): copies the repository secret ELEVENLABS_API (the owner's ElevenLabs API key) into the AWS Secrets
# Manager secret foundry-ascent/media/elevenlabs in us-east-1, as {"apiKey": "<key>"}: the secret the API reads the
# voice vendor's key from (packages/core/media-vendors.json). The owner never pastes the key into a shell. Run it after
# the first deploy that grants the deploy role this secret (foundation stack, GitHubDeployMediaKeyPolicy), and again
# after rotating the repository secret; the API picks a new key up within 5 minutes.
#
# check: reports the key's ElevenLabs plan (tier) and the characters left on it this period, and nothing else. It calls
# GET https://api.elevenlabs.io/v1/user/subscription with the key from a 0600 header file (curl -H @file: never on a
# command line) and writes only the tier (letters, digits and _ ) and one whole number. No AWS access.
#
# Why a separate, manual workflow and not a step of Deploy: the key is decrypted on a runner only when the owner asks
# for it (not on every push to main), on a runner that installs and runs no dependency code (Deploy's job runs
# `pnpm install` and the CDK app, and a process an earlier step leaves behind can read a later step's environment),
# a failed copy never marks a deploy red or blocks one, and rotating the key needs no deploy.
#
# AWS access (sync only): GitHub OIDC as the deploy role FoundryAscent-GitHubDeploy (the `production` environment is its
# only trusted subject, and that environment deploys from main only). Of Secrets Manager the role may call exactly
# CreateSecret and PutSecretValue, on this secret and the HeyGen one (infra/cdk/src/stacks/foundation-stack.ts,
# GitHubDeployMediaKeyPolicy): it cannot read a key back, nor even its metadata.
#
# THE REPOSITORY IS PUBLIC: the key is never echoed, never on a command line (it goes from the step's environment
# through bash builtins and jq's stdin into a 0600 file the AWS CLI reads with file://, or into a 0600 header file curl
# reads with -H @file, removed on exit), and masked with ::add-mask:: on top of GitHub's own secret masking. The log and
# the job summary say only created, updated or skipped (sync), or the tier and a number (check). An empty or unset
# repository secret skips cleanly. Idempotent: every sync leaves the secret's current value equal to the repository
# secret (a re-run stores the same value as a new version; the previous one stays as AWSPREVIOUS).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync: copy the key into AWS Secrets Manager. check: report the plan and the characters left (no AWS).'
        type: choice
        options: [sync, check]
        default: sync

permissions: {}

concurrency:
  group: ops-elevenlabs-key
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    name: Sync ElevenLabs key
    if: github.ref == 'refs/heads/main' && (inputs.mode || 'sync') == 'sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      SECRET_NAME: foundry-ascent/media/elevenlabs
    steps:
      - name: Check the repository secret
        id: key
        env:
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_API }}
        run: |
          if [ -z "${ELEVENLABS_KEY}" ]; then
            echo "::notice::The repository secret ELEVENLABS_API is empty or not set: nothing to copy."
            echo "present=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Mask every line, as given and without surrounding whitespace (a multi-line value is a paste error, refused
          # below, but must not print either; ::add-mask:: masks one line).
          printf '%s\n' "${ELEVENLABS_KEY}" | while IFS= read -r line; do
            trimmed="${line#"${line%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            if [ -n "${line}" ]; then echo "::add-mask::${line}"; fi
            if [ -n "${trimmed}" ] && [ "${trimmed}" != "${line}" ]; then echo "::add-mask::${trimmed}"; fi
          done
          # Checked, never echoed: after dropping surrounding whitespace (a trailing newline from a copy-paste), one
          # token of letters, digits and ._~+/=:- (no spaces, quotes or backslashes).
          key="${ELEVENLABS_KEY#"${ELEVENLABS_KEY%%[![:space:]]*}"}"
          key="${key%"${key##*[![:space:]]}"}"
          if [ "${#key}" -lt 16 ] || [ "${#key}" -gt 1024 ] || [[ ! "${key}" =~ ^[A-Za-z0-9._~+/=:_-]+$ ]]; then
            echo "::error::ELEVENLABS_API is not a single API key (16 to 1024 letters, digits or ._~+/=:_- without spaces or quotes). Set it again under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "present=true" >> "${GITHUB_OUTPUT}"

      - name: Resolve the deploy role
        if: steps.key.outputs.present == 'true'
        env:
          RAW_DEPLOY_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          # An ARN or the 12-digit account id; masked, never printed. GitHub OIDC only (no stage-0 key).
          role="$(printf '%s' "${RAW_DEPLOY_ROLE}" | tr -d "[:space:]\"'")"
          if [[ "${role}" =~ ^([0-9]{12})$ ]] || [[ "${role}" =~ ^arn:aws:iam::([0-9]{12}):role/FoundryAscent-GitHubDeploy$ ]]; then
            account="${BASH_REMATCH[1]}"
          else
            echo "::error::AWS_DEPLOY_ROLE_ARN is not set to the FoundryAscent-GitHubDeploy role ARN or a 12-digit account id."
            exit 1
          fi
          echo "::add-mask::${account}"
          deploy_role="arn:aws:iam::${account}:role/FoundryAscent-GitHubDeploy"
          echo "::add-mask::${deploy_role}"
          echo "DEPLOY_ROLE_ARN=${deploy_role}" >> "${GITHUB_ENV}"

      - name: AWS credentials (GitHub OIDC, deploy role)
        if: steps.key.outputs.present == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: foundry-ascent-elevenlabs-key-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Mask account id
        if: steps.key.outputs.present == 'true'
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ ! "${account}" =~ ^[0-9]{12}$ ]]; then
            echo "::error::sts:GetCallerIdentity did not return a 12-digit account id"
            exit 1
          fi
          echo "::add-mask::${account}"

      - name: Store the key in Secrets Manager
        id: store
        if: steps.key.outputs.present == 'true'
        env:
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_API }}
          # Throttling is retried by the CLI; any error that remains stops the run.
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: '6'
        run: |
          umask 077
          dir="$(mktemp -d "${RUNNER_TEMP}/elevenlabs-key.XXXXXX")"
          trap 'rm -rf "${dir}"' EXIT
          secret="${dir}/secret.json"
          err="${dir}/err"
          one_line() { tr -s '\r\n\t' '   ' < "${err}" | head -c 300; }

          # {"apiKey": "<key>"} with no trailing newline: printf is a bash builtin and jq reads the key on stdin,
          # so it never appears in a process's arguments.
          # The same trimming as the check above, which refused anything else.
          key="${ELEVENLABS_KEY#"${ELEVENLABS_KEY%%[![:space:]]*}"}"
          key="${key%"${key##*[![:space:]]}"}"
          printf '%s' "${key}" | jq -R -s -c -j '{apiKey: .}' > "${secret}"
          unset key ELEVENLABS_KEY
          if ! jq -e '(keys == ["apiKey"]) and (.apiKey | type == "string" and length >= 16)' "${secret}" > /dev/null; then
            echo "::error::Could not build the secret value."
            exit 1
          fi

          # Create first, then put: CreateSecret is granted for the exact name, so it is authorized whether or not the
          # secret exists, and an existing secret answers ResourceExistsException. (Asking first would not work on the
          # first run: a call granted only on the suffixed ARN may be answered AccessDeniedException, not
          # ResourceNotFoundException, while no such ARN exists.) A secret scheduled for deletion refuses both writes
          # with InvalidRequestException. AWS output and errors may hold the secret's ARN, which carries the (masked)
          # account id: none of it is printed beyond a masked one-line reason.
          deletion_scheduled() {
            grep -q 'InvalidRequestException' "${err}" && grep -q 'deletion' "${err}"
          }
          refuse_deleted() {
            echo "::error::${SECRET_NAME} is scheduled for deletion. Cancel the deletion in the AWS console (Secrets Manager, us-east-1), then run this again."
            exit 1
          }
          if aws secretsmanager create-secret --name "${SECRET_NAME}" \
            --description "ElevenLabs API key for the vEIR's voice (synced from GitHub by Ops - sync ElevenLabs key)" \
            --secret-string "file://${secret}" > /dev/null 2>"${err}"; then
            action=created
          elif grep -q 'ResourceExistsException' "${err}"; then
            if aws secretsmanager put-secret-value --secret-id "${SECRET_NAME}" \
              --secret-string "file://${secret}" > /dev/null 2>"${err}"; then
              action=updated
            elif deletion_scheduled; then
              refuse_deleted
            else
              echo "::error::Could not update ${SECRET_NAME} ($(one_line))."
              exit 1
            fi
          elif deletion_scheduled; then
            refuse_deleted
          else
            echo "::error::Could not create ${SECRET_NAME} ($(one_line))."
            exit 1
          fi
          echo "${SECRET_NAME}: ${action}."
          echo "action=${action}" >> "${GITHUB_OUTPUT}"

      - name: Job summary
        if: always()
        env:
          PRESENT: ${{ steps.key.outputs.present }}
          ACTION: ${{ steps.store.outputs.action }}
          OUTCOME: ${{ steps.store.outcome }}
        run: |
          # Step summaries are not covered by ::add-mask::; only fixed words are written here.
          case "${PRESENT}:${ACTION}:${OUTCOME}" in
            false:*) result="skipped: the repository secret ELEVENLABS_API is empty or not set" ;;
            true:created:success) result="created (the API reads it within 5 minutes)" ;;
            true:updated:success) result="updated (the API reads it within 5 minutes)" ;;
            *) result="not stored (see the log)" ;;
          esac
          {
            echo "### ElevenLabs key"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Secret | \`${SECRET_NAME}\` (us-east-1) |"
            echo "| Result | ${result} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  check:
    name: Check ElevenLabs plan
    if: github.ref == 'refs/heads/main' && inputs.mode == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions: {}
    env:
      API_ORIGIN: https://api.elevenlabs.io
    steps:
      - name: Check the repository secret
        id: key
        env:
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_API }}
        run: |
          if [ -z "${ELEVENLABS_KEY}" ]; then
            echo "::notice::The repository secret ELEVENLABS_API is empty or not set: nothing to check."
            echo "present=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          printf '%s\n' "${ELEVENLABS_KEY}" | while IFS= read -r line; do
            trimmed="${line#"${line%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            if [ -n "${line}" ]; then echo "::add-mask::${line}"; fi
            if [ -n "${trimmed}" ] && [ "${trimmed}" != "${line}" ]; then echo "::add-mask::${trimmed}"; fi
          done
          key="${ELEVENLABS_KEY#"${ELEVENLABS_KEY%%[![:space:]]*}"}"
          key="${key%"${key##*[![:space:]]}"}"
          if [ "${#key}" -lt 16 ] || [ "${#key}" -gt 1024 ] || [[ ! "${key}" =~ ^[A-Za-z0-9._~+/=:_-]+$ ]]; then
            echo "::error::ELEVENLABS_API is not a single API key (16 to 1024 letters, digits or ._~+/=:_- without spaces or quotes). Set it again under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "present=true" >> "${GITHUB_OUTPUT}"

      - name: Read the plan
        id: plan
        if: steps.key.outputs.present == 'true'
        env:
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_API }}
          # The tier, and the characters left this period (limit minus used); plans billed by usage report none.
          TIER_FILTER: 'if (.tier | type) == "string" then .tier else "" end'
          LEFT_FILTER: 'if (.character_limit | type) == "number" and (.character_count | type) == "number" then ([.character_limit - .character_count, 0] | max | floor | tostring) else "" end'
        run: |
          umask 077
          dir="$(mktemp -d "${RUNNER_TEMP}/elevenlabs-check.XXXXXX")"
          trap 'rm -rf "${dir}"' EXIT
          # The key goes into a 0600 header file curl reads (-H @file), never onto a command line.
          key="${ELEVENLABS_KEY#"${ELEVENLABS_KEY%%[![:space:]]*}"}"
          key="${key%"${key##*[![:space:]]}"}"
          printf 'xi-api-key: %s\n' "${key}" > "${dir}/headers"
          unset key ELEVENLABS_KEY
          if ! status="$(curl --silent --proto '=https' --max-time 20 -H "@${dir}/headers" \
            -o "${dir}/body" -w '%{http_code}' "${API_ORIGIN}/v1/user/subscription" 2>/dev/null)"; then
            echo "::error::ElevenLabs could not be reached."
            exit 1
          fi
          if [[ ! "${status}" =~ ^[0-9]{3}$ ]]; then status="unknown"; fi
          if [ "${status}" != "200" ]; then
            echo "::error::ElevenLabs answered HTTP ${status} (401: the key is wrong or revoked; 403: the key may not read its subscription, so give it user read)."
            exit 1
          fi
          # Only the tier (letters, digits, _) and one whole number leave this step; nothing else of the answer is
          # printed.
          tier="$(jq -r "${TIER_FILTER}" "${dir}/body" 2>/dev/null | tr -cd 'A-Za-z0-9_' | head -c 40)"
          left="$(jq -r "${LEFT_FILTER}" "${dir}/body" 2>/dev/null || true)"
          if [[ ! "${left}" =~ ^[0-9]{1,15}$ ]]; then left=""; fi
          echo "tier=${tier:-unknown}" >> "${GITHUB_OUTPUT}"
          echo "left=${left}" >> "${GITHUB_OUTPUT}"
          echo "Plan: ${tier:-unknown}. Characters left this period: ${left:-not reported}."

      - name: Job summary
        if: always()
        env:
          PRESENT: ${{ steps.key.outputs.present }}
          TIER: ${{ steps.plan.outputs.tier }}
          LEFT: ${{ steps.plan.outputs.left }}
          OUTCOME: ${{ steps.plan.outcome }}
        run: |
          # Fixed words, the tier (re-checked: letters, digits, _) and a number only.
          tier="$(printf '%s' "${TIER}" | tr -cd 'A-Za-z0-9_' | head -c 40)"
          left="${LEFT}"
          if [[ ! "${left}" =~ ^[0-9]{1,15}$ ]]; then left="not reported"; fi
          case "${PRESENT}:${OUTCOME}" in
            false:*) plan="skipped: the repository secret ELEVENLABS_API is empty or not set"; left="-" ;;
            true:success) plan="${tier:-unknown}" ;;
            *) plan="not read (see the log)"; left="-" ;;
          esac
          {
            echo "### ElevenLabs plan"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Plan (tier) | ${plan} |"
            echo "| Characters left this period | ${left} |"
          } >> "${GITHUB_STEP_SUMMARY}"
