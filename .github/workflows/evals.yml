name: Evals - scenario benchmark and red team

# Manually triggered evaluation of a deployed Foundry Ascent site against the blueprint 01 §9 gates
# (0 critical cross-venture disclosures, >= 95% high-risk escalation recall, >= 90% fact claims with
# evidence, no identity claims, ...). See evals/README.md.
#
# One-time setup (repository owner):
#   * Settings -> Environments -> New environment "evals". Add the environment secret FA_OWNER_ACCESS_CODE,
#     the platform owner's access code (FA-XXXXX-XXXXX-XXXXX-XXXXX); optionally require a reviewer. Delete
#     any repository-level secret of that name. The harness signs in with it, issues short-lived codes for
#     synthetic principals only, and revokes them when the run ends.
#   * Settings -> Secrets and variables -> Actions -> Variables: add FA_SITE_URL, the https origin of the
#     deployed site (for example https://dxxxxxxxxxxxx.cloudfront.net).
#
# The site URL is deliberately NOT a run input: the owner access code is sent to that URL, so whoever can
# dispatch a run could otherwise point it at a server of their own and capture the code. Only a repository
# administrator sets FA_SITE_URL, and the code lives in the "evals" environment, not in the repository.
#
# This repository is public, so logs are public: the harness prints case ids, statuses, grader codes
# and aggregates only - never prompts, responses, memory content, canaries or access codes. The
# results artifact (results.json + report.md) follows the same rule. Never add --include-transcripts here.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        options: [all, scenarios, redteam]
        default: all
      max_turns:
        description: Hard cap on model turns (each costs one Bedrock call)
        type: string
        required: false
        default: '100'
      max_cost_usd:
        description: Optional spend budget in USD (caps turns at budget / $0.01)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    # Environment secret FA_OWNER_ACCESS_CODE (protection rules, e.g. required reviewers, apply).
    environment: evals
    # Per-principal turn rate limits (20 turns / 10 min) can add waits on a full run.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          # No dependency cache in a job that holds the owner access code (cache-poisoning hardening).

      # The same pinned toolchain as the CI "python" job: requirements-dev.txt (ruff, pytest) includes the
      # runtime pins in requirements.txt.
      - name: Install
        run: python -m pip install --quiet -r requirements-dev.txt

      # Offline: no network, no AWS, no secret. Fails fast before the paid run.
      - name: Lint and unit tests (offline)
        run: |
          ruff check .
          ruff format --check .
          python -m pytest
          python -m foundry_evals validate > /dev/null

      - name: Check configuration
        env:
          BASE_URL: ${{ vars.FA_SITE_URL }}
          HAS_CODE: ${{ secrets.FA_OWNER_ACCESS_CODE != '' }}
          MAX_TURNS: ${{ inputs.max_turns }}
          MAX_COST: ${{ inputs.max_cost_usd }}
        run: |
          if [ "${HAS_CODE}" != "true" ]; then
            echo "::error title=Missing secret::Add FA_OWNER_ACCESS_CODE (the platform owner's access code) as a secret of the evals environment. See evals/README.md."
            exit 1
          fi
          if [[ ! "${BASE_URL}" =~ ^https://[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+/?$ ]]; then
            echo "::error title=Missing or invalid site URL::Set the repository variable FA_SITE_URL to the https origin of the site (no path, port or credentials)."
            exit 1
          fi
          if [[ ! "${MAX_TURNS}" =~ ^[0-9]+$ ]] || [ "${MAX_TURNS}" -lt 1 ]; then
            echo "::error title=Invalid max_turns::max_turns must be a positive integer."
            exit 1
          fi
          if [ -n "${MAX_COST}" ] && [[ ! "${MAX_COST}" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error title=Invalid max_cost_usd::max_cost_usd must be a number."
            exit 1
          fi

      - name: Run evaluation
        env:
          FA_OWNER_ACCESS_CODE: ${{ secrets.FA_OWNER_ACCESS_CODE }}
          FA_BASE_URL: ${{ vars.FA_SITE_URL }}
          SUITE: ${{ inputs.suite }}
          MAX_TURNS: ${{ inputs.max_turns }}
          MAX_COST: ${{ inputs.max_cost_usd }}
          RUN_ID: ${{ github.run_id }}
        run: |
          args=(run --suite "${SUITE}" --base-url "${FA_BASE_URL}" --out "results/run-${RUN_ID}" --max-turns "${MAX_TURNS}")
          if [ -n "${MAX_COST}" ]; then args+=(--max-cost-usd "${MAX_COST}"); fi
          set +e
          python -m foundry_evals "${args[@]}"
          status=$?
          set -e
          if [ -f "results/run-${RUN_ID}/report.md" ]; then
            cat "results/run-${RUN_ID}/report.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          case "${status}" in
            0) echo "All blocking gates passed." ;;
            1) echo "::error title=Evaluation gates failed::See the job summary and the evals-results artifact." ;;
            2) echo "::error title=Evaluation configuration error::See the log above." ;;
            *) echo "::error title=Evaluation infrastructure error::Setup failed or the run was aborted; see the log above." ;;
          esac
          exit "${status}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evals-results-${{ github.run_id }}
          path: evals/results/
          retention-days: 14
          if-no-files-found: warn
