name: Ops - conversation lab

# Real conversations with the app's real models, headless, on synthetic data (docs/runbooks/conversation-lab.md).
# Each suite runs in its own job: a PostgreSQL 16 + pgvector service, `pnpm db:reset` (the synthetic seed), the API
# dev server with MODEL_PROVIDER=bedrock and the production model configuration (infra/cdk/config/production.json),
# the production web build, and the lab harness (ops/lab):
#   recall  the owner's scenario through the UI: a typed call, hang up, a second call minutes later, "do you
#           remember what we talked about last time?"; also chat -> call and call -> chat.
#   voice   a true voice call: Amazon Polly speaks the founder's lines into Chromium's fake microphone, the app
#           streams them to Amazon Transcribe, answers on the real model and speaks with Polly (muted).
#   matrix  conversations across the matrix of human conversation, founder turns from an LLM simulator, graded by
#           the deterministic graders and an LLM judge (both on Bedrock).
#   ui      the whole Playwright suite (apps/web/e2e) against the real model.
#
# Runs only from main, in the `conversation-lab` GitHub environment, whose OIDC subject is the only one the
# FoundryAscent-ConversationLab role trusts (infra/cdk/src/stacks/foundation-stack.ts). That role may invoke the
# app's and the lab's Bedrock models, Polly SynthesizeSpeech and DescribeVoices and Transcribe streaming, nothing
# else: no database, bucket, queue, function, log or secret of the platform. Nothing here touches production data.
#
# THE REPOSITORY IS PUBLIC: this log, the job summary and artifacts are world-readable. The harness prints only pass
# rates, latencies, counts, ids, codes, fixed test titles and dollars. Transcripts, judge rationales, failure
# screenshots and server logs are written to a private folder that is sealed to `public_key` (RSA-OAEP-256 +
# AES-256-GCM, the ops-insights envelope) and uploaded for 1 day, or deleted when no key is given. Open them locally:
#   pnpm --filter @foundry/api exec tsx src/scripts/lab-seal.ts open <private.pem> <dir> <out-dir>
#
# Spend: `budget_usd` is a hard cap for the whole run, split across the suites; within a suite the app's share is
# enforced by the app itself (its daily platform cap is set to it) and the lab's own calls are metered and refused
# before they could go over. The summary prints what was spent.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run (all = every suite, in parallel jobs)
        type: choice
        options: [recall, matrix, voice, ui, agenda, all]
        default: recall
      budget_usd:
        description: Hard cap in USD for the whole run, split across the suites (0.5 to 50)
        type: string
        default: '5'
      max_scenarios:
        description: Most scenarios a suite runs (1 to 40)
        type: string
        default: '14'
      public_key:
        description: RSA public key (3072+ bits) as the base64 of its DER SubjectPublicKeyInfo, one line; empty = numbers only, nothing sealed
        type: string
        default: ''
      scenario_ids:
        description: matrix only - run just these scenarios (comma-separated ids, e.g. SM-13,SM-39); empty = all up to max_scenarios
        type: string
        default: ''
      repeat:
        description: matrix - run each chosen scenario this many times; voice - calls in a row (1 to 5 for voice, 1 to 10 for matrix)
        type: string
        default: '1'
      matrix_source:
        description: matrix only - the lab's 40 scenarios (builtin) or evals' conversation matrix (evals)
        type: choice
        options: [builtin, evals]
        default: builtin
      baseline_run_id:
        description: Compare with an earlier lab run (its run id; a committed ops/lab/baselines file or its public summary artifact); empty = no comparison
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ops-conversation-lab
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
      budgets: ${{ steps.plan.outputs.budgets }}
    steps:
      - name: Validate inputs
        env:
          SUITE: ${{ inputs.suite }}
          BUDGET: ${{ inputs.budget_usd }}
          MAX_SCENARIOS: ${{ inputs.max_scenarios }}
          PUBLIC_KEY: ${{ inputs.public_key }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          SCENARIO_IDS: ${{ inputs.scenario_ids }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          # Values are checked, never echoed (except the suite and the numbers, which are public).
          case "${SUITE}" in recall|matrix|voice|ui|agenda|all) ;; *) echo "::error::suite must be recall, matrix, voice, ui, agenda or all."; exit 1;; esac
          if [[ ! "${BUDGET}" =~ ^[0-9]{1,2}(\.[0-9]{1,2})?$ ]] || ! awk -v b="${BUDGET}" 'BEGIN { exit !(b >= 0.5 && b <= 50) }'; then
            echo "::error::budget_usd must be a number from 0.5 to 50."
            exit 1
          fi
          if [[ ! "${MAX_SCENARIOS}" =~ ^[0-9]{1,2}$ ]] || (( 10#${MAX_SCENARIOS} < 1 || 10#${MAX_SCENARIOS} > 40 )); then
            echo "::error::max_scenarios must be a whole number from 1 to 40."
            exit 1
          fi
          if [[ ! "${SCENARIO_IDS}" =~ ^([A-Z]{2}-[0-9]{2}(,[A-Z]{2}-[0-9]{2}){0,19})?$ ]]; then
            echo "::error::scenario_ids must be empty or comma-separated ids like SM-13,SM-39."
            exit 1
          fi
          if [[ ! "${REPEAT}" =~ ^[0-9]{1,2}$ ]] || (( 10#${REPEAT} < 1 || 10#${REPEAT} > 10 )); then
            echo "::error::repeat must be a whole number from 1 to 10."
            exit 1
          fi
          if [[ ! "${BASELINE_RUN_ID}" =~ ^[0-9]{0,20}$ ]]; then
            echo "::error::baseline_run_id must be empty or a run id (digits)."
            exit 1
          fi
          key="$(printf '%s' "${PUBLIC_KEY}" | tr -d '[:space:]')"
          if [ -n "${key}" ] && [[ ! "${key}" =~ ^[A-Za-z0-9+/]{500,1400}={0,2}$ ]]; then
            echo "::error::public_key must be empty or the base64 of an RSA public key's DER SubjectPublicKeyInfo (openssl pkey -pubin -in public.pem -outform DER | base64), on one line."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: plan
        name: Suites and budgets
        working-directory: ops/lab
        env:
          SUITE: ${{ inputs.suite }}
          BUDGET: ${{ inputs.budget_usd }}
        run: |
          # Standard library only (conversation_lab/config.py): no dependency is installed in this job.
          plan="$(python3 -m conversation_lab plan --suite "${SUITE}" --budget-usd "${BUDGET}")"
          echo "${plan}"
          echo "suites=$(jq -c .suites <<< "${plan}")" >> "${GITHUB_OUTPUT}"
          echo "budgets=$(jq -c .budgets <<< "${plan}")" >> "${GITHUB_OUTPUT}"

  lab:
    name: Lab (${{ matrix.suite }})
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The role's sessions last at most one hour; every suite finishes well inside it.
    timeout-minutes: 70
    environment: conversation-lab
    permissions:
      contents: read
      id-token: write
      # Only to download a baseline run's public summary artifact.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      HOME_TENANT_SLUG: ain
      LAB_SUITE: ${{ matrix.suite }}
      LAB_BUDGET_USD: ${{ fromJSON(needs.plan.outputs.budgets)[matrix.suite] }}
      LAB_MAX_SCENARIOS: ${{ inputs.max_scenarios }}
      LAB_BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
      LAB_SCENARIO_IDS: ${{ inputs.scenario_ids }}
      LAB_REPEAT: ${{ inputs.repeat }}
      LAB_MATRIX_SOURCE: ${{ inputs.matrix_source }}
    steps:
      - name: Validate the sealing key, set the output folder
        env:
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          echo "LAB_OUT=${RUNNER_TEMP}/lab" >> "${GITHUB_ENV}"
          key="$(printf '%s' "${PUBLIC_KEY}" | tr -d '[:space:]')"
          if [ -n "${key}" ]; then
            if [[ ! "${key}" =~ ^[A-Za-z0-9+/]{500,1400}={0,2}$ ]]; then
              echo "::error::public_key is not a base64 DER public key."
              exit 1
            fi
            echo "LAB_PUBLIC_KEY=${key}" >> "${GITHUB_ENV}"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache in a job that holds cloud credentials; everything is installed before they exist.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the lab harness
        run: python -m pip install -r ops/lab/requirements.txt

      - name: Install Playwright Chromium
        if: matrix.suite != 'matrix' && matrix.suite != 'agenda'
        run: pnpm --filter @foundry/web exec playwright install --with-deps chromium

      - name: Build the web app
        if: matrix.suite != 'matrix' && matrix.suite != 'agenda'
        run: pnpm --filter @foundry/web build

      # Creates database "foundry", migrates it and seeds the synthetic tenant with a fresh owner access code
      # (masked; handed to the harness, never printed).
      - name: Reset and seed the lab database
        run: |
          out="$(mktemp)"
          if ! pnpm db:reset > "${out}"; then
            sed '/access code/d' "${out}"
            exit 1
          fi
          url="$(sed -n 's/^DATABASE_URL=//p' "${out}" | head -n 1)"
          code="$(grep -oE 'FA-[0-9A-Z]{5}(-[0-9A-Z]{5}){3}' "${out}" | head -n 1 || true)"
          rm -f "${out}"
          if [ -z "${url}" ] || [ -z "${code}" ]; then
            echo "::error::db:reset did not print DATABASE_URL and an owner access code"
            exit 1
          fi
          echo "::add-mask::${code}"
          {
            echo "DATABASE_URL=${url}"
            echo "E2E_OWNER_ACCESS_CODE=${code}"
          } >> "${GITHUB_ENV}"

      # A committed baseline (ops/lab/baselines/<suite>-<id>.json) wins; otherwise that run's public summary.
      - name: Fetch the baseline summary
        if: env.LAB_BASELINE_RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "ops/lab/baselines/${LAB_SUITE}-${LAB_BASELINE_RUN_ID}.json" ]; then
            echo "Baseline: ops/lab/baselines/${LAB_SUITE}-${LAB_BASELINE_RUN_ID}.json"
          elif ! gh run download "${LAB_BASELINE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
              -n "conversation-lab-summary-${LAB_SUITE}-${LAB_BASELINE_RUN_ID}" -D "${RUNNER_TEMP}/baseline"; then
            echo "::warning::No ${LAB_SUITE} summary of run ${LAB_BASELINE_RUN_ID} (public summaries are kept 7 days); no comparison."
          fi

      - name: Resolve the conversation-lab role
        env:
          RAW_DEPLOY_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          # The account id comes from the deploy role secret (an ARN or the 12-digit id); it is masked, never printed.
          role="$(printf '%s' "${RAW_DEPLOY_ROLE}" | tr -d "[:space:]\"'")"
          if [[ "${role}" =~ ^([0-9]{12})$ ]] || [[ "${role}" =~ ^arn:aws:iam::([0-9]{12}):role/ ]]; then
            account="${BASH_REMATCH[1]}"
          else
            echo "::error::AWS_DEPLOY_ROLE_ARN is not set to a role ARN or a 12-digit account id."
            exit 1
          fi
          echo "::add-mask::${account}"
          lab_role="arn:aws:iam::${account}:role/FoundryAscent-ConversationLab"
          echo "::add-mask::${lab_role}"
          echo "LAB_ROLE_ARN=${lab_role}" >> "${GITHUB_ENV}"

      - name: AWS credentials (GitHub OIDC, conversation-lab)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.LAB_ROLE_ARN }}
          role-session-name: foundry-ascent-lab-${{ github.run_id }}-${{ matrix.suite }}
          role-duration-seconds: 3600
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Mask account id
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ ! "${account}" =~ ^[0-9]{12}$ ]]; then
            echo "::error::sts:GetCallerIdentity did not return a 12-digit account id"
            exit 1
          fi
          echo "::add-mask::${account}"

      - name: Run the ${{ matrix.suite }} suite
        working-directory: ops/lab
        env:
          PYTHONPATH: ${{ github.workspace }}/evals
        run: |
          python -m conversation_lab run --suite "${LAB_SUITE}" --budget-usd "${LAB_BUDGET_USD}" \
            --max-scenarios "${LAB_MAX_SCENARIOS}" --out "${LAB_OUT}" \
            --baseline-run-id "${LAB_BASELINE_RUN_ID}" --baseline-file "${RUNNER_TEMP}/baseline/summary.json" \
            --scenarios "${LAB_SCENARIO_IDS}" --repeat "${LAB_REPEAT}" --matrix-source "${LAB_MATRIX_SOURCE}"

      - name: Seal the private outputs
        if: always() && env.LAB_PUBLIC_KEY != ''
        run: |
          set -euo pipefail
          sealed="${RUNNER_TEMP}/lab-sealed"
          if [ -d "${LAB_OUT}/private" ]; then
            pnpm --filter @foundry/api exec tsx src/scripts/lab-seal.ts seal "${LAB_SUITE}" "${LAB_OUT}/private" "${sealed}"
          fi
          rm -rf "${LAB_OUT}/private"
          # Only sealed envelopes may be uploaded.
          for file in "${sealed}"/*.json; do
            [ -e "${file}" ] || continue
            if ! jq -e '(keys == ["envelope","kind"]) and .kind == "conversation-lab" and (.envelope | keys) == ["alg","data","iv","key","kid","tag","v"] and .envelope.alg == "RSA-OAEP-256+A256GCM+gzip"' "${file}" > /dev/null; then
              echo "::error::$(basename "${file}") is not a sealed envelope; nothing is uploaded."
              rm -rf "${sealed}"
              exit 1
            fi
          done

      - name: Remove the private outputs
        if: always()
        run: rm -rf "${LAB_OUT}/private" "${{ github.workspace }}/apps/web/test-results"

      - name: Upload the sealed outputs (1 day)
        if: always() && env.LAB_PUBLIC_KEY != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conversation-lab-sealed-${{ matrix.suite }}-${{ github.run_id }}
          path: ${{ runner.temp }}/lab-sealed
          retention-days: 1
          if-no-files-found: ignore

      # Numbers, ids, codes and fixed titles only (conversation_lab/report.py), like the job summary.
      - name: Upload the public summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conversation-lab-summary-${{ matrix.suite }}-${{ github.run_id }}
          path: ${{ runner.temp }}/lab/public
          retention-days: 7
          if-no-files-found: ignore
